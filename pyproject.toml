[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-generator"
version = "1.2.0"
description = "Turn MITRE ATT&CK techniques and threat groups into draft Sigma rules, attack-chain correlation rules and STIX 2.1 bundles."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["sigma", "mitre", "attack", "stix", "detection-engineering", "threat-intelligence"]
classifiers = [
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.16.10",
    "mypy==1.19.1",
    "types-PyYAML==6.0.12.20250915",
    "types-requests==2.32.4.20260107",
]
strict = ["pysigma>=0.11"]

[project.scripts]
sigma-gen = "sigma_generator.main:main"

[tool.setuptools]
package-dir = { "sigma_generator" = "src", "sigma_generator.templates" = "src/templates", "sigma_generator.web" = "src/web" }
packages = ["sigma_generator", "sigma_generator.templates", "sigma_generator.web"]

[tool.setuptools.package-data]
"sigma_generator" = ["data/*.yml"]
"sigma_generator.templates" = ["*.yml"]
"sigma_generator.web" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The corpus snapshot needs the pinned ATT&CK bundle; run it with `pytest -m corpus`.
addopts = "-m 'not corpus'"
markers = [
    "corpus: full-corpus snapshot against tests/corpus/baseline.json (needs `python -m tools.corpus fetch`)",
]

[tool.mypy]
# Type-check the package and the dev tools against the oldest supported interpreter.
python_version = "3.9"
files = ["src", "tools"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["docs", "output", "data"]

[tool.ruff.lint]
# pyflakes and pycodestyle errors only; formatting is not enforced.
select = ["E4", "E7", "E9", "F"]

[[tool.mypy.overrides]]
# pySigma is optional (`pip install .[strict]`); its import is guarded at runtime.
module = ["sigma.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Frozen with the validation protocol's seed commit; not edited for style.
"tools/validation.py" = ["F541"]
