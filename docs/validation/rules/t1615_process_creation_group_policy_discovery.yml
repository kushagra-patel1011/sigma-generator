title: Potential Group Policy Discovery Activity Via Process Creation
id: 68407883-62b1-5b15-9c91-65c22d6656d2
status: experimental
description: |
    Draft detection for T1615 (Group Policy Discovery), derived from ATT&CK detection strategy
    DET0055 / analytic AN0152.
    Adversaries may gather information on Group Policy settings to identify paths for privilege
    escalation, security measures applied within a domain, and to discover patterns in domain
    objects that can be manipulated or used to blend in the environment. Group Policy allows for
    centralized management of user and computer settings in Active Directory (AD).
    ATT&CK analytic: Detection of adversary attempts to enumerate Group Policy settings through
    suspicious command execution (gpresult), PowerShell enumeration (Get-DomainGPO, Get-
    DomainGPOLocalGroup), and abnormal LDAP queries targeting groupPolicyContainer objects.
    Defenders observe unusual process lineage, script execution, or LDAP filter activity against
    domain controllers.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
