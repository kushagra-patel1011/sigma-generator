title: Potential Winlogon Helper DLL Activity Via Process Creation
id: b82c5276-8c14-51df-9380-d4c55a744626
status: experimental
description: |
    Draft detection for T1547.004 (Winlogon Helper DLL), derived from ATT&CK detection strategy
    DET0404 / analytic AN1133.
    Adversaries may abuse features of Winlogon to execute DLLs and/or executables when a user logs
    in. Winlogon.exe is a Windows component responsible for actions at logon/logoff as well as the
    secure attention sequence (SAS) triggered by Ctrl-Alt-Delete.
    ATT&CK analytic: Monitor Windows Registry modifications to Winlogon keys (Shell, Userinit,
    Notify) that introduce new executable or DLL paths. Correlate these changes with subsequent DLL
    loading, image loads, or process creation originating from winlogon.exe or userinit.exe.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
