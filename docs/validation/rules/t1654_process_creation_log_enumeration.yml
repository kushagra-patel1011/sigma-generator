title: Potential Log Enumeration Activity Via Process Creation
id: b1c52a46-7ca0-5cc5-827a-181e57a5f54e
status: experimental
description: |
    Draft detection for T1654 (Log Enumeration), derived from ATT&CK detection strategy DET0255 /
    analytic AN0705.
    Adversaries may enumerate system and service logs to find useful data. These logs may highlight
    various types of valuable insights for an adversary, such as user authentication records
    (Account Discovery), security or vulnerable software (Software Discovery), or hosts within a
    compromised network (Remote System Discovery).
    ATT&CK analytic: Monitor for use of native utilities such as wevtutil.exe or PowerShell cmdlets
    (Get-WinEvent, Get-EventLog) to enumerate or export logs. Unusual access to security or system
    event channels, especially by non-administrative users or processes, should be correlated with
    subsequent file export or network transfer activity.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
