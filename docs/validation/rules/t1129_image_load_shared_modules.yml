title: Potential Shared Modules Activity Via Module Load
id: 7be74a91-a62c-5362-a180-154163ec0972
status: experimental
description: |
    Draft detection for T1129 (Shared Modules), derived from ATT&CK detection strategy DET0018 /
    analytic AN0052.
    Adversaries may execute malicious payloads via loading shared modules. Shared modules are
    executable files that are loaded into processes to provide access to reusable code, such as
    specific custom functions or invoking OS API functions (i.e., Native API).
    ATT&CK analytic: A process (often LOLBin or user-launched program) loads a DLL from a user-
    writable/UNC/Temp path or unsigned/invalid signer. Within a short window the DLL is (a) newly
    written to disk, (b) spawned as follow-on execution (rundll32/regsvr32), or (c) establishes
    outbound C2.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
