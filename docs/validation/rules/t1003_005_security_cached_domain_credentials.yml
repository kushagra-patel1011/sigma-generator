title: Potential Cached Domain Credentials Activity Via Windows Security
id: 85a2c616-e786-5db3-82f6-13e673c5bf4b
status: experimental
description: |
    Draft detection for T1003.005 (Cached Domain Credentials), derived from ATT&CK detection
    strategy DET0513 / analytic AN1417.
    Adversaries may attempt to access cached domain credentials used to allow authentication to
    occur in the event a domain controller is unavailable. On Windows Vista and newer, the hash
    format is DCC2 (Domain Cached Credentials version 2) hash, also known as MS-Cache v2 hash.
    ATT&CK analytic: Detects adversary behavior accessing Windows cached domain credential files
    using tools like Mimikatz, reg.exe, or PowerShell, often combined with registry exports or LSASS
    memory scraping.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
