title: Potential Office Template Macros Activity Via File Creation
id: bc89f8a9-499b-5b40-a400-e659d5bd65de
status: experimental
description: |
    Draft detection for T1137.001 (Office Template Macros), derived from ATT&CK detection strategy
    DET0519 / analytic AN1436.
    Adversaries may abuse Microsoft Office templates to obtain persistence on a compromised system.
    Microsoft Office contains templates that are part of common Office applications and are used to
    customize styles.
    ATT&CK analytic: Adversaries inject VBA macros into Office templates such as Normal.dotm or
    Personal.xlsb or redirect Office template load path via registry key (GlobalDotName) to gain
    persistence. Template macros trigger execution of malicious code on application startup.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
