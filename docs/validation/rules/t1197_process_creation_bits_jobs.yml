title: Potential BITS Jobs Activity Via Process Creation
id: c52008b8-73a1-59a0-a2c2-bb8ad40892e6
status: experimental
description: |
    Draft detection for T1197 (BITS Jobs), derived from ATT&CK detection strategy DET0098 / analytic
    AN0274.
    Adversaries may abuse BITS jobs to persistently execute code and perform various background
    tasks. Windows Background Intelligent Transfer Service (BITS) is a low-bandwidth, asynchronous
    file transfer mechanism exposed through Component Object Model (COM).
    ATT&CK analytic: Behavioral chain: (1) An actor creates or modifies a BITS job via
    bitsadmin.exe, PowerShell BITS cmdlets, or COM; (2) the job performs HTTP(S)/SMB network
    transfers while the owning user is logged on; (3) upon job completion/error, BITS launches a
    notify command (SetNotifyCmdLine) from svchost.exe -k netsvcs -s BITS, often establishing
    persistence by keeping long-lived jobs....
