title: Potential Windows Management Instrumentation Event Subscription Activity Via Process Creation
id: d23e9d0c-e5be-5e4a-b7e0-3cb62770b59c
status: experimental
description: |
    Draft detection for T1546.003 (Windows Management Instrumentation Event Subscription), derived
    from ATT&CK detection strategy DET0086 / analytic AN0236.
    Adversaries may establish persistence and elevate privileges by executing malicious content
    triggered by a Windows Management Instrumentation (WMI) event subscription. WMI can be used to
    install event filters, providers, consumers, and bindings that execute code when a defined event
    occurs.
    ATT&CK analytic: Monitor for creation of WMI EventFilter, EventConsumer, and
    FilterToConsumerBinding objects through WMI or MOF file execution. Detect command-line execution
    of `mofcomp.exe`, usage of `Register-WmiEvent` via PowerShell, and anomalous child processes of
    `WmiPrvSE.exe` that indicate triggered execution.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
