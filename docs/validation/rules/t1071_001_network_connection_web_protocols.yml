title: Potential Web Protocols Activity Via Network Connection
id: 82a6a959-35bb-54d5-ac96-3eefd951ab4b
status: experimental
description: |
    Draft detection for T1071.001 (Web Protocols), derived from ATT&CK detection strategy DET0027 /
    analytic AN0075.
    Adversaries may communicate using application layer protocols associated with web traffic to
    avoid detection/network filtering by blending in with existing traffic. Commands to the remote
    system, and often the results of those commands, will be embedded within the protocol traffic
    between the client and server.
    ATT&CK analytic: Detects unexpected or high-volume HTTP/S/WebSocket communication from
    suspicious processes (e.g., PowerShell, rundll32) using uncommon user agents or mimicking
    browser traffic to unusual domains or IPs.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
