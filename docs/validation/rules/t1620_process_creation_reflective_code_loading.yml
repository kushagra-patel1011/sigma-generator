title: Potential Reflective Code Loading Activity Via Process Creation
id: 4d5fe3c5-0cfc-5d90-b50f-8a3f34659818
status: experimental
description: |
    Draft detection for T1620 (Reflective Code Loading), derived from ATT&CK detection strategy
    DET0300 / analytic AN0838.
    Adversaries may reflectively load code into a process in order to conceal the execution of
    malicious payloads. Reflective loading involves allocating then executing payloads directly
    within the memory of the process, vice creating a thread or process backed by a file path on
    disk (e.g., Shared Modules).
    ATT&CK analytic: Detect anomalous chains of memory allocation and execution inside the same
    process (e.g., VirtualAlloc → memcpy → VirtualProtect → CreateThread). Unlike process injection,
    reflective code loading does not perform cross-process memory writes — the suspicious activity
    occurs entirely within the process’s own PID context.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
