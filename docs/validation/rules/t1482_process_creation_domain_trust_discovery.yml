title: Potential Domain Trust Discovery Activity Via Process Creation
id: 3023fbe2-8850-5349-8e2d-2bf59912889a
status: experimental
description: |
    Draft detection for T1482 (Domain Trust Discovery), derived from ATT&CK detection strategy
    DET0007 / analytic AN0016.
    Adversaries may attempt to gather information on domain trust relationships that may be used to
    identify lateral movement opportunities in Windows multi-domain/forest environments. Domain
    trusts provide a mechanism for a domain to allow access to resources based on the authentication
    procedures of another domain.
    ATT&CK analytic: Adversary uses nltest, PowerShell, or Win32/.NET API to enumerate domain trust
    relationships (via DSEnumerateDomainTrusts, GetAllTrustRelationships, or LDAP queries), followed
    by discovery or authentication staging.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
