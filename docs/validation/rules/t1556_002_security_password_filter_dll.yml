title: Potential Password Filter DLL Activity Via Windows Security
id: b4ca9903-c7e3-5cce-b000-31673468f0eb
status: experimental
description: |
    Draft detection for T1556.002 (Password Filter DLL), derived from ATT&CK detection strategy
    DET0472 / analytic AN1303.
    Adversaries may register malicious password filter dynamic link libraries (DLLs) into the
    authentication process to acquire user credentials as they are validated. Windows password
    filters are password policy enforcement mechanisms for both domain and local accounts.
    ATT&CK analytic: Detects suspicious registration of new password filter DLLs into the
    authentication process. Correlates registry modifications to LSASS Notification Packages with
    subsequent DLL creation and loading events.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
