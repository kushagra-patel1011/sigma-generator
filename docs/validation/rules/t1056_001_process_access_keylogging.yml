title: Potential Keylogging Activity Via Process Access
id: 3215070d-085c-5aed-bbcd-cba61620e191
status: experimental
description: |
    Draft detection for T1056.001 (Keylogging), derived from ATT&CK detection strategy DET0089 /
    analytic AN0243.
    Adversaries may log user keystrokes to intercept credentials as the user types them. Keylogging
    is likely to be used to acquire credentials for new access opportunities when OS Credential
    Dumping efforts are not effective, and may require an adversary to intercept keystrokes on a
    system for a substantial period of time before credentials can be successfully captured.
    ATT&CK analytic: Monitors suspicious usage of Windows API calls like SetWindowsHookEx,
    GetKeyState, or polling functions within non-UI service processes, combined with Registry or
    driver modifications.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
