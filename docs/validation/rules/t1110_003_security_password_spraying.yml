description: |
    Draft detection for T1110.003 (Password Spraying), derived from ATT&CK detection strategy
    DET0487 / analytic AN1336.
    Adversaries may use a single or small list of commonly used passwords against many different
    accounts to attempt to acquire valid account credentials. Password spraying uses one password
    (e.g. 'Password01'), or a small list of commonly used passwords, that may match the complexity
    policy of the domain.
    ATT&CK analytic: A high volume of authentication failures using a single password (or small set)
    across many different user accounts within a defined time window
