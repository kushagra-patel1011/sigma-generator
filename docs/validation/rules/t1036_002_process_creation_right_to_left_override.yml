status: experimental
description: |
    Draft detection for T1036.002 (Right-to-Left Override), derived from ATT&CK detection strategy
    DET0527 / analytic AN1461.
    Adversaries may abuse the right-to-left override (RTLO or RLO) character (U+202E) to disguise a
    string and/or file name to make it appear benign. RTLO is a non-printing Unicode character that
    causes the text that follows it to be displayed in reverse.
    ATT&CK analytic: Execution of files containing right-to-left override characters (U+202E) to
    masquerade true file extensions. Often found in phishing payloads or file downloads.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
