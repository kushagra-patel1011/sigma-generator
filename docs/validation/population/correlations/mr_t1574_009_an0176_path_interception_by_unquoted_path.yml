title: Potential Path Interception by Unquoted Path Attack Chain Via 2 Correlated Log Sources
id: 022d8555-7e07-561c-83be-665fb68010ad
status: experimental
description: |
    Draft correlation for T1574.009 (Path Interception by Unquoted Path). ATT&CK analytic AN0176
    (strategy DET0064) describes this technique as 2 observable behaviours; this rule fires when all
    of them occur on the same host within 10m.
    Steps: 1) File Creation; 2) Alternate Data Stream Creation.
    ATT&CK analytic: Unquoted service or shortcut paths that contain spaces and allow path
    interception by higher-level executables. Defender observes registry service configurations with
    unquoted paths, file creation of executables in parent directories of unquoted paths, and
    subsequent process execution from unexpected locations.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1574/009
    - https://attack.mitre.org/detectionstrategies/DET0064
    - https://attack.mitre.org/detectionstrategies/DET0064#AN0176
    - https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
    - https://securityboulevard.com/2018/04/windows-privilege-escalation-unquoted-services/
    - https://isc.sans.edu/diary/Help+eliminate+unquoted+path+vulnerabilities/14464
author: sigma-generator
date: 2026-09-24
tags:
    - attack.stealth
    - attack.execution
    - attack.t1574
    - attack.t1574.009
correlation:
    type: temporal
    rules:
        - step1_file_event
        - step2_create_stream_hash
    group-by:
        - Computer
    timespan: 10m
falsepositives:
    - Legitimate administrative or software-deployment use of myapp.exe, net.exe
    - 'Environment-specific tuning of MonitoredServices: List of critical services to check for unquoted paths in ImagePath registry keys.'
    - 'Environment-specific tuning of SuspiciousBinaryList: Executables with names matching potential interception targets (e.g., program.exe, net.exe).'
    - 'Environment-specific tuning of TimeWindow: Correlation interval between file creation in parent directories and execution of unquoted path process.'
    - Unknown
level: high
---
title: 'Path Interception by Unquoted Path - Step 1: File Creation'
id: 8627764a-b412-5f97-828e-8b2e8fea0b77
name: step1_file_event
logsource:
    category: file_event
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - ':\program'
            - ':\safe'
            - ':\unsafe'
    condition: selection_path
---
title: 'Path Interception by Unquoted Path - Step 2: Alternate Data Stream Creation'
id: eeea9071-e0af-5e8e-9ffa-a187383db815
name: step2_create_stream_hash
logsource:
    category: create_stream_hash
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\myapp.exe'
            - '\net.exe'
    condition: selection_image
