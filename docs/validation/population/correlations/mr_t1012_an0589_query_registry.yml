title: 'Query Registry - Step 2: Registry Modification'
id: 6f0adf8c-db13-5ecb-a3d6-88dea17e6dd2
name: step2_registry_set
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains:
            - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
    condition: selection_registry
