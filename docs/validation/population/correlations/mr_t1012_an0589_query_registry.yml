---
title: 'Query Registry - Step 1: Process Creation'
id: 9ebe0593-02a0-5c85-9aeb-cbb2d3fb0651
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\mshta.exe'
            - '\wscript.exe'
    condition: selection_image
