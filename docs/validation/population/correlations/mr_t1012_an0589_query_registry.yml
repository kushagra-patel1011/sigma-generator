title: Potential Query Registry Attack Chain Via Process Creation And Registry Modification
id: 14d8c557-2404-5927-a773-2142797a39e4
status: experimental
description: |
    Draft correlation for T1012 (Query Registry). ATT&CK analytic AN0589 (strategy DET0209)
    describes this technique as 2 observable behaviours; this rule fires when all of them occur on
    the same host within 10m.
    Steps: 1) Process Creation; 2) Registry Modification.
    ATT&CK analytic: Registry read access associated with suspicious or non-interactive processes
    querying system config, installed software, or security settings.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
