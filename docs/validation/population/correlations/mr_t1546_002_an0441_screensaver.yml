title: 'Screensaver - Step 1: Process Creation'
id: 95ec7f5e-ce4a-5158-9e24-abc7e9996797
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\reg.exe'
            - '\scrnsave.exe'
            - '\scrnsave.scr'
    selection_indicator_content:
        CommandLine|contains:
            - user32.dll
    condition: selection_image and selection_indicator_content
