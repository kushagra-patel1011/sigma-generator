title: Potential Domain Trust Discovery Attack Chain Via 2 Correlated Log Sources
id: b704f2ae-29b0-5269-a51a-1cb0f6ba3bea
status: experimental
description: |
    Draft correlation for T1482 (Domain Trust Discovery). ATT&CK analytic AN0016 (strategy DET0007)
    describes this technique as 2 observable behaviours; this rule fires when all of them occur on
    the same host within 10m.
    Steps: 1) Process Creation; 2) PowerShell Script Block Logging.
