title: 'Domain Trust Discovery - Step 1: Process Creation'
id: b490cdb7-16e4-512c-902d-526a25d3a975
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\nltest.exe'
    condition: selection_image
---
title: 'Domain Trust Discovery - Step 2: PowerShell Script Block Logging'
id: 58e3aa97-70aa-5778-9724-4e75c56b601e
name: step2_ps_script
logsource:
    category: ps_script
    product: windows
    definition: Script block logging must be enabled
detection:
    selection_indicator_content:
        ScriptBlockText|contains:
            - Get-ADTrust
    condition: selection_indicator_content
