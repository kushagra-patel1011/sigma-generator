title: Potential Device Driver Discovery Attack Chain Via Process Creation And Registry Modification
id: ba4a5fb8-f163-5001-9a17-63d50bf34526
status: experimental
description: |
    Draft correlation for T1652 (Device Driver Discovery). ATT&CK analytic AN1595 (strategy DET0579)
    describes this technique as 2 observable behaviours; this rule fires when all of them occur on
    the same host within 10m.
    Steps: 1) Process Creation; 2) Registry Modification.
    ATT&CK analytic: Monitor for suspicious usage of driver enumeration utilities (driverquery.exe)
    or API calls such as EnumDeviceDrivers(). Registry queries against
    HKLM\SYSTEM\CurrentControlSet\Services and HardwareProfiles that are abnormal may also indicate
    attempts to discover installed drivers and services.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1652
    - https://attack.mitre.org/detectionstrategies/DET0579
    - https://attack.mitre.org/detectionstrategies/DET0579#AN1595
    - https://man7.org/linux/man-pages/man8/lsmod.8.html
    - https://learn.microsoft.com/windows-hardware/drivers/install/overview-of-registry-trees-and-keys
    - https://learn.microsoft.com/windows/win32/api/psapi/nf-psapi-enumdevicedrivers
author: sigma-generator
date: 2026-09-24
tags:
    - attack.discovery
    - attack.t1652
correlation:
    type: temporal
    rules:
        - step1_process_creation
        - step2_registry_set
    group-by:
        - Computer
    timespan: 10m
falsepositives:
    - Legitimate administrative or software-deployment use of driverquery.exe
    - 'Environment-specific tuning of AllowedUtilities: Whitelist expected administrative usage of driverquery.exe or other enumeration utilities.'
    - 'Environment-specific tuning of TimeWindow: Correlation window between process creation and registry queries to identify suspicious chaining of events.'
    - Unknown
level: low
---
title: 'Device Driver Discovery - Step 1: Process Creation'
id: bebc4ec5-1fe8-5863-80f2-a3bb54a8b8b4
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\driverquery.exe'
    condition: selection_image
---
title: 'Device Driver Discovery - Step 2: Registry Modification'
id: 68b4987e-df83-5216-9876-58373c3510a5
name: step2_registry_set
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains:
            - '\SYSTEM\CurrentControlSet\Services'
    condition: selection_registry
