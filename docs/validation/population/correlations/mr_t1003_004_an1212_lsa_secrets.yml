title: Potential LSA Secrets Attack Chain Via Process Creation And Module Load
id: a89fa567-729e-52e4-84ff-8b8d75100414
status: experimental
description: |
    Draft correlation for T1003.004 (LSA Secrets). ATT&CK analytic AN1212 (strategy DET0437)
    describes this technique as 2 observable behaviours; this rule fires when all of them occur on
    the same host within 10m.
    Steps: 1) Process Creation; 2) Module Load.
    ATT&CK analytic: Detects adversary activity aimed at accessing LSA Secrets, including registry
    key export of HKEY_LOCAL_MACHINE\SECURITY\Policy\Secrets or memory scraping via tools such as
    Mimikatz or PowerSploit's Invoke-Mimikatz.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1003/004
    - https://attack.mitre.org/detectionstrategies/DET0437
    - https://attack.mitre.org/detectionstrategies/DET0437#AN1212
    - https://www.first.org/resources/papers/conf2017/Windows-Credentials-Attacks-and-Mitigation-Techniques.pdf
    - https://ired.team/offensive-security/credential-access-and-credential-dumping/dumping-lsa-secrets
    - https://docs.microsoft.com/en-us/windows-server/identity/securing-privileged-access/securing-privileged-access-reference-material?redirectedfrom=MSDN
author: sigma-generator
date: 2026-09-24
tags:
    - attack.credential-access
    - attack.t1003
    - attack.t1003.004
correlation:
    type: temporal
    rules:
        - step1_process_creation
        - step2_image_load
    group-by:
        - Computer
    timespan: 10m
falsepositives:
    - Legitimate administrative or software-deployment use of mimikatz.exe
    - 'Environment-specific tuning of TargetObject: Target registry paths like HKLM\SECURITY\Policy\Secrets or variants can be tuned depending on OS version or...'
    - 'Environment-specific tuning of ImageLoaded: Module names such as `lsasrv.dll`, `sechost.dll`, or suspicious DLLs loaded by user processes may require...'
    - 'Environment-specific tuning of AccessMask: Tuning based on whether processes are using specific sensitive access rights (e.g., 0x2 or 0x4).'
    - Unknown
level: critical
---
title: 'LSA Secrets - Step 1: Process Creation'
id: ee45a451-3ee2-5186-8670-2a9f21908c47
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_indicator_content:
        CommandLine|contains:
            - '\SECURITY\Policy\Secrets'
            - Invoke-Mimikatz
    condition: selection_indicator_content
---
title: 'LSA Secrets - Step 2: Module Load'
id: 3437b1f5-ce78-55eb-846f-9216cad056c1
name: step2_image_load
logsource:
    category: image_load
    product: windows
detection:
    selection_loaded:
        ImageLoaded|endswith:
            - '\lsasrv.dll'
            - '\sechost.dll'
    selection_indicator_source:
        Image|endswith:
            - '\mimikatz.exe'
    condition: selection_loaded and selection_indicator_source
