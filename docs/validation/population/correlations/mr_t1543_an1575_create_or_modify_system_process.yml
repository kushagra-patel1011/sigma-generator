title: Potential Create or Modify System Process Attack Chain Via 2 Correlated Log Sources
id: 50096677-8f74-5652-aaae-8d52c8912b97
status: experimental
description: |
    Draft correlation for T1543 (Create or Modify System Process). ATT&CK analytic AN1575 (strategy
    DET0571) describes this technique as 2 observable behaviours; this rule fires when all of them
    occur on the same host within 10m.
    Steps: 1) Windows Security; 2) Registry Modification.
    ATT&CK analytic: Detects command-line or API-based creation/modification of Windows Services via
    `sc.exe`, `powershell.exe`, `services.exe`, or `ChangeServiceConfig`. Looks for
    creation/modification of autostart services via registry changes, file drops to
    `System32\services`, and anomalous parent-child process trees.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1543
    - https://attack.mitre.org/detectionstrategies/DET0571
    - https://attack.mitre.org/detectionstrategies/DET0571#AN1575
    - https://developer.apple.com/library/content/documentation/MacOSX/Conceptual/BPSystemStartup/Chapters/CreatingLaunchdJobs.html
    - https://technet.microsoft.com/en-us/library/cc772408.aspx
    - https://papers.put.as/papers/macosx/2016/RSA_OSX_Malware.pdf
author: sigma-generator
date: 2026-09-24
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1543
correlation:
    type: temporal
    rules:
        - step1_security
        - step2_registry_set
    group-by:
        - Computer
    timespan: 10m
falsepositives:
    - Legitimate administrative or software-deployment use of sc.exe
    - 'Environment-specific tuning of ServiceNamePattern: Regex patterns to flag unusual service names or binaries'
    - 'Environment-specific tuning of ParentProcessFilter: List of non-administrative processes starting service management tools'
    - 'Environment-specific tuning of RegistryPathList: Monitored autorun locations (e.g., `HKLM\System\CurrentControlSet\Services`)'
    - Unknown
level: high
---
title: 'Create or Modify System Process - Step 1: Windows Security'
id: dd718746-365a-545f-86f8-9b499eed4472
name: step1_security
logsource:
    product: windows
    service: security
detection:
    selection_source:
        EventID: 4697
    selection_image:
        ServiceFileName|endswith:
            - '\sc.exe'
    condition: selection_source and selection_image
---
title: 'Create or Modify System Process - Step 2: Registry Modification'
id: cfe20d64-740f-5b98-8afe-90f81c5da116
name: step2_registry_set
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains:
            - '\System\CurrentControlSet\Services'
    condition: selection_registry
