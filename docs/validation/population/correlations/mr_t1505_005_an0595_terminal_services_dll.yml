---
title: 'Terminal Services DLL - Step 1: Windows Security'
id: 44a552a3-7c37-5dd6-9a41-d862ed4db2e7
name: step1_security
logsource:
    product: windows
    service: security
detection:
    selection_source:
        EventID: 4657
    selection_registry:
        ObjectName|contains:
            - '\System\CurrentControlSet\services\TermService\Parameters'
    selection_indicator_source:
        ProcessName|endswith:
            - '\termsrv.exe'
    condition: selection_source and selection_registry and selection_indicator_source
