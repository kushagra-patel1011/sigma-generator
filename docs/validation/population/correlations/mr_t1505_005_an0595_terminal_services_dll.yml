title: Potential Terminal Services DLL Attack Chain Via Windows Security And Module Load
id: 5129538d-c5f5-51d5-b438-943e09363ab9
status: experimental
description: |
    Draft correlation for T1505.005 (Terminal Services DLL). ATT&CK analytic AN0595 (strategy
    DET0212) describes this technique as 2 observable behaviours; this rule fires when all of them
    occur on the same host within 10m.
    Steps: 1) Windows Security; 2) Module Load.
    ATT&CK analytic: Adversary modifies or replaces the Terminal Services DLL (`termsrv.dll`) or
    changes the associated `ServiceDll` Registry value to load an arbitrary or patched DLL that
    enables persistent and enhanced RDP access. This may include binary replacement, registry
    tampering, and unexpected module loads by the `svchost.exe -k termsvcs` process.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
