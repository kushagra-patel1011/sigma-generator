title: 'Terminal Services DLL - Step 2: Module Load'
id: 42973e31-8406-53a8-8468-a802d5151f9c
name: step2_image_load
logsource:
    category: image_load
    product: windows
detection:
    selection_loaded:
        ImageLoaded|endswith:
            - '\termsrv.dll'
    condition: selection_loaded
