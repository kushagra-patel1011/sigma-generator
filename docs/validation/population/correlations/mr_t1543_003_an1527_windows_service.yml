title: Potential Windows Service Attack Chain Via Windows Security And Registry Modification
id: 5cb2a937-b668-59a5-b0d9-ea089ec989f6
status: experimental
description: |
    Draft correlation for T1543.003 (Windows Service). ATT&CK analytic AN1527 (strategy DET0552)
    describes this technique as 2 observable behaviours; this rule fires when all of them occur on
    the same host within 10m.
    Steps: 1) Windows Security; 2) Registry Modification.
    ATT&CK analytic: Detects creation or modification of Windows Services through command-line tools
    (e.g., `sc.exe`, `powershell.exe`), Registry key changes under
    `HKLM\System\CurrentControlSet\Services`, and service execution under SYSTEM with unsigned or
    anomalous binary paths. Detects privilege escalation via driver installation or `CreateServiceW`
    usage.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1543/003
    - https://attack.mitre.org/detectionstrategies/DET0552
    - https://attack.mitre.org/detectionstrategies/DET0552#AN1527
    - https://docs.microsoft.com/windows/security/threat-protection/use-windows-event-forwarding-to-assist-in-intrusion-detection
    - https://www.welivesecurity.com/wp-content/uploads/2020/06/ESET_InvisiMole.pdf
    - https://www.sans.org/blog/red-team-tactics-hiding-windows-services/
author: sigma-generator
date: 2026-09-24
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1543
    - attack.t1543.003
correlation:
    type: temporal
    rules:
        - step1_security
        - step2_registry_set
    group-by:
        - Computer
    timespan: 10m
falsepositives:
    - Legitimate administrative or software-deployment use of pnputil.exe, powershell.exe, sc.exe
    - 'Environment-specific tuning of ServiceNamePattern: Regex for suspicious or uncommon service names (e.g., `svhostx`, `winhelp`, etc.)'
    - 'Environment-specific tuning of ImagePathFilter: Flag services whose image path resides in uncommon directories (e.g., `C:\Users\`, `C:\Temp\`)'
    - 'Environment-specific tuning of DriverExtensionList: Watch for `.sys` files loaded by `sc`, Registry, or `ZwLoadDriver` APIs'
    - Unknown
level: critical
---
title: 'Windows Service - Step 1: Windows Security'
id: b28eab61-4bed-531c-84a0-53d297a0daf4
name: step1_security
logsource:
    product: windows
    service: security
detection:
    selection_source:
        EventID: 4697
    selection_image:
        ServiceFileName|endswith:
            - '\pnputil.exe'
            - '\powershell.exe'
            - '\sc.exe'
    selection_indicator_content:
        ServiceFileName|contains:
            - Get-Service
    condition: selection_source and selection_image and selection_indicator_content
---
title: 'Windows Service - Step 2: Registry Modification'
id: 41072c5e-1402-5996-a260-e75e398108d2
name: step2_registry_set
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains:
            - '\System\CurrentControlSet\Services'
    condition: selection_registry
