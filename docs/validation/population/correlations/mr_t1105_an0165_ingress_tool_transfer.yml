title: Potential Ingress Tool Transfer Attack Chain Via Network Connection And Process Creation
id: d16a8fc9-2c1e-522f-a4d7-cd16b40e9aef
status: experimental
description: |
    Draft correlation for T1105 (Ingress Tool Transfer). ATT&CK analytic AN0165 (strategy DET0060)
    describes this technique as 2 observable behaviours; this rule fires when all of them occur on
    the same host within 10m.
    Steps: 1) Network Connection; 2) Process Creation.
    ATT&CK analytic: Unusual or uncommon processes initiate network connections to external
    destinations followed by file creation (tools downloaded).
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
