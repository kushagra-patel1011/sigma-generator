title: 'Ingress Tool Transfer - Step 1: Network Connection'
id: 73f066ad-fc75-5dd7-8577-6e4a6183dc0a
name: step1_network_connection
logsource:
    category: network_connection
    product: windows
detection:
    selection_source:
        Initiated: true
    selection_image:
        Image|endswith:
            - '\certutil.exe'
            - '\curl.exe'
            - '\scp.exe'
            - '\sftp.exe'
    condition: selection_source and selection_image
---
title: 'Ingress Tool Transfer - Step 2: Process Creation'
id: c1950654-a1dc-5b5e-aea8-43a0214acf1a
name: step2_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
    selection_indicator_content:
        CommandLine|contains:
            - -hashfile
