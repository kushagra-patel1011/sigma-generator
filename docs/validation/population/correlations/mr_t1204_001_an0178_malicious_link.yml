title: 'Malicious Link - Step 1: Process Creation'
id: be93b5b0-9f66-539b-a0f8-9f929c8ea962
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\chrome.exe'
            - '\firefox.exe'
            - '\msedge.exe'
            - '\outlook.exe'
            - '\teams.exe'
            - '\winword.exe'
    condition: selection_image
