title: Potential Malicious Link Attack Chain Via Process Creation And File Creation
id: 45c487f8-12a0-564f-8b03-acd088f11e2b
status: experimental
description: |
    Draft correlation for T1204.001 (Malicious Link). ATT&CK analytic AN0178 (strategy DET0066)
    describes this technique as 2 observable behaviours; this rule fires when all of them occur on
    the same host within 10m.
    Steps: 1) Process Creation; 2) File Creation.
    ATT&CK analytic: Behavioral chain: (1) a user-facing app (browser/Office/email client) launches
    a URL or handles a link, then (2) the same process lineage makes an outbound connection to an
    untrusted domain/IP, (3) a file is downloaded or unpacked to a user-writable location shortly
    after the click. Optional enrichment: subsequent child execution by LOLBINs.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1204/001
    - https://attack.mitre.org/detectionstrategies/DET0066
    - https://attack.mitre.org/detectionstrategies/DET0066#AN0178
author: sigma-generator
date: 2026-09-24
tags:
    - attack.execution
    - attack.t1204
    - attack.t1204.001
correlation:
    type: temporal
    rules:
        - step1_process_creation
        - step2_file_event
    group-by:
        - Computer
    timespan: 10m
falsepositives:
    - Legitimate administrative or software-deployment use of chrome.exe, firefox.exe, msedge.exe
    - 'Environment-specific tuning of TimeWindow: Correlation window (e.g., 15m) between link click / first egress / file write.'
    - 'Environment-specific tuning of BrowserParents: Processes considered link sources: chrome.exe, msedge.exe, firefox.exe, winword.exe, outlook.exe, teams.exe.'
    - 'Environment-specific tuning of UserPaths: User-writable directories to monitor (%USERPROFILE%\Downloads, %TEMP%, %APPDATA%\*, OneDrive caches).'
    - Unknown
level: high
