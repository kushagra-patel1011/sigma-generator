title: Potential System Time Discovery Burst Via Process Creation
id: edf9adbb-5b10-5797-b8ac-de744c0b521b
status: experimental
description: |
    Draft threshold correlation for T1124 (System Time Discovery). ATT&CK analytic AN0430 (strategy
    DET0151) describes volume ("High-frequency"); this rule fires when 10 or more matching events
    occur for the same User within 15m.
    ATT&CK analytic: Untrusted or unusual process/script (cmd.exe, powershell.exe, w32tm.exe,
    net.exe, custom binaries) queries system time/timezone (e.g., w32tm /tz, net time \\host, Get-
    TimeZone, GetTickCount API) and (optionally) is followed within a short window by time-based
    scheduling or conditional execution (e.g., schtasks /create, at.exe, PowerShell Start-Sleep with
    large values).
    Generated draft - the threshold and base selection must be tuned against real telemetry before
    this rule is deployed.
references:
