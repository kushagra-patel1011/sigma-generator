title: Potential Control Panel Attack Chain Via Process Creation And Registry Key Creation
id: 0cc99397-2247-5a5b-aaa3-ae11ef17b6a3
status: experimental
description: |
    Draft correlation for T1218.002 (Control Panel). ATT&CK analytic AN0558 (strategy DET0194)
    describes this technique as 2 observable behaviours; this rule fires when all of them occur on
    the same host within 10m.
    Steps: 1) Process Creation; 2) Registry Key Creation.
    ATT&CK analytic: Execution of control.exe or rundll32.exe with parameters pointing to CPL files,
    especially from non-standard directories or newly created files, followed by suspicious child
    process execution or registry modifications registering new Control Panel items.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1218/002
    - https://attack.mitre.org/detectionstrategies/DET0194
    - https://attack.mitre.org/detectionstrategies/DET0194#AN0558
    - https://blog.trendmicro.com/trendlabs-security-intelligence/control-panel-files-used-as-malicious-attachments/
    - https://researchcenter.paloaltonetworks.com/2017/11/unit42-new-malware-with-ties-to-sunorcal-discovered/
    - https://www.welivesecurity.com/wp-content/uploads/2020/06/ESET_InvisiMole.pdf
author: sigma-generator
date: 2026-09-24
tags:
    - attack.stealth
    - attack.t1218
    - attack.t1218.002
correlation:
    type: temporal
    rules:
        - step1_process_creation
        - step2_registry_add
    group-by:
        - Computer
    timespan: 10m
falsepositives:
    - Legitimate administrative or software-deployment use of control.exe
    - 'Environment-specific tuning of CPLPathRegex: Regex to match CPL file paths; tune to exclude legitimate CPLs in System32'
    - 'Environment-specific tuning of ParentProcessName: Helps filter known parent processes that legitimately use control.exe'
    - 'Environment-specific tuning of NewFileTimeWindow: Time delta between CPL file creation and execution to detect rapid execution of newly dropped files'
    - Unknown
level: medium
---
title: 'Control Panel - Step 1: Process Creation'
id: 47454cc7-1473-5636-89cf-ab4de517049a
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\control.exe'
    condition: selection_image
