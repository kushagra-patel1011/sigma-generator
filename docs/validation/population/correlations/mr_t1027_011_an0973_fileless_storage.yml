---
title: 'Fileless Storage - Step 1: Windows Security'
id: ef356270-5458-5102-8eab-2f9890a1678d
name: step1_security
logsource:
    product: windows
    service: security
detection:
    selection_source:
        EventID: 4657
    selection_registry:
        ObjectName|contains:
            - '\Software\Classes\'
    condition: selection_source and selection_registry
---
title: 'Fileless Storage - Step 2: Windows Application'
id: 4065fa43-370b-55eb-8ac9-bd0c857fc2f7
name: step2_application
logsource:
    product: windows
    service: application
detection:
    selection_indicator_content:
        Data|contains:
            - ':\Windows\System32\Config'
            - ':\Windows\System32\Wbem\Repository'
    condition: selection_indicator_content
