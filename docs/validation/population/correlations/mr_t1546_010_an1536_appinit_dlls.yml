title: Potential AppInit DLLs Attack Chain Via Module Load And Registry Modification
id: 55a94df9-2111-5a7c-b933-0965cfeb7680
status: experimental
description: |
    Draft correlation for T1546.010 (AppInit DLLs). ATT&CK analytic AN1536 (strategy DET0557)
    describes this technique as 2 observable behaviours; this rule fires when all of them occur on
    the same host within 10m.
    Steps: 1) Module Load; 2) Registry Modification.
    ATT&CK analytic: Registry key modification to AppInit_DLLs value followed by anomalous DLL
    loading by processes importing user32.dll, especially unsigned or uncommon DLLs, suggesting
    unauthorized AppInit persistence or privilege escalation.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1546/010
    - https://attack.mitre.org/detectionstrategies/DET0557
    - https://attack.mitre.org/detectionstrategies/DET0557#AN1536
    - https://www.endgame.com/blog/technical-blog/ten-process-injection-techniques-technical-survey-common-and-trending-process
    - https://support.microsoft.com/en-us/kb/197571
    - https://msdn.microsoft.com/en-us/library/dn280412
author: sigma-generator
date: 2026-09-24
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.t1546
    - attack.t1546.010
correlation:
    type: temporal
    rules:
        - step1_image_load
        - step2_registry_set
    group-by:
        - Computer
    timespan: 10m
falsepositives:
    - 'Environment-specific tuning of ImagePathWhitelist: Paths or filenames of known-good DLLs to exclude from alerting'
    - 'Environment-specific tuning of UserContext: Context of the user modifying the registry key (e.g., admin vs standard user)'
    - 'Environment-specific tuning of TimeWindow: Temporal threshold for correlating registry modification and DLL load'
    - Unknown
level: critical
---
title: 'AppInit DLLs - Step 1: Module Load'
id: 7626c9ef-6bbd-5280-b8bc-6f1d844eead4
name: step1_image_load
logsource:
    category: image_load
    product: windows
detection:
    selection_loaded:
        ImageLoaded|endswith:
            - '\user32.dll'
    condition: selection_loaded
---
title: 'AppInit DLLs - Step 2: Registry Modification'
id: d15a7c17-1bc6-563a-9e8d-25c3395d52af
name: step2_registry_set
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains:
            - '\Software\Microsoft\Windows NT\CurrentVersion\Windows'
    condition: selection_registry
