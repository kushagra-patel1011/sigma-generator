title: 'Indirect Command Execution - Step 1: Process Creation'
id: 603b6099-d51b-5c5e-822b-8038464776ce
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\curl.exe'
            - '\forfiles.exe'
            - '\msiexec.exe'
            - '\pcalua.exe'
            - '\regsvr32.exe'
            - '\scriptrunner.exe'
            - '\ssh.exe'
            - '\wsl.exe'
    condition: selection_image
