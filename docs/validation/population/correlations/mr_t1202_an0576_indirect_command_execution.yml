title: Potential Indirect Command Execution Attack Chain Via Process Creation And File Creation
id: df77fd91-956e-5eb0-93a8-bc8f3d6cb663
status: experimental
description: |
    Draft correlation for T1202 (Indirect Command Execution). ATT&CK analytic AN0576 (strategy
    DET0200) describes this technique as 2 observable behaviours; this rule fires when all of them
    occur on the same host within 30m.
    Steps: 1) Process Creation; 2) File Creation.
    ATT&CK analytic: Cause→effect chain: (1) A user or service launches an indirection utility
    (e.g., forfiles.exe, pcalua.exe, wsl.exe, scriptrunner.exe, ssh.exe with -o
    ProxyCommand/LocalCommand). (2) That utility spawns a secondary program/command (PowerShell,
    cmd, msiexec, regsvr32, curl, arbitrary EXE) and/or opens outbound network connections.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1202
    - https://attack.mitre.org/detectionstrategies/DET0200
    - https://attack.mitre.org/detectionstrategies/DET0200#AN0576
    - https://www.bleepingcomputer.com/news/security/hackers-abuse-windows-error-reporting-tool-to-deploy-malware/
    - https://cyble.com/blog/threat-actor-targets-manufacturing-industry-with-malware/
    - https://x.com/Evi1cg/status/935027922397573120
author: sigma-generator
date: 2026-09-24
tags:
    - attack.stealth
    - attack.t1202
correlation:
    type: temporal
    rules:
        - step1_process_creation
        - step2_file_event
    group-by:
        - Computer
    timespan: 30m
falsepositives:
    - Legitimate administrative or software-deployment use of curl.exe, forfiles.exe, msiexec.exe
    - 'Environment-specific tuning of TimeWindow: Correlation window between indirect launcher and spawned child/network activity (e.g., 10–30 minutes).'
    - 'Environment-specific tuning of AllowedUtilities: Utilities permitted on admin/Jumphosts (forfiles, wsl, ssh) to reduce noise.'
    - 'Environment-specific tuning of HighRiskChildren: Child images that indicate abuse (powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, mshta.exe...'
