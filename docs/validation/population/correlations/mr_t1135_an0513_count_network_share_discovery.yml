title: Potential Network Share Discovery Across Multiple Hosts Via Network Connection
id: 2b20872b-5299-5e8e-a396-f85ee97669d8
status: experimental
description: |
    Draft threshold correlation for T1135 (Network Share Discovery). ATT&CK analytic AN0513
    (strategy DET0182) describes volume ("bursts"); this rule fires when 5 or more distinct values
    of DestinationHostname occur for the same User within 10m.
    ATT&CK analytic: Process or script enumerates network shares via CLI (net view/net share,
    PowerShell Get-SmbShare/WMI) or OS APIs (NetShareEnum/ srvsvc.NetShareEnumAll RPC) → bursts of
    outbound SMB/RPC connections (445/139, \\host\IPC$ / srvsvc) to many hosts inside a short window
    → optional follow-on file listing or copy operations.
    Generated draft - the threshold and base selection must be tuned against real telemetry before
    this rule is deployed.
references:
