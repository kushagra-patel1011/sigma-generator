title: Potential Office Test Attack Chain Via Registry Modification And Process Creation
id: 035b73f2-66a3-577d-9d57-0a0385a6c622
status: experimental
description: |
    Draft correlation for T1137.002 (Office Test). ATT&CK analytic AN0880 (strategy DET0315)
    describes this technique as 2 observable behaviours; this rule fires when all of them occur on
    the same host within 10m.
    Steps: 1) Registry Modification; 2) Process Creation.
    ATT&CK analytic: Adversaries create the 'Office Test\Special\Perf' registry key and specify a
    malicious DLL path that is auto-loaded when an Office application starts. This DLL is injected
    into the Office process memory space and can provide persistent execution without requiring
    macro enablement.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1137/002
    - https://attack.mitre.org/detectionstrategies/DET0315
    - https://attack.mitre.org/detectionstrategies/DET0315#AN0880
    - https://researchcenter.paloaltonetworks.com/2016/07/unit42-technical-walkthrough-office-test-persistence-method-used-in-recent-sofacy-attacks/
    - http://www.hexacorn.com/blog/2014/04/16/beyond-good-ol-run-key-part-10/
author: sigma-generator
date: 2026-09-24
tags:
    - attack.persistence
    - attack.t1137
    - attack.t1137.002
correlation:
    type: temporal
    rules:
        - step1_registry_set
        - step2_process_creation
    group-by:
        - Computer
    timespan: 10m
falsepositives:
    - Legitimate administrative or software-deployment use of excel.exe, winword.exe
    - 'Environment-specific tuning of RegistryPath: Path to ''Office test\Special\Perf'' may vary by Office version, 32/64-bit, or architecture (HKCU vs HKLM)'
    - 'Environment-specific tuning of DLLPath: Injected DLL may reside in different user-writable locations (e.g., %APPDATA%, %TEMP%, or network shares)'
    - 'Environment-specific tuning of OfficeProcessName: Process name (e.g., winword.exe, excel.exe) may vary by Office deployment and usage'
    - Unknown
level: high
---
title: 'Office Test - Step 1: Registry Modification'
id: 0ef05bee-ff22-5b98-b3e0-eda367057fe4
name: step1_registry_set
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains:
            - '\Software\Microsoft\Office'
    condition: selection_registry
---
title: 'Office Test - Step 2: Process Creation'
id: 1d5fb36d-a7e3-513b-bb66-180150eac414
name: step2_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\excel.exe'
            - '\winword.exe'
    condition: selection_image
