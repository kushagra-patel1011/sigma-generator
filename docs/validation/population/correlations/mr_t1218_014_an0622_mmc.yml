title: 'MMC - Step 1: Process Creation'
id: 49de27da-ba65-53de-9786-483009aea076
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\mmc.exe'
            - '\wbadmin.exe'
            - '\wscript.exe'
    condition: selection_image
