title: Potential MMC Attack Chain Via Process Creation And File Creation
id: be822500-a2db-5184-aed6-a8cac31eb220
status: experimental
description: |
    Draft correlation for T1218.014 (MMC). ATT&CK analytic AN0622 (strategy DET0222) describes this
    technique as 2 observable behaviours; this rule fires when all of them occur on the same host
    within 10m.
    Steps: 1) Process Creation; 2) File Creation.
    ATT&CK analytic: Abuse of mmc.exe to execute non-Microsoft or user-staged .msc files and
    malicious COM CLSIDs. Behavioral chain: (1) suspicious mmc.exe invocation with /a or -Embedding
    and non-standard .msc path → (2) COM activation of non-baseline CLSIDs by mmc.exe → (3) mmc.exe
    loads non-baseline DLLs (user-writable/UNC/unsigned) → (4) optional network/DNS activity from
    mmc.exe.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
