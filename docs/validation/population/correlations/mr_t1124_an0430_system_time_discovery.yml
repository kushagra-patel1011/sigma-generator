title: Potential System Time Discovery Attack Chain Via 3 Correlated Log Sources
id: 2f51a6e4-cf59-5355-8042-cf4a2dc95138
status: experimental
description: |
    Draft correlation for T1124 (System Time Discovery). ATT&CK analytic AN0430 (strategy DET0151)
    describes this technique as 3 observable behaviours; this rule fires when all of them occur on
    the same host within 15m.
    Steps: 1) Process Creation; 2) File Creation; 3) PowerShell Script Block Logging.
    ATT&CK analytic: Untrusted or unusual process/script (cmd.exe, powershell.exe, w32tm.exe,
    net.exe, custom binaries) queries system time/timezone (e.g., w32tm /tz, net time \\host, Get-
    TimeZone, GetTickCount API) and (optionally) is followed within a short window by time-based
    scheduling or conditional execution (e.g., schtasks /create, at.exe, PowerShell Start-Sleep with
    large values).
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1124
    - https://attack.mitre.org/detectionstrategies/DET0151
    - https://attack.mitre.org/detectionstrategies/DET0151#AN0430
    - https://support.apple.com/en-gb/guide/remote-desktop/apd95406b8d/mac
    - https://wiki.archlinux.org/title/System_time
    - https://research.checkpoint.com/2024/magnet-goblin-targets-publicly-facing-servers-using-1-day-vulnerabilities/
author: sigma-generator
date: 2026-09-24
tags:
    - attack.discovery
    - attack.t1124
correlation:
    type: temporal
    rules:
        - step1_process_creation
        - step2_file_event
        - step3_ps_script
    group-by:
        - Computer
    timespan: 15m
falsepositives:
    - Legitimate administrative or software-deployment use of at.exe, cmd.exe, net.exe
    - 'Environment-specific tuning of TimeWindow: Correlation window (e.g., 5–15 minutes) between time discovery and follow-on scheduling/conditional actions.'
    - 'Environment-specific tuning of AllowedParents: Legitimate parent processes (e.g., corporate scripts, management agents) that frequently call time APIs.'
    - 'Environment-specific tuning of CommandlineKeywordList: Extend/restrict keyword list for time queries (e.g., custom PS functions, .NET calls).'
    - Unknown
level: low
---
title: 'System Time Discovery - Step 1: Process Creation'
id: 72207a68-83f1-59ec-8cd3-86d29929e652
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\at.exe'
            - '\cmd.exe'
            - '\net.exe'
            - '\powershell.exe'
            - '\schtasks.exe'
            - '\w32tm.exe'
    selection_indicator_content:
        CommandLine|contains:
            - Get-TimeZone
            - Start-Sleep
    condition: selection_image and selection_indicator_content
---
title: 'System Time Discovery - Step 2: File Creation'
id: a50f3c30-6fd6-58b8-9c04-acd7f2328264
name: step2_file_event
logsource:
    category: file_event
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - '\\host'
    condition: selection_path
---
title: 'System Time Discovery - Step 3: PowerShell Script Block Logging'
id: 1160724b-8652-5490-bbf0-49cb1f0f7662
name: step3_ps_script
logsource:
    category: ps_script
    product: windows
    definition: Script block logging must be enabled
detection:
    selection_indicator_content:
        ScriptBlockText|contains:
            - GetTickCount
    condition: selection_indicator_content
