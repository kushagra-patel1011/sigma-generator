---
title: 'InstallUtil - Step 1: PowerShell Script Block Logging'
id: a828f9f8-c02e-5f75-8343-cb785e184d64
name: step1_ps_script
logsource:
    category: ps_script
    product: windows
    definition: Script block logging must be enabled
detection:
    selection_indicator_content:
        ScriptBlockText|contains:
            - RunInstaller
    condition: selection_indicator_content
---
title: 'InstallUtil - Step 2: Process Creation'
id: 44ae7784-7d3b-5032-9e89-a9228b741145
name: step2_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\installutil.exe'
    condition: selection_image
---
title: 'InstallUtil - Step 3: File Creation'
id: 97dd5494-cd37-5734-a0d1-000b6243b2d8
name: step3_file_event
logsource:
    category: file_event
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - ':\Windows\Microsoft.NET\Framework\v\InstallUtil.exe'
    condition: selection_path
