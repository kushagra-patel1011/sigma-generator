title: Potential Disable or Modify Windows Event Log Attack Chain Via 3 Correlated Log Sources
id: 619ec87b-2a64-5eed-b568-5045bc9acf41
status: experimental
description: |
    Draft correlation for T1685.001 (Disable or Modify Windows Event Log). ATT&CK analytic AN0535
    (strategy DET0187) describes this technique as 3 observable behaviours; this rule fires when all
    of them occur on the same host within 10m.
    Steps: 1) Windows System; 2) Registry Modification; 3) Process Creation.
    ATT&CK analytic: Detection of attempts to disable or tamper with Windows Event Logging. This
    includes stopping or disabling the EventLog service, modifying registry keys related to EventLog
    and Autologger, using `auditpol` or `wevtutil` to disable categories or clear audit policies,
    and detecting suspicious gaps or resets in event logs.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1685/001
    - https://attack.mitre.org/detectionstrategies/DET0187
    - https://attack.mitre.org/detectionstrategies/DET0187#AN0535
    - https://dmcxblue.gitbook.io/red-team-notes-2-0/red-team-techniques/defense-evasion/t1562-impair-defenses/disable-windows-event-logging
    - https://www.coretechnologies.com/blog/windows-services/eventlog/
    - https://ptylu.github.io/content/report/report.html?report=25
author: sigma-generator
date: 2026-09-24
tags:
    - attack.defense-impairment
    - attack.t1685
    - attack.t1685.001
correlation:
    type: temporal
    rules:
        - step1_system
        - step2_registry_set
        - step3_process_creation
    group-by:
        - Computer
    timespan: 10m
falsepositives:
    - Legitimate administrative or software-deployment use of auditpol.exe, sc.exe, wevtutil.exe
    - 'Environment-specific tuning of AuthorizedAdminAccounts: List of accounts authorized to legitimately modify audit policies or disable services.'
    - 'Environment-specific tuning of TimeWindow: Correlation window between registry modification, service stop, and audit policy commands.'
    - 'Environment-specific tuning of ServiceNames: Customizable set of monitored services such as EventLog, Sysmon, or custom loggers.'
    - Unknown
level: high
---
title: 'Disable or Modify Windows Event Log - Step 1: Windows System'
id: c8e0cb5e-7e6e-54df-9dfd-60288f1f029b
name: step1_system
logsource:
    product: windows
    service: system
detection:
    selection_source:
        EventID: 7035
    selection_indicator_content:
        param1|contains:
            - -status
            - Set-Service
            - Stop-Service
    condition: selection_source and selection_indicator_content
---
title: 'Disable or Modify Windows Event Log - Step 2: Registry Modification'
id: d29495d8-35bb-57e6-a847-9619683a0852
name: step2_registry_set
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains:
            - '\SYSTEM\CurrentControlSet\Control\WMI\Autologger\EventLog-Application'
            - '\SYSTEM\CurrentControlSet\Control\WMI\Autologger\EventLog-Security'
            - '\SYSTEM\CurrentControlSet\Control\WMI\Autologger\EventLog-System'
            - '\SYSTEM\CurrentControlSet\Services\EventLog'
    condition: selection_registry
---
title: 'Disable or Modify Windows Event Log - Step 3: Process Creation'
id: b61f8110-8e8b-5c97-929b-beef1c7ffb02
name: step3_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\auditpol.exe'
            - '\sc.exe'
            - '\wevtutil.exe'
    condition: selection_image
