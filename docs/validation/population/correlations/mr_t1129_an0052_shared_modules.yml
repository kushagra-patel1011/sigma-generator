title: Potential Shared Modules Attack Chain Via Module Load And File Creation
id: 06d27deb-6838-5967-aeb9-e21578952d2c
status: experimental
description: |
    Draft correlation for T1129 (Shared Modules). ATT&CK analytic AN0052 (strategy DET0018)
    describes this technique as 2 observable behaviours; this rule fires when all of them occur on
    the same host within 20m.
    Steps: 1) Module Load; 2) File Creation.
    ATT&CK analytic: A process (often LOLBin or user-launched program) loads a DLL from a user-
    writable/UNC/Temp path or unsigned/invalid signer. Within a short window the DLL is (a) newly
    written to disk, (b) spawned as follow-on execution (rundll32/regsvr32), or (c) establishes
    outbound C2.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1129
    - https://attack.mitre.org/detectionstrategies/DET0018
    - https://attack.mitre.org/detectionstrategies/DET0018#AN0052
    - https://blog.netlab.360.com/stealth_rotajakiro_backdoor_en/
    - https://developer.apple.com/library/archive/documentation/DeveloperTools/Conceptual/DynamicLibraries/100-Articles/OverviewOfDynamicLibraries.html
    - https://unit42.paloaltonetworks.com/unit42-new-improved-macos-backdoor-oceanlotus/
author: sigma-generator
date: 2026-09-24
tags:
    - attack.execution
    - attack.t1129
correlation:
    type: temporal
    rules:
        - step1_image_load
        - step2_file_event
    group-by:
        - Computer
    timespan: 20m
falsepositives:
    - Legitimate administrative or software-deployment use of rundll32.exe
    - 'Environment-specific tuning of TimeWindow: Correlation window between file write → module load → network (e.g., 0–20 minutes).'
    - 'Environment-specific tuning of SuspiciousPathRegex: Regex for user-writable/UNC/temp paths to flag (e.g., %TEMP%, %APPDATA%, \\*\share\).'
    - 'Environment-specific tuning of UnsignedOnly: Alert only when SignatureStatus != Valid to reduce noise.'
    - Unknown
level: high
---
title: 'Shared Modules - Step 1: Module Load'
id: e096d76d-be73-5c84-acc7-a9fc326f9307
name: step1_image_load
logsource:
    category: image_load
    product: windows
detection:
    selection_loaded:
        ImageLoaded|endswith:
            - '\ntdll.dll'
    selection_indicator_source:
        Image|endswith:
            - '\rundll32.exe'
    condition: selection_loaded and selection_indicator_source
---
title: 'Shared Modules - Step 2: File Creation'
id: f4452300-f222-5807-911a-679c5db3249d
name: step2_file_event
logsource:
    category: file_event
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - '\\*\share\'
    condition: selection_path
