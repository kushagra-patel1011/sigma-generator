title: 'Native API - Step 2: Process Access'
id: 8baff6d1-9e9c-5e55-91c6-1290bbf488a6
name: step2_process_access
logsource:
    category: process_access
    product: windows
detection:
    selection_target:
        TargetImage|endswith:
            - '\winlogon.exe'
    condition: selection_target
