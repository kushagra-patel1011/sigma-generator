title: Potential Native API Attack Chain Via Module Load And Process Access
id: 6ef42a5b-6bd5-5bf7-bdf2-1582cf3a0209
status: experimental
description: |
    Draft correlation for T1106 (Native API). ATT&CK analytic AN1465 (strategy DET0529) describes
    this technique as 2 observable behaviours; this rule fires when all of them occur on the same
    host within 10m.
    Steps: 1) Module Load; 2) Process Access.
    ATT&CK analytic: Unusual or suspicious processes loading critical native API DLLs (e.g.,
    ntdll.dll, kernel32.dll) followed by direct syscall behavior, memory manipulation, or hollowing.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
