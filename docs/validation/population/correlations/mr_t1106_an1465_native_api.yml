---
title: 'Native API - Step 1: Module Load'
id: 0d75324b-9343-50b5-92ee-bb89f4594450
name: step1_image_load
logsource:
    category: image_load
    product: windows
detection:
    selection_loaded:
        ImageLoaded|endswith:
            - '\kernel32.dll'
            - '\ntdll.dll'
    condition: selection_loaded
