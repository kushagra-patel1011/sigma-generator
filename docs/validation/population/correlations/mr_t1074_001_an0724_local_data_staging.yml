title: Potential Local Data Staging Attack Chain Via File Creation And Process Creation
id: ea754558-7f50-5e34-8d87-ca7d42e76b59
status: experimental
description: |
    Draft correlation for T1074.001 (Local Data Staging). ATT&CK analytic AN0724 (strategy DET0261)
    describes this technique as 2 observable behaviours; this rule fires when all of them occur on
    the same host within 10m.
    Steps: 1) File Creation; 2) Process Creation.
    ATT&CK analytic: Detects file reads across locations followed by writes to temp or staging
    directories, often compressed or encrypted, indicating local staging behavior.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1074/001
    - https://attack.mitre.org/detectionstrategies/DET0261
    - https://attack.mitre.org/detectionstrategies/DET0261#AN0724
    - https://web.archive.org/web/20220629230035/https://www.prevailion.com/darkwatchman-new-fileless-techniques/
author: sigma-generator
date: 2026-09-24
tags:
    - attack.collection
    - attack.t1074
    - attack.t1074.001
correlation:
    type: temporal
    rules:
        - step1_file_event
        - step2_process_creation
    group-by:
        - Computer
    timespan: 10m
falsepositives:
    - Legitimate administrative or software-deployment use of 7z.exe, rar.exe, zip.exe
    - 'Environment-specific tuning of StagingDirList: Paths such as C:\Temp, C:\Windows\Tasks, etc.'
    - 'Environment-specific tuning of ArchivingToolPatterns: Matches to 7z.exe, rar.exe, zip.exe, or custom scripts.'
    - 'Environment-specific tuning of TimeWindow: How long to correlate file reads followed by compression.'
    - Unknown
level: medium
---
title: 'Local Data Staging - Step 1: File Creation'
id: 20b4ca05-37a9-55b3-93f5-d849295c70b5
name: step1_file_event
logsource:
    category: file_event
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - ':\Temp'
            - ':\Windows\Tasks'
    condition: selection_path
---
title: 'Local Data Staging - Step 2: Process Creation'
id: 2838448b-02c2-5bfd-bc54-79eb2f051136
name: step2_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\7z.exe'
            - '\rar.exe'
            - '\zip.exe'
    condition: selection_image
