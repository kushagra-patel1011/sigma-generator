---
title: 'Group Policy Modification - Step 1: Windows Security'
id: 3a246566-021e-5287-9f29-858ed11e174a
name: step1_security
logsource:
    product: windows
    service: security
detection:
    selection_source:
        EventID: 5136
    selection_indicator_content:
        AttributeValue|contains:
            - New-GPOImmediateTask
            - Set-GPRegistryValue
    condition: selection_source and selection_indicator_content
---
title: 'Group Policy Modification - Step 2: File Creation'
id: aa330ad4-9841-591d-8fbe-58c295565e6b
name: step2_file_event
logsource:
    category: file_event
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - '\\SYSVOL\\Policies\'
    condition: selection_path
