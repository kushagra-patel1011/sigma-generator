title: Potential Group Policy Modification Attack Chain Via Windows Security And File Creation
id: b62db5a9-5f88-5e4e-b0ae-b971aa0b864a
status: experimental
description: |
    Draft correlation for T1484.001 (Group Policy Modification). ATT&CK analytic AN0854 (strategy
    DET0305) describes this technique as 2 observable behaviours; this rule fires when all of them
    occur on the same host within 10m.
    Steps: 1) Windows Security; 2) File Creation.
    ATT&CK analytic: Adversary modifies GPO containers or files under SYSVOL using LDAP, ADSI,
    PowerShell (e.g., New-GPOImmediateTask) or GUI tools. This includes directory object changes
    (e.g., gPCFileSysPath), delegation assignments (SeEnableDelegationPrivilege), and SYSVOL file
    writes (ScheduledTasks.xml, GptTmpl.inf).
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1484/001
    - https://attack.mitre.org/detectionstrategies/DET0305
    - https://attack.mitre.org/detectionstrategies/DET0305#AN0854
