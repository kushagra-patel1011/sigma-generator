title: Potential NTDS Attack Chain Via Process Creation, File Change And File Creation
id: d7271b92-6d9c-511d-95e4-3193689f5705
status: experimental
description: |
    Draft correlation for T1003.003 (NTDS). ATT&CK analytic AN1611 (strategy DET0586) describes this
    technique as 3 observable behaviours; this rule fires when all of them occur on the same host
    within 5m.
    Steps: 1) Process Creation; 2) File Change; 3) File Creation.
    ATT&CK analytic: Detects credential dumping attempts targeting the NTDS.dit database by
    monitoring shadow copy creation, suspicious file access to %SystemRoot%\NTDS\ntds.dit, and the
    use of tooling like ntdsutil.exe or volume management APIs.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1003/003
    - https://attack.mitre.org/detectionstrategies/DET0586
    - https://attack.mitre.org/detectionstrategies/DET0586#AN1611
    - http://adsecurity.org/?p=1275
    - https://en.wikipedia.org/wiki/Active_Directory
author: sigma-generator
date: 2026-09-24
tags:
    - attack.credential-access
    - attack.t1003
    - attack.t1003.003
correlation:
    type: temporal
    rules:
        - step1_process_creation
        - step2_file_change
        - step3_file_event
    group-by:
        - Computer
    timespan: 5m
falsepositives:
    - Legitimate administrative or software-deployment use of ntdsutil.exe
    - 'Environment-specific tuning of TargetFilePath: Tunable for NTDS file location or backup paths if organization uses custom domain controller storage...'
    - 'Environment-specific tuning of ParentProcessName: Can suppress backup-related parent processes to reduce false positives.'
    - 'Environment-specific tuning of TimeWindow: Temporal correlation between shadow copy creation and NTDS file access (e.g., 5 min window).'
    - Unknown
level: high
---
title: 'NTDS - Step 1: Process Creation'
id: b6e70f05-30bd-59f6-88d3-5fbf02507837
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_indicator_content:
        CommandLine|contains:
            - Invoke-NinjaCopy
            - secretsdump.py
    condition: selection_indicator_content
---
title: 'NTDS - Step 2: File Change'
id: 8c43ec01-1eb8-5d9a-8119-ad1bc3d24117
name: step2_file_change
logsource:
    category: file_change
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - ':\Windows\NTDS\ntds.dit'
    condition: selection_path
---
title: 'NTDS - Step 3: File Creation'
id: 6327f987-8855-5357-9789-d0495f8217bd
name: step3_file_event
logsource:
    category: file_event
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\ntdsutil.exe'
    condition: selection_image
