title: Potential Application Shimming Attack Chain Via Windows Security And File Creation
id: 4ce19ece-9f96-5499-905c-ef0594fb944f
status: experimental
description: |
    Draft correlation for T1546.011 (Application Shimming). ATT&CK analytic AN0051 (strategy
    DET0017) describes this technique as 2 observable behaviours; this rule fires when all of them
    occur on the same host within 10m.
    Steps: 1) Windows Security; 2) File Creation.
    ATT&CK analytic: Correlated modification of AppCompat registry keys and execution of sdbinst.exe
    to install custom shim databases. Followed by DLL injection via shim behavior into target
    application processes.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
