---
title: 'Application Shimming - Step 1: Windows Security'
id: 0031b0b1-435e-5525-93e2-efbe4397f950
name: step1_security
logsource:
    product: windows
    service: security
detection:
    selection_source:
        EventID: 4657
    selection_registry:
        ObjectName|contains:
            - '\software\microsoft\windows'
    selection_indicator_source:
        ProcessName|endswith:
            - '\sdbinst.exe'
    condition: selection_source and selection_registry and selection_indicator_source
---
title: 'Application Shimming - Step 2: File Creation'
id: f91dd0fb-f81a-5c2f-b967-9c1e148dfc29
name: step2_file_event
logsource:
    category: file_event
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - ':\Windows\AppPatch\AppPatch64\Custom'
            - ':\Windows\AppPatch\custom'
            - ':\Windows\AppPatch\sysmain.sdb'
    condition: selection_path
