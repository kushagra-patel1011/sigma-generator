title: Potential Port Knocking Across Multiple Destinations Via Network Connection
id: ad53f6db-3f22-51ff-b24e-3c57420c8ea7
status: experimental
description: |
    Draft threshold correlation for T1205.001 (Port Knocking). ATT&CK analytic AN0842 (strategy
    DET0302) describes volume ("number of distinct destination ports"); this rule fires when 5 or
    more distinct values of DestinationHostname occur for the same User within 10m.
    ATT&CK analytic: A remote source rapidly touches a short sequence of closed ports (SYN→RST/S0)
    on a Windows host. Within a short window the host changes firewall state (WFP rule
    added/modified or service starts listening) and then the same source completes the first
    successful handshake to the newly opened port.
    Generated draft - the threshold and base selection must be tuned against real telemetry before
    this rule is deployed.
