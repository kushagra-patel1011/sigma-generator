title: Potential Hidden Window Attack Chain Via Process Creation And Registry Modification
id: 864b800b-f6aa-51dd-8ccf-3a39a819d0d2
status: experimental
description: |
    Draft correlation for T1564.003 (Hidden Window). ATT&CK analytic AN0360 (strategy DET0128)
    describes this technique as 2 observable behaviours; this rule fires when all of them occur on
    the same host within 10m.
    Steps: 1) Process Creation; 2) Registry Modification.
    ATT&CK analytic: Suspicious use of scripting parameters or registry edits to hide process
    windows (e.g., powershell.exe -WindowStyle Hidden, or registry modifications pushing window
    positions off screen). Defender view: correlation of hidden execution with anomalous process
    lineage or hVNC-like CreateDesktop API calls.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
