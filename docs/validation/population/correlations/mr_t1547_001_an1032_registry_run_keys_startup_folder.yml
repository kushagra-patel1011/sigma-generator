---
title: 'Registry Run Keys / Startup Folder - Step 1: Process Creation'
id: 32143dc2-87ca-55f6-85d1-54006a2f3ce5
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\reg.exe'
    condition: selection_image
---
title: 'Registry Run Keys / Startup Folder - Step 2: Registry Modification'
id: 6856181d-308b-5ccc-9cba-bf66635ea5eb
name: step2_registry_set
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains:
            - '\Software\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders'
            - '\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders'
            - '\Software\Microsoft\Windows\CurrentVersion\Run'
    condition: selection_registry
---
title: 'Registry Run Keys / Startup Folder - Step 3: File Creation'
id: 2bbf8b46-eb34-5117-bc5b-556820164c74
name: step3_file_event
logsource:
    category: file_event
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - ':\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp'
    condition: selection_path
