    - 'Environment-specific tuning of ImagePath: Full path of the binary/script being registered in Run keys.'
    - 'Environment-specific tuning of RegistryKeyPath: Tunable list of startup-related registry keys to monitor more/less aggressively based on enterprise software...'
    - 'Environment-specific tuning of TimeWindow: Correlate registry key creation and process execution within this window.'
