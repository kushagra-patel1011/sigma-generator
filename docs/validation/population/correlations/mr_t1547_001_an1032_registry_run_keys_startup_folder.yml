title: Potential Registry Run Keys or Startup Folder Attack Chain Via 3 Correlated Log Sources
id: f1f3d4a2-d284-59d1-b591-f04fc58f5a3d
status: experimental
description: |
    Draft correlation for T1547.001 (Registry Run Keys / Startup Folder). ATT&CK analytic AN1032
    (strategy DET0365) describes this technique as 3 observable behaviours; this rule fires when all
    of them occur on the same host within 10m.
    Steps: 1) Process Creation; 2) Registry Modification; 3) File Creation.
    ATT&CK analytic: Correlation of Registry key creation/modification events under known
    Run/Startup keys with new or unusual binary paths or script-based payloads. Multi-event
    detection includes registry modification followed by process execution from non-standard
    directories or abnormal parent-child process relationships.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1547/001
    - https://attack.mitre.org/detectionstrategies/DET0365
    - https://attack.mitre.org/detectionstrategies/DET0365#AN1032
