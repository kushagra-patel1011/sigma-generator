title: Potential Windows Management Instrumentation Attack Chain Via 2 Correlated Log Sources
id: c7a3b08e-b075-59cb-8318-d54a1d9fd944
status: experimental
description: |
    Draft correlation for T1047 (Windows Management Instrumentation). ATT&CK analytic AN1031
    (strategy DET0364) describes this technique as 2 observable behaviours; this rule fires when all
    of them occur on the same host within 10m.
    Steps: 1) Process Creation; 2) Network Connection.
    ATT&CK analytic: Detects adversarial abuse of WMI to execute local or remote commands via WMIC,
    PowerShell, or COM API through a multi-event chain: process creation, command execution, and
    corresponding network connection if remote.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1047
    - https://attack.mitre.org/detectionstrategies/DET0364
    - https://attack.mitre.org/detectionstrategies/DET0364#AN1031
    - https://www.fireeye.com/content/dam/fireeye-www/global/en/current-threats/pdfs/wp-windows-management-instrumentation.pdf
