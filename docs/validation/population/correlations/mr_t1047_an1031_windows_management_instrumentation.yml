---
title: 'Windows Management Instrumentation - Step 1: Process Creation'
id: 745048af-a746-57d5-9a21-54030720ee01
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\wbemtool.exe'
            - '\wmic.exe'
    selection_indicator_content:
        CommandLine|contains:
            - Invoke-WmiMethod
    condition: selection_image and selection_indicator_content
