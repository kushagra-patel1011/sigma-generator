title: Potential Disable or Modify System Firewall Attack Chain Via 2 Correlated Log Sources
id: 52dbdab0-babd-58ff-926a-0e682d960e55
status: experimental
description: |
    Draft correlation for T1686 (Disable or Modify System Firewall). ATT&CK analytic AN0406
    (strategy DET0145) describes this technique as 2 observable behaviours; this rule fires when all
    of them occur on the same host within 10m.
    Steps: 1) Process Creation; 2) Registry Modification.
    ATT&CK analytic: Detection of firewall tampering by monitoring processes executing netsh,
    PowerShell Set-NetFirewallProfile, or sc stop mpssvc. Registry modifications under
    HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy also indicate
    adversarial actions.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1686
    - https://attack.mitre.org/detectionstrategies/DET0145
    - https://attack.mitre.org/detectionstrategies/DET0145#AN0406
    - https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/7-0/add-allowed-ip-addresses-for-an-esxi-host-by-using-the-vmware-host-client.html
    - https://www.trellix.com/en-au/blogs/research/ransomhouse-am-see/
    - https://x.com/TheDFIRReport/status/1498657772254240768
author: sigma-generator
date: 2026-09-24
tags:
    - attack.defense-impairment
    - attack.t1686
correlation:
    type: temporal
    rules:
        - step1_process_creation
        - step2_registry_set
    group-by:
        - Computer
    timespan: 10m
falsepositives:
    - Legitimate administrative or software-deployment use of netsh.exe, powershell.exe, sc.exe
    - 'Environment-specific tuning of MonitoredCommands: List of admin tools and scripts allowed to legitimately modify firewall settings.'
    - 'Environment-specific tuning of AlertThreshold: Number of firewall rule changes within a time window before triggering alert.'
    - Unknown
level: high
---
title: 'Disable or Modify System Firewall - Step 1: Process Creation'
id: db903292-1049-5cb8-acee-477df28204e9
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\netsh.exe'
            - '\powershell.exe'
            - '\sc.exe'
    selection_indicator_content:
        CommandLine|contains:
            - Set-NetFirewallProfile
    condition: selection_image and selection_indicator_content
---
title: 'Disable or Modify System Firewall - Step 2: Registry Modification'
id: a5aaaf67-e6bd-5af8-a805-0d243baf6402
name: step2_registry_set
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains:
            - '\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy'
    condition: selection_registry
