---
title: 'Path Interception by PATH Environment Variable - Step 1: Windows Security'
id: 6bfe3078-9a75-5ee9-9197-34dbec1932c1
name: step1_security
logsource:
    product: windows
    service: security
detection:
    selection_source:
        EventID: 4657
    selection_image:
        ProcessName|endswith:
            - '\net.exe'
            - '\python.exe'
    condition: selection_source and selection_image
---
title: 'Path Interception by PATH Environment Variable - Step 2: File Creation'
id: d824330b-452b-5af8-9004-e217c08c9ff2
name: step2_file_event
logsource:
    category: file_event
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - ':\Windows\system32\net.exe'
    condition: selection_path
