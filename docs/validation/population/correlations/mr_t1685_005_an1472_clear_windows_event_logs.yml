title: Potential Clear Windows Event Logs Attack Chain Via Process Creation And File Deletion
id: 6e1499a2-f0a8-5ccf-80b7-c4a6dc263567
status: experimental
description: |
    Draft correlation for T1685.005 (Clear Windows Event Logs). ATT&CK analytic AN1472 (strategy
    DET0532) describes this technique as 2 observable behaviours; this rule fires when all of them
    occur on the same host within 10m.
    Steps: 1) Process Creation; 2) File Deletion.
    ATT&CK analytic: Detects behavioral sequence where an adversary gains elevated privileges and
    clears event logs using native binaries (e.g., wevtutil), PowerShell, or direct file deletion of
    .evtx files.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1685/005
