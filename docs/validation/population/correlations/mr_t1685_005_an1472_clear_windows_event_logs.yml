---
title: 'Clear Windows Event Logs - Step 1: Process Creation'
id: f51a04b8-e74b-5ee8-a119-f5d5094e97a2
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\wevtutil.exe'
    selection_indicator_content:
        CommandLine|contains:
            - -logname
            - Remove-EventLog
    condition: selection_image and selection_indicator_content
---
title: 'Clear Windows Event Logs - Step 2: File Deletion'
id: aedfdfbb-3f2c-54eb-b9c2-59dec57ab70f
name: step2_file_delete
logsource:
    category: file_delete
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - ':\Windows\System32\winevt\logs\'
    condition: selection_path
