title: Potential Thread Local Storage Activity Via Process Access
id: 70e599b2-67fd-54bb-991c-817e6856be14
status: experimental
description: |
    Draft detection for T1055.005 (Thread Local Storage), derived from ATT&CK detection strategy
    DET0467 / analytic AN1289.
    Adversaries may inject malicious code into processes via thread local storage (TLS) callbacks in
    order to evade process-based defenses as well as possibly elevate privileges. TLS callback
    injection is a method of executing arbitrary code in the address space of a separate live
    process.
    ATT&CK analytic: Detects thread local storage (TLS) callback injection by monitoring memory
    modifications to PE headers and TLS directory structures during or after process hollowing
    events, followed by anomalous thread behavior prior to main entry point execution.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
