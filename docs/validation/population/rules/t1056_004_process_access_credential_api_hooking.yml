title: Potential Credential API Hooking Activity Via Process Access
id: f2ab8339-7be4-5de2-b965-b77fbb3a60c3
status: experimental
description: |
    Draft detection for T1056.004 (Credential API Hooking), derived from ATT&CK detection strategy
    DET0139 / analytic AN0389.
    Adversaries may hook into Windows application programming interface (API) functions and Linux
    system functions to collect user credentials. Malicious hooking mechanisms may capture API or
    function calls that include parameters that reveal user authentication credentials.
    ATT&CK analytic: Detects credential harvesting via userland API hooking (e.g., SetWindowsHookEx,
    IAT, or inline patching) by correlating memory modifications with hook installation functions
    and suspicious module loads in credential-sensitive processes like lsass.exe, explorer.exe, or
    winlogon.exe.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
