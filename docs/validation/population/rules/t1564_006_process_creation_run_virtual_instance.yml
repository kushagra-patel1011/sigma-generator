status: experimental
description: |
    Draft detection for T1564.006 (Run Virtual Instance), derived from ATT&CK detection strategy
    DET0321 / analytic AN0909.
    Adversaries may carry out malicious operations using a virtual instance to avoid detection. A
    wide variety of virtualization technologies exist that allow for the emulation of a computer or
