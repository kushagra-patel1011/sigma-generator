title: Potential Create Process with Token Activity Via Process Access
id: 8e61c25c-3881-5950-ac35-1a1e28d7ddf9
status: experimental
description: |
    Draft detection for T1134.002 (Create Process with Token), derived from ATT&CK detection
    strategy DET0456 / analytic AN1253.
    Adversaries may create a new process with an existing token to escalate privileges and bypass
    access controls. Processes can be created with the token and resulting security context of
    another user using features such as CreateProcessWithTokenW and runas.
    ATT&CK analytic: A process (often after stealing/creating a token) calls
    CreateProcessWithTokenW/CreateProcessAsUserW or uses runas to spawn a **new** process whose
    security context (SID/LogonId/IntegrityLevel) differs from its parent. Chain: (1) suspicious
    command/API → (2) privileged handle or token duplication/open → (3) new child process running as
    another user / higher integrity → (4)...
