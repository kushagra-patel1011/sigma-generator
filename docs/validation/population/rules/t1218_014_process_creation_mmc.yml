title: Potential MMC Activity Via Process Creation
id: 12d916c1-f37e-5963-b3cb-f69b979e58e4
status: experimental
description: |
    Draft detection for T1218.014 (MMC), derived from ATT&CK detection strategy DET0222 / analytic
    AN0622.
    Adversaries may abuse mmc.exe to proxy execution of malicious .msc files. Microsoft Management
    Console (MMC) is a binary that may be signed by Microsoft and is used in several ways in either
    its GUI or in a command prompt.
    ATT&CK analytic: Abuse of mmc.exe to execute non-Microsoft or user-staged .msc files and
    malicious COM CLSIDs. Behavioral chain: (1) suspicious mmc.exe invocation with /a or -Embedding
    and non-standard .msc path → (2) COM activation of non-baseline CLSIDs by mmc.exe → (3) mmc.exe
    loads non-baseline DLLs (user-writable/UNC/unsigned) → (4) optional network/DNS activity from
    mmc.exe.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
