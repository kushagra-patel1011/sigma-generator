title: Potential System Time Discovery Activity Via Process Creation
id: fd80e7de-1110-509c-8424-19e003eb6480
status: experimental
description: |
    Draft detection for T1124 (System Time Discovery), derived from ATT&CK detection strategy
    DET0151 / analytic AN0430.
    An adversary may gather the system time and/or time zone settings from a local or remote system.
    The system time is set and stored by services, such as the Windows Time Service on Windows or
    systemsetup on macOS.
    ATT&CK analytic: Untrusted or unusual process/script (cmd.exe, powershell.exe, w32tm.exe,
    net.exe, custom binaries) queries system time/timezone (e.g., w32tm /tz, net time \\host, Get-
    TimeZone, GetTickCount API) and (optionally) is followed within a short window by time-based
    scheduling or conditional execution (e.g., schtasks /create, at.exe, PowerShell Start-Sleep with
    large values).
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1124
    - https://attack.mitre.org/detectionstrategies/DET0151
    - https://attack.mitre.org/detectionstrategies/DET0151#AN0430
    - https://support.apple.com/en-gb/guide/remote-desktop/apd95406b8d/mac
    - https://wiki.archlinux.org/title/System_time
    - https://research.checkpoint.com/2024/magnet-goblin-targets-publicly-facing-servers-using-1-day-vulnerabilities/
author: sigma-generator
date: 2026-09-24
tags:
    - attack.discovery
    - attack.t1124
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\at.exe'
            - '\cmd.exe'
            - '\net.exe'
            - '\powershell.exe'
            - '\schtasks.exe'
            - '\w32tm.exe'
    selection_indicator_content:
        CommandLine|contains:
            - Get-TimeZone
            - Start-Sleep
    condition: selection_image and selection_indicator_content
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Legitimate administrative or software-deployment use of at.exe, cmd.exe, net.exe
    - 'Environment-specific tuning of TimeWindow: Correlation window (e.g., 5–15 minutes) between time discovery and follow-on scheduling/conditional actions.'
    - 'Environment-specific tuning of AllowedParents: Legitimate parent processes (e.g., corporate scripts, management agents) that frequently call time APIs.'
    - 'Environment-specific tuning of CommandlineKeywordList: Extend/restrict keyword list for time queries (e.g., custom PS functions, .NET calls).'
    - Unknown
level: low
