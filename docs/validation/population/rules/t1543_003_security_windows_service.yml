title: Potential Windows Service Activity Via Windows Security
id: 0db27b69-1abe-519d-ac16-00fb2bae63bd
status: experimental
description: |
    Draft detection for T1543.003 (Windows Service), derived from ATT&CK detection strategy DET0552
    / analytic AN1527.
    Adversaries may create or modify Windows services to repeatedly execute malicious payloads as
    part of persistence. When Windows boots up, it starts programs or applications called services
    that perform background system functions.
    ATT&CK analytic: Detects creation or modification of Windows Services through command-line tools
    (e.g., `sc.exe`, `powershell.exe`), Registry key changes under
    `HKLM\System\CurrentControlSet\Services`, and service execution under SYSTEM with unsigned or
    anomalous binary paths. Detects privilege escalation via driver installation or `CreateServiceW`
    usage.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
