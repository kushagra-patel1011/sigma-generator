title: Potential Traffic Signaling Activity Via Process Creation
id: 4ec564ae-ab09-5aab-90b5-8ec9fc175ec3
status: experimental
description: |
    Draft detection for T1205 (Traffic Signaling), derived from ATT&CK detection strategy DET0524 /
    analytic AN1448.
    Adversaries may use traffic signaling to hide open ports or other malicious functionality used
    for persistence or command and control. Traffic signaling involves the use of a magic value or
    sequence that must be sent to a system to trigger a special response, such as opening a closed
    port or executing a malicious task.
    ATT&CK analytic: A remote host sends a short sequence of failed connection attempts (RST/ICMP
    unreachable) to a set of closed ports. Within a brief window the endpoint (a) adds/enables a
    firewall rule or (b) a sniffer-backed process begins listening or opens a new socket, after
    which a successful connection occurs.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
