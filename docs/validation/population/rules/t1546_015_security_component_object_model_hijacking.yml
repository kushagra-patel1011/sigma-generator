title: Potential Component Object Model Hijacking Activity Via Windows Security
id: 0b021228-f76b-5ad3-bbe4-c942277a5be6
status: experimental
description: |
    Draft detection for T1546.015 (Component Object Model Hijacking), derived from ATT&CK detection
    strategy DET0481 / analytic AN1323.
    Adversaries may establish persistence by executing malicious content triggered by hijacked
    references to Component Object Model (COM) objects. COM is a system within Windows to enable
    interaction between software components through the operating system.
    ATT&CK analytic: Correlate suspicious registry modifications to known COM object CLSIDs with
    subsequent DLL loads or unexpected binary execution paths. Detect placement of COM CLSID entries
    under HKEY_CURRENT_USER\Software\Classes\CLSID\ overriding default HKLM paths.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
