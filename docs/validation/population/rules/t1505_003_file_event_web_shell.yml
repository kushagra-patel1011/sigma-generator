title: Potential Web Shell Activity Via File Creation
id: 45bab295-cd28-59e3-b3e8-27af2efd118d
status: experimental
description: |
    Draft detection for T1505.003 (Web Shell), derived from ATT&CK detection strategy DET0394 /
    analytic AN1108.
    Adversaries may backdoor web servers with web shells to establish persistent access to systems.
    A Web shell is a Web script that is placed on an openly accessible Web server to allow an
    adversary to access the Web server as a gateway into a network.
    ATT&CK analytic: Unexpected file creation in web directories followed by web server processes
    (e.g., w3wp.exe) spawning command shells or script interpreters (e.g., cmd.exe, powershell.exe)
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
