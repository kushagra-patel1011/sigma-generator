title: Potential Multi-Factor Authentication Activity Via PowerShell Script Block Logging
id: 6c35d076-81e3-51a6-9d39-86f49c337c0c
status: experimental
description: |
    Draft detection for T1556.006 (Multi-Factor Authentication), derived from ATT&CK detection
    strategy DET0190 / analytic AN0543.
    Adversaries may disable or modify multi-factor authentication (MFA) mechanisms to enable
    persistent access to compromised accounts. Once adversaries have gained access to a network by
    either compromising an account lacking MFA or by employing an MFA bypass method such as Multi-
    Factor Authentication Request Generation, adversaries may leverage their access to modify or...
    ATT&CK analytic: Detects registry and Group Policy modifications that disable or weaken MFA,
    suspicious PowerShell usage modifying MFA-related attributes, and anomalous login sessions
    succeeding without expected MFA challenge.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1556/006
    - https://attack.mitre.org/detectionstrategies/DET0190
    - https://attack.mitre.org/detectionstrategies/DET0190#AN0543
    - https://www.cisa.gov/uscert/ncas/alerts/aa22-074a
