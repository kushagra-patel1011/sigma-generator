title: Potential Regsvcs or Regasm Activity Via Process Creation
id: 16c6167a-178a-5b29-84d6-74f4c0022caa
status: experimental
description: |
    Draft detection for T1218.009 (Regsvcs/Regasm), derived from ATT&CK detection strategy DET0361 /
    analytic AN1028.
    Adversaries may abuse Regsvcs and Regasm to proxy execution of code through a trusted Windows
    utility. Regsvcs and Regasm are Windows command-line utilities that are used to register .NET
    Component Object Model (COM) assemblies.
    ATT&CK analytic: Abuse of Regsvcs.exe or Regasm.exe to execute arbitrary code embedded in .NET
    assemblies via [ComRegisterFunction]/[ComUnregisterFunction]. Behavioral chain: (1) Process
    creation of regsvcs/regasm with suspicious assembly paths/flags → (2) Assembly/DLL load inside
    regsvcs/regasm → (3) Registry writes to HKCR\CLSID/ProgID during COM registration → (4) Optional
    child process or...
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
