title: Potential Account Access Removal Activity Via Process Creation
id: 0172235f-7abe-5025-8ac1-3f3b675d81d1
status: experimental
description: |
    Draft detection for T1531 (Account Access Removal), derived from ATT&CK detection strategy
    DET0120 / analytic AN0334.
    Adversaries may interrupt availability of system and network resources by inhibiting access to
    accounts utilized by legitimate users. Accounts may be deleted, locked, or manipulated (ex:
    changed credentials, revoked permissions for SaaS platforms such as Sharepoint) to remove access
    to accounts.
    ATT&CK analytic: Correlated user account modification (reset, disable, deletion) events with
    anomalous process lineage (e.g., PowerShell or net.exe from an interactive session), especially
    outside of IT admin change windows or by non-admin users.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1531
    - https://attack.mitre.org/detectionstrategies/DET0120
    - https://attack.mitre.org/detectionstrategies/DET0120#AN0334
    - https://www.carbonblack.com/2019/03/22/tau-threat-intelligence-notification-lockergoga-ransomware/
