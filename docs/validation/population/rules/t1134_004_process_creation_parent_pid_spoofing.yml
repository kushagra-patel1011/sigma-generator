description: |
    Draft detection for T1134.004 (Parent PID Spoofing), derived from ATT&CK detection strategy
    DET0489 / analytic AN1351.
    Adversaries may spoof the parent process identifier (PPID) of a new process to evade process-
    monitoring defenses or to elevate privileges. New processes are typically spawned directly from
