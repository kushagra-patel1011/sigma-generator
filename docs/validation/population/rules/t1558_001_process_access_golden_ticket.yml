title: Potential Golden Ticket Activity Via Process Access
id: fd19cd01-4863-5eee-a8c2-9d44e6c68fc2
status: experimental
description: |
    Draft detection for T1558.001 (Golden Ticket), derived from ATT&CK detection strategy DET0144 /
    analytic AN0405.
    Adversaries who have the KRBTGT account password hash may forge Kerberos ticket-granting tickets
    (TGT), also known as a golden ticket. Golden tickets enable adversaries to generate
    authentication material for any account in Active Directory.
    ATT&CK analytic: Detects forged Kerberos Golden Tickets by correlating anomalous Kerberos ticket
    lifetimes, unexpected encryption types (e.g., RC4 in modern domains), malformed fields in
    logon/logoff events, and TGS requests without preceding TGT requests. Also monitors for abnormal
    patterns of access associated with elevated privileges across multiple systems.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
