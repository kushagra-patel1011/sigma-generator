title: Potential IDE Extensions Activity Via Process Creation
id: cb68aec0-3c66-578c-b9d1-7a2e7b52aec3
status: experimental
description: |
    Draft detection for T1176.002 (IDE Extensions), derived from ATT&CK detection strategy DET0561 /
    analytic AN1548.
    Adversaries may abuse an integrated development environment (IDE) extension to establish
    persistent access to victim systems. IDEs such as Visual Studio Code, IntelliJ IDEA, and Eclipse
    support extensions - software components that add features like code linting, auto-completion,
    task automation, or integration with tools like Git and Docker.
    ATT&CK analytic: Adversary installs or side-loads an IDE extension (VS Code, IntelliJ/JetBrains,
    Eclipse) or enables IDE tunneling. Chain: (1) IDE binary starts on a non-developer endpoint or
    server, often with install/force/tunnel flags → (2) extension files/registrations appear under
    user profile → (3) browser/IDE initiates outbound connections to extension marketplaces, update
    endpoints, or...
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
