title: Potential Services File Permissions Weakness Activity Via Windows System
id: 8ccbd1fb-eafb-5d6f-8c8b-067d137429bd
status: experimental
description: |
    Draft detection for T1574.010 (Services File Permissions Weakness), derived from ATT&CK
    detection strategy DET0436 / analytic AN1211.
    Adversaries may execute their own malicious payloads by hijacking the binaries used by services.
    Adversaries may use flaws in the permissions of Windows services to replace the binary that is
    executed upon service start.
    ATT&CK analytic: Modification or replacement of service executables due to weak file or
    directory permissions. Defender observes file writes to service binary paths, unexpected
    modifications of executables associated with registered services, and subsequent service
    execution of attacker-supplied binaries under elevated permissions.
