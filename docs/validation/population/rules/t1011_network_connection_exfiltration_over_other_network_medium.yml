title: Potential Exfiltration Over Other Network Medium Activity Via Network Connection
id: cc1ac1cf-5d91-551e-9e68-c5ad847c72df
status: experimental
description: |
    Draft detection for T1011 (Exfiltration Over Other Network Medium), derived from ATT&CK
    detection strategy DET0077 / analytic AN0212.
    Adversaries may attempt to exfiltrate data over a different network medium than the command and
    control channel. If the command and control network is a wired Internet connection, the
    exfiltration may occur, for example, over a WiFi connection, modem, cellular data connection,
    Bluetooth, or another radio frequency (RF) channel.
    ATT&CK analytic: Execution of file transfer or network access activity through non-primary
    interfaces (e.g., WiFi, Bluetooth, cellular) by processes not typically associated with such
    behavior (e.g., rundll32, powershell, regsvr32).
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
