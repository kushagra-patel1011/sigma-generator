title: Potential Control Panel Activity Via Process Creation
id: 30563887-5655-52a2-8a47-c6ee509af16f
status: experimental
description: |
    Draft detection for T1218.002 (Control Panel), derived from ATT&CK detection strategy DET0194 /
    analytic AN0558.
    Adversaries may abuse control.exe to proxy execution of malicious payloads. The Windows Control
    Panel process binary (control.exe) handles execution of Control Panel items, which are utilities
    that allow users to view and adjust computer settings.
    ATT&CK analytic: Execution of control.exe or rundll32.exe with parameters pointing to CPL files,
    especially from non-standard directories or newly created files, followed by suspicious child
    process execution or registry modifications registering new Control Panel items.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1218/002
    - https://attack.mitre.org/detectionstrategies/DET0194
    - https://attack.mitre.org/detectionstrategies/DET0194#AN0558
    - https://blog.trendmicro.com/trendlabs-security-intelligence/control-panel-files-used-as-malicious-attachments/
    - https://researchcenter.paloaltonetworks.com/2017/11/unit42-new-malware-with-ties-to-sunorcal-discovered/
    - https://www.welivesecurity.com/wp-content/uploads/2020/06/ESET_InvisiMole.pdf
author: sigma-generator
date: 2026-09-24
