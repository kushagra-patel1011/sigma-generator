description: |
    Draft detection for T1021.005 (VNC), derived from ATT&CK detection strategy DET0178 / analytic
    AN0504.
    Adversaries may use Valid Accounts to remotely control machines using Virtual Network Computing
    (VNC). VNC is a platform-independent desktop sharing system that uses the RFB (“remote
    framebuffer”) protocol to enable users to remotely control another computer’s display by
    relaying the screen, mouse, and keyboard inputs over the network.
    ATT&CK analytic: Detection of VNC service or executable starting unexpectedly, followed by user
