title: Potential Disable or Modify System Firewall Activity Via Process Creation
id: 721dbfb6-ecfa-53d1-9697-89d91a917aa5
status: experimental
description: |
    Draft detection for T1686 (Disable or Modify System Firewall), derived from ATT&CK detection
    strategy DET0145 / analytic AN0406.
    Adversaries may disable or modify host-based or network firewalls to impair defensive mechanisms
    and enable further action. Once an adversary has gathered sufficient privileges, they can tamper
    with firewall services, policies, or rule sets to remove restrictions on inbound or outbound
    traffic.
    ATT&CK analytic: Detection of firewall tampering by monitoring processes executing netsh,
    PowerShell Set-NetFirewallProfile, or sc stop mpssvc. Registry modifications under
    HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy also indicate
    adversarial actions.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1686
    - https://attack.mitre.org/detectionstrategies/DET0145
    - https://attack.mitre.org/detectionstrategies/DET0145#AN0406
    - https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/7-0/add-allowed-ip-addresses-for-an-esxi-host-by-using-the-vmware-host-client.html
