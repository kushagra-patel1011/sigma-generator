detection:
    selection_image:
        Image|endswith:
            - '\netsh.exe'
            - '\powershell.exe'
            - '\sc.exe'
    selection_indicator_content:
        CommandLine|contains:
            - '\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy'
            - Set-NetFirewallProfile
    condition: selection_image and selection_indicator_content
fields:
