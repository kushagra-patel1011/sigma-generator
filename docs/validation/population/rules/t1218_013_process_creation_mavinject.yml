title: Potential Mavinject Activity Via Process Creation
id: 562640c0-df84-532a-9f5d-0f3f5029efcb
status: experimental
description: |
    Draft detection for T1218.013 (Mavinject), derived from ATT&CK detection strategy DET0433 /
    analytic AN1207.
    Adversaries may abuse mavinject.exe to proxy execution of malicious code. Mavinject.exe is the
    Microsoft Application Virtualization Injector, a Windows utility that can inject code into
    external processes as part of Microsoft Application Virtualization (App-V).
    ATT&CK analytic: Abuse of mavinject.exe to inject DLLs or import descriptors into another
    running process. Chain: (1) mavinject.exe starts with /INJECTRUNNING or /HMODULE → (2) mavinject
    obtains high-access handles to a target process (VM_WRITE/CREATE_THREAD) → (3) target process
    loads attacker DLL (module load) → (4) optional follow-on child activity or network egress from
    the target process.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
