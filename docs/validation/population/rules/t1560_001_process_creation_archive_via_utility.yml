title: Potential Archive via Utility Activity Via Process Creation
id: ebb5b287-3858-51e8-81c4-da03dbc2fa91
status: experimental
description: |
    Draft detection for T1560.001 (Archive via Utility), derived from ATT&CK detection strategy
    DET0298 / analytic AN0831.
    Adversaries may use utilities to compress and/or encrypt collected data prior to exfiltration.
    Many utilities include functionalities to compress, encrypt, or otherwise package data into a
    format that is easier/more secure to transport.
    ATT&CK analytic: Detects adversarial archiving using built-in or third-party utilities (makecab,
    diantz, xcopy, certutil, 7z, WinRAR, WinZip). Correlates suspicious process creation events with
    command-line arguments for compression/encoding, followed by creation of archive files (.cab,
    .zip, .7z, .rar).
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
