title: Potential Browser Fingerprint Activity Via Network Connection
id: bbae7516-e749-52ed-9dd9-35980e0541d3
status: experimental
description: |
    Draft detection for T1036.012 (Browser Fingerprint), derived from ATT&CK detection strategy
    DET0898 / analytic AN2029.
    Adversaries may attempt to blend in with legitimate traffic by spoofing browser and system
    attributes like operating system, system language, platform, user-agent string, resolution, time
    zone, etc. The HTTP User-Agent request header is a string that lets servers and network peers
    identify the application, operating system, vendor, and/or version of the requesting user
    agent....
    ATT&CK analytic: Process execution without GUI context (e.g., powershell.exe, wscript.exe)
    generates HTTP traffic with a spoofed User-Agent mimicking a legitimate browser. No
    corresponding UI application (e.g., msedge.exe) is active or in parent lineage.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
