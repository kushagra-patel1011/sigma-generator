title: Potential Timestomp Activity Via Alternate Data Stream Creation
id: 175255ee-beb4-5d10-9d6b-d0f7bf754116
status: experimental
description: |
    Draft detection for T1070.006 (Timestomp), derived from ATT&CK detection strategy DET0591 /
    analytic AN1626.
    Adversaries may modify file time attributes to hide new files or changes to existing files.
    Timestomping is a technique that modifies the timestamps of a file (the modify, access, create,
    and change times), often to mimic files that are in the same folder and blend malicious files
    with legitimate files.
    ATT&CK analytic: Detects attempts to modify file timestamps via API usage (e.g., `SetFileTime`),
    CLI tools (e.g., `w32tm`, PowerShell), or double-timestomp behavior where $SI and $FN timestamps
    are mismatched or reverted.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
