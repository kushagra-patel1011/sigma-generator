title: Potential Trusted Developer Utilities Proxy Execution Activity Via Process Creation
id: 94842c1f-3a62-5038-b1dc-d712b869f646
status: experimental
description: |
    Draft detection for T1127 (Trusted Developer Utilities Proxy Execution), derived from ATT&CK
    detection strategy DET0172 / analytic AN0488.
    Adversaries may take advantage of trusted developer utilities to proxy execution of malicious
    payloads. There are many utilities used for software development related tasks that can be used
    to execute code in various forms to assist in development, debugging, and reverse engineering.
    ATT&CK analytic: A trusted/signed developer utility (parent) is executed in a non-developer
    context and (a) spawns suspicious children (e.g., powershell.exe, cmd.exe, rundll32.exe,
    regsvr32.exe, wscript.exe), (b) loads unsigned/user-writable DLLs, (c) writes and then runs a
    new PE from user-writable paths, and/or (d) immediately makes outbound network connections.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
