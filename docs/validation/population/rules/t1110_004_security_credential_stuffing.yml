    Draft detection for T1110.004 (Credential Stuffing), derived from ATT&CK detection strategy
    DET0460 / analytic AN1262.
    Adversaries may use credentials obtained from breach dumps of unrelated accounts to gain access
    to target accounts through credential overlap. Occasionally, large numbers of username and
