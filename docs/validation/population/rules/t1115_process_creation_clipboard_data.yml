title: Potential Clipboard Data Activity Via Process Creation
id: 528f8c4f-3bb7-5f1d-a429-43eaa5a963e4
status: experimental
description: |
    Draft detection for T1115 (Clipboard Data), derived from ATT&CK detection strategy DET0341 /
    analytic AN0965.
    Adversaries may collect data stored in the clipboard from users copying information within or
    between applications. For example, on Windows adversaries can access clipboard data by using
    clip.exe or Get-Clipboard.
    ATT&CK analytic: Detection of clipboard access via OS utilities (e.g., clip.exe, Get-Clipboard)
    by non-interactive or abnormal parent processes, potentially chained with staging or
    exfiltration commands.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
