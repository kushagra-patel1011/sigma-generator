title: Potential Malicious Copy and Paste Activity Via Process Creation
id: 6ce171d9-653c-5410-b2b5-59f35e2cf104
status: experimental
description: |
    Draft detection for T1204.004 (Malicious Copy and Paste), derived from ATT&CK detection strategy
    DET0340 / analytic AN0962.
    An adversary may rely upon a user copying and pasting code in order to gain execution. Users may
    be subjected to social engineering to get them to copy and paste code directly into a Command
    and Scripting Interpreter.
    ATT&CK analytic: A user is socially engineered (web page, email, document) to open
    Run/PowerShell/CMD and paste an obfuscated one-liner. The chain is: (1) user context active in a
    browser/email/office app → (2) process creation of a command interpreter with suspicious
    arguments (base64/Invoke-Expression/web download/pipeline to shell) → (3) optional file drop in
    %TEMP% or %APPDATA% → (4)...
