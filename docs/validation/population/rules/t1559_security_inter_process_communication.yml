title: Potential Inter-Process Communication Activity Via Windows Security
id: e48465ba-866f-5808-9970-61608a7a7efb
status: experimental
description: |
    Draft detection for T1559 (Inter-Process Communication), derived from ATT&CK detection strategy
    DET0493 / analytic AN1357.
    Adversaries may abuse inter-process communication (IPC) mechanisms for local code or command
    execution. IPC is typically used by processes to share data, communicate with each other, or
    synchronize execution.
    ATT&CK analytic: Detects anomalous use of COM, DDE, or named pipes for execution. Correlates
    creation or access of IPC mechanisms (e.g., named pipes, COM objects) with unusual parent-child
    process relationships or code injection patterns (e.g., Office spawning cmd.exe via DDE).
