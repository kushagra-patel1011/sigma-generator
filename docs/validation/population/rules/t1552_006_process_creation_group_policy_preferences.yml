title: Potential Group Policy Preferences Activity Via Process Creation
id: f387b585-4dd2-570a-b648-da22de45eb98
status: experimental
description: |
    Draft detection for T1552.006 (Group Policy Preferences), derived from ATT&CK detection strategy
    DET0381 / analytic AN1075.
    Adversaries may attempt to find unsecured credentials in Group Policy Preferences (GPP). GPP are
    tools that allow administrators to create domain policies with embedded credentials.
    ATT&CK analytic: Correlates file enumeration of XML files in the SYSVOL share with suspicious
    process execution that decodes or reads encrypted credentials embedded in Group Policy
    Preference files (e.g., Get-GPPPassword.ps1, gpprefdecrypt.py, Metasploit). Detects abnormal
    access to \DOMAIN\SYSVOL combined with XML file parsing or decryption logic.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
