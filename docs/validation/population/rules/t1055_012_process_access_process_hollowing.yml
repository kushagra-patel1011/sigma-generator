title: Potential Process Hollowing Activity Via Process Access
id: 53edeca5-6a21-5029-b6ab-7432d1f78f12
status: experimental
description: |
    Draft detection for T1055.012 (Process Hollowing), derived from ATT&CK detection strategy
    DET0382 / analytic AN1076.
    Adversaries may inject malicious code into suspended and hollowed processes in order to evade
    process-based defenses. Process hollowing is a method of executing arbitrary code in the address
    space of a separate live process.
    ATT&CK analytic: Detects adversary use of suspended process creation, using the CREATE_SUSPENDED
    flag via CreateProcess, followed by unmapping the memory of the child process
    (NtUnmapViewOfSection) and replacing it with malicious code via
    VirtualAllocEx/WriteProcessMemory, then SetThreadContext and ResumeThread to begin execution
    within the hollowed process.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
