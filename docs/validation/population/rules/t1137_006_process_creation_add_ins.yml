title: Potential Add-ins Activity Via Process Creation
id: 0bb65e97-598b-59b9-a67f-e37c686b74a9
status: experimental
description: |
    Draft detection for T1137.006 (Add-ins), derived from ATT&CK detection strategy DET0050 /
    analytic AN0137.
    Adversaries may abuse Microsoft Office add-ins to obtain persistence on a compromised system.
    Office add-ins can be used to add functionality to Office programs.
    ATT&CK analytic: An adversary writes or drops a malicious Office Add-in (e.g., WLL, XLL, COM) to
    a trusted directory or modifies registry keys to load malicious add-ins on Office application
    launch. Upon user opening Word or Excel, the add-in is automatically loaded, triggering
    execution of the payload, often spawning scripting engines or anomalous child processes.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
