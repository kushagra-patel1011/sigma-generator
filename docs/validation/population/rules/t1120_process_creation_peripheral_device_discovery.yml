title: Potential Peripheral Device Discovery Activity Via Process Creation
id: e6dbe855-2ef8-5b96-ba22-37de2bd96b79
status: experimental
description: |
    Draft detection for T1120 (Peripheral Device Discovery), derived from ATT&CK detection strategy
    DET0491 / analytic AN1353.
    Adversaries may attempt to gather information about attached peripheral devices and components
    connected to a computer system. Peripheral devices could include auxiliary resources that
    support a variety of functionalities such as keyboards, printers, cameras, smart card readers,
    or removable storage.
    ATT&CK analytic: Suspicious enumeration of attached peripherals via WMI, PowerShell, or low-
    level API calls potentially chained with removable device interactions.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
