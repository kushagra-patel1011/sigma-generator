title: Potential Dynamic Data Exchange Activity Via Process Creation
id: ed01b5a2-72d2-5df9-9901-e884fecc9907
status: experimental
description: |
    Draft detection for T1559.002 (Dynamic Data Exchange), derived from ATT&CK detection strategy
    DET0504 / analytic AN1393.
    Adversaries may use Windows Dynamic Data Exchange (DDE) to execute arbitrary commands. DDE is a
    client-server protocol for one-time and/or continuous inter-process communication (IPC) between
    applications.
    ATT&CK analytic: Detects anomalous use of Dynamic Data Exchange (DDE) for code execution, such
    as Office applications (WINWORD.EXE, EXCEL.EXE) spawning command interpreters, or loading
    unusual modules through DDEAUTO/DDE formulas. Correlates suspicious parent-child process
    relationships, registry keys enabling DDE, and module loads inconsistent with normal Office
    usage.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
