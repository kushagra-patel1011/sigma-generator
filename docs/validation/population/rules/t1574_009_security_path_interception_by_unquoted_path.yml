title: Potential Path Interception by Unquoted Path Activity Via Windows Security
id: f5d37137-f917-5529-891a-f64aac8b6523
status: experimental
description: |
    Draft detection for T1574.009 (Path Interception by Unquoted Path), derived from ATT&CK
    detection strategy DET0064 / analytic AN0176.
    Adversaries may execute their own malicious payloads by hijacking vulnerable file path
    references. Adversaries can take advantage of paths that lack surrounding quotations by placing
    an executable in a higher level directory within the path, so that Windows will choose the
    adversary's executable to launch.
    ATT&CK analytic: Unquoted service or shortcut paths that contain spaces and allow path
    interception by higher-level executables. Defender observes registry service configurations with
    unquoted paths, file creation of executables in parent directories of unquoted paths, and
    subsequent process execution from unexpected locations.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
