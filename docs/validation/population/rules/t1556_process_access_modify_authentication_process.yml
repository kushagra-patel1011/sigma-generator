    Draft detection for T1556 (Modify Authentication Process), derived from ATT&CK detection
    strategy DET0104 / analytic AN0287.
    Adversaries may modify authentication mechanisms and processes to access user credentials or
    enable otherwise unwarranted access to accounts. The authentication process is handled by
    mechanisms, such as the Local Security Authentication Server (LSASS) process and the Security
    Accounts Manager (SAM) on Windows, pluggable authentication modules (PAM) on Unix-based systems,
    and...
    ATT&CK analytic: Detects modification of LSASS and authentication DLLs, suspicious registry
