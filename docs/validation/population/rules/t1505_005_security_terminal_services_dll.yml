title: Potential Terminal Services DLL Activity Via Windows Security
id: 6955ce10-366d-50a4-b5f8-195d23df411d
status: experimental
description: |
    Draft detection for T1505.005 (Terminal Services DLL), derived from ATT&CK detection strategy
    DET0212 / analytic AN0595.
    Adversaries may abuse components of Terminal Services to enable persistent access to systems.
    Microsoft Terminal Services, renamed to Remote Desktop Services in some Windows Server OSs as of
    2022, enable remote terminal connections to hosts.
    ATT&CK analytic: Adversary modifies or replaces the Terminal Services DLL (`termsrv.dll`) or
    changes the associated `ServiceDll` Registry value to load an arbitrary or patched DLL that
    enables persistent and enhanced RDP access. This may include binary replacement, registry
    tampering, and unexpected module loads by the `svchost.exe -k termsvcs` process.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
