title: Potential Publish or Subscribe Protocols Activity Via Network Connection
id: e9cf81d6-655e-599b-b714-a3742a08b211
status: experimental
description: |
    Draft detection for T1071.005 (Publish/Subscribe Protocols), derived from ATT&CK detection
    strategy DET0002 / analytic AN0002.
    Adversaries may communicate using publish/subscribe (pub/sub) application layer protocols to
    avoid detection/network filtering by blending in with existing traffic. Commands to the remote
    system, and often the results of those commands, will be embedded within the protocol traffic
    between the client and server.
    ATT&CK analytic: Detects non-standard processes (e.g., PowerShell, python.exe, rundll32.exe)
    making outbound connections using publish/subscribe protocols (e.g., MQTT, AMQP) over non-
    browser, encrypted channels, often beaconing to message brokers.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
