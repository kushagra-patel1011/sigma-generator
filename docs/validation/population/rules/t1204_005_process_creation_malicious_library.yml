title: Potential Malicious Library Activity Via Process Creation
id: d8dc6c9d-434d-5fe4-b7f3-c0c1ae3baba2
status: experimental
description: |
    Draft detection for T1204.005 (Malicious Library), derived from ATT&CK detection strategy
    DET0252 / analytic AN0699.
    Adversaries may rely on a user installing a malicious library to facilitate execution. Threat
    actors may Upload Malware to package managers such as NPM and PyPi, as well as to public code
    repositories such as GitHub.
    ATT&CK analytic: Execution of `pip.exe`, `npm.cmd`, or MSI installers within user context,
    followed by script interpreter startup (e.g., python.exe) or PowerShell with unusual child
    processes or file writes in `%APPDATA%`, `%TEMP%`, or `%LOCALAPPDATA%`. Defender correlates
    command-line install tools with Sysmon and Event Logs to trace downstream behavior.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
