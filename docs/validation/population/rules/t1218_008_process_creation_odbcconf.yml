title: Potential Odbcconf Activity Via Process Creation
id: d48118df-bda8-5ed4-a2d4-51049a08b4ee
status: experimental
description: |
    Draft detection for T1218.008 (Odbcconf), derived from ATT&CK detection strategy DET0486 /
    analytic AN1335.
    Adversaries may abuse odbcconf.exe to proxy execution of malicious payloads. Odbcconf.exe is a
    Windows utility that allows you to configure Open Database Connectivity (ODBC) drivers and data
    source names.
    ATT&CK analytic: Identifies abuse of odbcconf.exe to execute malicious DLLs using the REGSVR
    command flag. Behavior chain: (1) Process creation of odbcconf.exe with /REGSVR or /A {REGSVR
    ...} arguments → (2) DLL load by odbcconf.exe of non-standard or unsigned modules → (3) Optional
    follow-on process creation or network activity from loaded DLL.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
