title: Potential Socket Filters Activity Via Windows System
id: b753b3c3-2eba-56ed-a74b-c255c880a083
status: experimental
description: |
    Draft detection for T1205.002 (Socket Filters), derived from ATT&CK detection strategy DET0162 /
    analytic AN0462.
    Adversaries may attach filters to a network socket to monitor then activate backdoors used for
    persistence or command and control. With elevated permissions, adversaries can use features such
    as the `libpcap` library to open sockets and install filters to allow or disallow certain types
    of data to come through the socket.
    ATT&CK analytic: Adversary installs/uses packet-capture or raw-socket capability (WinPcap/Npcap,
    wpcap/packet DLLs or raw socket attach) and sets a filter. A crafted inbound packet is observed;
    within a short window the host process that loaded capture libraries initiates an outbound
    connection (e.g., reverse shell) to the packet origin.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
