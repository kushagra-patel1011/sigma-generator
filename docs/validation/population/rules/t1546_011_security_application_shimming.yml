title: Potential Application Shimming Activity Via Windows Security
id: 188bda08-4585-5f6d-b214-0e7702abc2cb
status: experimental
description: |
    Draft detection for T1546.011 (Application Shimming), derived from ATT&CK detection strategy
    DET0017 / analytic AN0051.
    Adversaries may establish persistence and/or elevate privileges by executing malicious content
    triggered by application shims. The Microsoft Windows Application Compatibility
    Infrastructure/Framework (Application Shim) was created to allow for backward compatibility of
    software as the operating system codebase changes over time.
    ATT&CK analytic: Correlated modification of AppCompat registry keys and execution of sdbinst.exe
    to install custom shim databases. Followed by DLL injection via shim behavior into target
    application processes.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
