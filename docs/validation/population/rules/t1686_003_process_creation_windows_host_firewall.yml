title: Potential Windows Host Firewall Activity Via Process Creation
id: 7ecbd255-1405-5c04-b4b4-e2a5b75bbb22
status: experimental
description: |
    Draft detection for T1686.003 (Windows Host Firewall), derived from ATT&CK detection strategy
    DET0901 / analytic AN2043.
    Adversaries may disable or modify the Windows host firewall to bypass controls limiting network
    usage. This can include disabling the Windows host firewall entirely, suppressing specific
    profiles (domain, private, public), or adding, deleting, and modifying firewall rules to allow
    or restrict traffic.
    ATT&CK analytic: Detects processes or users modifying Windows Defender Firewall profiles,
    policies, or rules followed by measurable network exposure changes. Correlates firewall
    management execution, registry/policy mutation, service state changes, and subsequent inbound or
    outbound connectivity inconsistent with baseline administration.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
