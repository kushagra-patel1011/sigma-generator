description: |
    Draft detection for T1498.001 (Direct Network Flood), derived from ATT&CK detection strategy
    DET0343 / analytic AN0969.
    Adversaries may attempt to cause a denial of service (DoS) by directly sending a high-volume of
    network traffic to a target. This DoS attack may also reduce the availability and functionality
    of the targeted system(s) and network.
    ATT&CK analytic: High-volume packet generation by local processes (e.g., PowerShell, cmd,
