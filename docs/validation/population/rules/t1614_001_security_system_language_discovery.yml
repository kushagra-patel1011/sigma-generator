title: Potential System Language Discovery Activity Via Windows Security
id: ed4e68b6-4a91-55df-a9a3-8f16b7b5a5a4
status: experimental
description: |
    Draft detection for T1614.001 (System Language Discovery), derived from ATT&CK detection
    strategy DET0565 / analytic AN1561.
    Adversaries may attempt to gather information about the system language of a victim in order to
    infer the geographical location of that host. This information may be used to shape follow-on
    behaviors, including whether the adversary infects the target and/or attempts specific actions.
    ATT&CK analytic: Registry access to system language keys (e.g.,
    HKLM\SYSTEM\CurrentControlSet\Control\Nls\Language) or suspicious processes invoking locale-
    related APIs (e.g., GetUserDefaultUILanguage, GetSystemDefaultUILanguage,
    GetKeyboardLayoutList). Defender visibility focuses on anomalous or non-standard processes
    issuing these queries, especially when run by unknown binaries or scripts.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
