title: Potential Password Cracking Activity Via Process Creation
id: 7c240981-e18c-5643-8a58-48b830bfa990
status: experimental
description: |
    Draft detection for T1110.002 (Password Cracking), derived from ATT&CK detection strategy
    DET0105 / analytic AN0292.
    Adversaries may use password cracking to attempt to recover usable credentials, such as
    plaintext passwords, when credential material such as password hashes are obtained. OS
    Credential Dumping can be used to obtain password hashes, this may only get an adversary so far
    when Pass the Hash is not an option.
    ATT&CK analytic: Use of hash-cracking tools (e.g., John the Ripper, Hashcat) after credential
    dumping, combined with high CPU usage or GPU invocation via unsigned binaries accessing password
    hash files
    Generated draft - the selection values below were mined from ATT&CK and must be validated
