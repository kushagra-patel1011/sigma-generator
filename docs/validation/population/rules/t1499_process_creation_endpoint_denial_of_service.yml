title: Potential Endpoint Denial of Service Activity Via Process Creation
id: eca017ed-8ef4-51e2-8a86-a0f147fd2cf0
status: experimental
description: |
    Draft detection for T1499 (Endpoint Denial of Service), derived from ATT&CK detection strategy
    DET0208 / analytic AN0584.
    Adversaries may perform Endpoint Denial of Service (DoS) attacks to degrade or block the
    availability of services to users. Endpoint DoS can be performed by exhausting the system
    resources those services are hosted on or exploiting the system to cause a persistent crash
    condition.
    ATT&CK analytic: Excessive resource exhaustion or service crash induced by processes launched by
    users or scripts that rapidly consume CPU/memory or attempt malformed service interactions.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
