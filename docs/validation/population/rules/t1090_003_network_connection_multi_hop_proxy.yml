status: experimental
description: |
    Draft detection for T1090.003 (Multi-hop Proxy), derived from ATT&CK detection strategy DET0359
    / analytic AN1020.
    Adversaries may chain together multiple proxies to disguise the source of malicious traffic.
    Typically, a defender will be able to identify the last proxy traffic traversed before it enters
    their network; the defender may or may not be able to identify any previous proxies before the
    last-hop proxy.
    ATT&CK analytic: Suspicious processes (e.g., Tor clients, relays, unknown binaries) launch with
    sustained encrypted outbound traffic to known anonymity infrastructure (e.g., Tor, I2P), and may
    relay to additional internal systems via reverse proxying, ICMP tunneling, or socket forwarding.
