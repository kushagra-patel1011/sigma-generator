description: |
    Draft detection for T1498.002 (Reflection Amplification), derived from ATT&CK detection strategy
    DET0408 / analytic AN1140.
    Adversaries may attempt to cause a denial of service (DoS) by reflecting a high-volume of
    network traffic to a target. This type of Network DoS takes advantage of a third-party server
    intermediary that hosts and will respond to a given spoofed source IP address.
    ATT&CK analytic: Outbound spoofed traffic to known amplification protocols (e.g., DNS, NTP,
