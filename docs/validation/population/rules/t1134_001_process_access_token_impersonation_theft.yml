description: |
    Draft detection for T1134.001 (Token Impersonation/Theft), derived from ATT&CK detection
    strategy DET0482 / analytic AN1324.
    Adversaries may duplicate then impersonate another user's existing token to escalate privileges
    and bypass access controls. For example, an adversary can duplicate an existing token using
