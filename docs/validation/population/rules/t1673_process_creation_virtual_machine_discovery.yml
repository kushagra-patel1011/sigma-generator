status: experimental
description: |
    Draft detection for T1673 (Virtual Machine Discovery), derived from ATT&CK detection strategy
    DET0199 / analytic AN0574.
    An adversary may attempt to enumerate running virtual machines (VMs) after gaining access to a
    host or hypervisor. For example, adversaries may enumerate a list of VMs on an ESXi hypervisor
    using a Hypervisor CLI such as `esxcli` or `vim-cmd` (e.g. `esxcli vm process list or vim-cmd
    vmsvc/getallvms`).
    ATT&CK analytic: Detects enumeration of VMs using PowerShell (`Get-VM`), VMware Workstation
    (`vmrun.exe`), or Hyper-V (`VBoxManage.exe`). Defender observes suspicious command lines
    executed by unexpected users or outside normal administrative sessions.
