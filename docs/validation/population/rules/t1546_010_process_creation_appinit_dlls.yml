description: |
    Draft detection for T1546.010 (AppInit DLLs), derived from ATT&CK detection strategy DET0557 /
    analytic AN1536.
    Adversaries may establish persistence and/or elevate privileges by executing malicious content
    triggered by AppInit DLLs loaded into processes. Dynamic-link libraries (DLLs) that are
    specified in the AppInit_DLLs value in the Registry keys
    HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Windows or
