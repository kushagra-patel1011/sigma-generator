title: Potential Outlook Rules Activity Via Process Creation
id: 0826ba4f-3d65-5dc6-80fb-7b1794c16fd5
status: experimental
description: |
    Draft detection for T1137.005 (Outlook Rules), derived from ATT&CK detection strategy DET0095 /
    analytic AN0263.
    Adversaries may abuse Microsoft Outlook rules to obtain persistence on a compromised system.
    Outlook rules allow a user to define automated behavior to manage email messages.
    ATT&CK analytic: Adversary uses a tool like Ruler or MFCMapi to create a malicious Outlook rule
    that triggers execution upon receipt of a crafted email. On email delivery, Outlook executes the
    rule, resulting in code execution (e.g., launching mshta.exe or PowerShell).
