title: Potential Dead Drop Resolver Activity Via Network Connection
id: 51286dfd-c189-5bbf-866a-061ab3825ea4
status: experimental
description: |
    Draft detection for T1102.001 (Dead Drop Resolver), derived from ATT&CK detection strategy
    DET0058 / analytic AN0158.
    Adversaries may use an existing, legitimate external Web service to host information that points
    to additional command and control (C2) infrastructure. Adversaries may post content, known as a
    dead drop resolver, on Web services with embedded (and often obfuscated/encoded) domains or IP
    addresses.
    ATT&CK analytic: Detection of a process or script that accesses a common web service to retrieve
