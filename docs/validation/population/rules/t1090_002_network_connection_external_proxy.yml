title: Potential External Proxy Activity Via Network Connection
id: 34487285-8046-5ec5-9e9b-339bda54d821
status: experimental
description: |
    Draft detection for T1090.002 (External Proxy), derived from ATT&CK detection strategy DET0325 /
    analytic AN0922.
    Adversaries may use an external proxy to act as an intermediary for network communications to a
    command and control server to avoid direct connections to their infrastructure. Many tools exist
    that enable traffic redirection through proxies or port redirection, including HTRAN, ZXProxy,
    and ZXPortMap.
    ATT&CK analytic: Unusual process (e.g., `rundll32`, `mshta`, `wscript`, or custom payloads)
    initiates network connection to external IPs/domains that proxy C2 traffic, often over uncommon
    ports or high entropy HTTP/S connections.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
