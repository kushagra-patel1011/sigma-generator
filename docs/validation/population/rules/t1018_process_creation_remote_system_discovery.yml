title: Potential Remote System Discovery Activity Via Process Creation
id: ae2826a0-b2e5-56d7-871f-a4ec846b5a6a
status: experimental
description: |
    Draft detection for T1018 (Remote System Discovery), derived from ATT&CK detection strategy
    DET0574 / analytic AN1583.
    Adversaries may attempt to get a listing of other systems by IP address, hostname, or other
    logical identifier on a network that may be used for Lateral Movement from the current system.
    Functionality could exist within remote access tools to enable this, but utilities available on
    the operating system could also be used such as Ping, net view using Net, or, on ESXi servers...
    ATT&CK analytic: Execution of network enumeration utilities (e.g., net.exe, ping.exe,
    tracert.exe) in short succession, often chained with lateral movement tools or system
    enumeration commands.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1018
    - https://attack.mitre.org/detectionstrategies/DET0574
    - https://attack.mitre.org/detectionstrategies/DET0574#AN1583
    - https://us-cert.cisa.gov/ncas/analysis-reports/ar21-126a
    - https://www.elastic.co/security-labs/embracing-offensive-tooling-building-detections-against-koadic-using-eql
    - https://www.us-cert.gov/ncas/alerts/TA18-106A
author: sigma-generator
date: 2026-09-24
tags:
    - attack.discovery
    - attack.t1018
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\net.exe'
            - '\ping.exe'
            - '\psexec.exe'
            - '\tracert.exe'
            - '\word.exe'
    selection_indicator_content:
        CommandLine|contains:
            - ':\Windows\System32\Drivers\etc\hosts'
    condition: selection_image and selection_indicator_content
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Legitimate administrative or software-deployment use of net.exe, ping.exe, psexec.exe
    - 'Environment-specific tuning of TimeWindow: Define bursty execution patterns of enumeration commands (e.g., <30s)'
    - 'Environment-specific tuning of CommandLinePattern: Tunable per org’s scripting/IT tools (e.g., exclude SCCM, PsExec)'
    - 'Environment-specific tuning of ParentProcess: Flag suspicious process ancestry (e.g., Word.exe spawning net.exe)'
    - Unknown
level: low
