title: Potential Path Interception by PATH Environment Variable Activity Via Windows Security
id: 3ab0eeb1-d0e3-5ccd-927b-025eb0ebc4ec
status: experimental
description: |
    Draft detection for T1574.007 (Path Interception by PATH Environment Variable), derived from
    ATT&CK detection strategy DET0004 / analytic AN0009.
    Adversaries may execute their own malicious payloads by hijacking environment variables used to
    load libraries. The PATH environment variable contains a list of directories (User and System)
    that the OS searches sequentially through in search of the binary that was called from a script
    or the command line.
    ATT&CK analytic: Abnormal modification of the PATH environment variable or registry keys
    controlling system paths, combined with execution of binaries named after legitimate system
    tools from user-writable directories. Defender correlates registry modifications, file creation
    of suspicious binaries, and process execution paths inconsistent with baseline system
    directories.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
