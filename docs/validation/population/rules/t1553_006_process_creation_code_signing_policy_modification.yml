title: Potential Code Signing Policy Modification Activity Via Process Creation
id: 6728de8a-0f32-5c2b-8451-71aecb54cf74
status: experimental
description: |
    Draft detection for T1553.006 (Code Signing Policy Modification), derived from ATT&CK detection
    strategy DET0523 / analytic AN1446.
    Adversaries may modify code signing policies to enable execution of unsigned or self-signed
    code. Code signing provides a level of authenticity on a program from a developer and a
    guarantee that the program has not been tampered with.
    ATT&CK analytic: Monitors execution of administrative utilities (e.g., bcdedit.exe) or registry
    modifications that disable Driver Signature Enforcement (DSE) or enable Test Signing. Correlates
    command-line activity, registry changes, and subsequent process executions that bypass signing
    enforcement.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
