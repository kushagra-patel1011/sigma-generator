status: experimental
description: |
    Draft detection for T1546.002 (Screensaver), derived from ATT&CK detection strategy DET0154 /
    analytic AN0441.
    Adversaries may establish persistence by executing malicious content triggered by user
    inactivity. Screensavers are programs that execute after a configurable time of user inactivity
    and consist of Portable Executable (PE) files with a .scr file extension.
    ATT&CK analytic: Unusual screensaver (.scr) executions correlated with recent registry
    modifications to HKCU\Control Panel\Desktop values such as SCRNSAVE.exe, ScreenSaveTimeout, and
    ScreenSaveActive. Detection focuses on PE image paths not consistent with known legitimate
    screensavers and triggered after user inactivity timeout.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
