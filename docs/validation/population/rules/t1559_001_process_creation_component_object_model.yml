title: Potential Component Object Model Activity Via Process Creation
id: 40585e2f-ebe0-5e19-98f8-cc5d0b6c5bec
status: experimental
description: |
    Draft detection for T1559.001 (Component Object Model), derived from ATT&CK detection strategy
    DET0224 / analytic AN0628.
    Adversaries may use the Windows Component Object Model (COM) for local code execution. COM is an
    inter-process communication (IPC) component of the native Windows application programming
    interface (API) that enables interaction between software objects, or executable code that
    implements one or more interfaces.
    ATT&CK analytic: Detects anomalous use of COM objects for execution, such as Office applications
    spawning scripting engines, enumeration of COM interfaces via registry queries, or processes
    loading atypical DLLs through COM activation. Correlates process creation, module loads, and
    registry queries to flag suspicious COM-based code execution or persistence.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
