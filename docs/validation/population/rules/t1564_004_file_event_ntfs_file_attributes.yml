title: Potential NTFS File Attributes Activity Via File Creation
id: 2b09832c-c85e-58b0-bc20-7867050724e8
status: experimental
description: |
    Draft detection for T1564.004 (NTFS File Attributes), derived from ATT&CK detection strategy
    DET0432 / analytic AN1206.
    Adversaries may use NTFS file attributes to hide their malicious data in order to evade
    detection. Every New Technology File System (NTFS) formatted partition contains a Master File
    Table (MFT) that maintains a record for every file/directory on the partition.
    ATT&CK analytic: Suspicious use of NTFS file attributes such as Alternate Data Streams (ADS) or
    Extended Attributes (EA) to hide data. Defender perspective: anomalous file creations or
    modifications containing colon syntax (file.ext:ads), API calls like ZwSetEaFile/ZwQueryEaFile,
    or PowerShell/Windows utilities interacting with -stream parameters.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
