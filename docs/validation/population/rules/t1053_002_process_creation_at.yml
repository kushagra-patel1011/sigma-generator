title: Potential At Activity Via Process Creation
id: 84aafed2-9b7c-5805-849e-15984973d820
status: experimental
description: |
    Draft detection for T1053.002 (At), derived from ATT&CK detection strategy DET0333 / analytic
    AN0943.
    Adversaries may abuse the at utility to perform task scheduling for initial or recurring
    execution of malicious code. The at utility exists as an executable within Windows, Linux, and
    macOS for scheduling tasks at a specified time and date.
    ATT&CK analytic: Detects creation of scheduled tasks via `at.exe` or WMI `Win32_ScheduledJob`
    class, followed by execution of anomalous processes by svchost.exe or taskeng.exe.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
