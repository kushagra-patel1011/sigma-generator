title: Potential Permission Groups Discovery Activity Via Process Creation
id: 739930d8-dfa3-5068-8c9b-c9d3020103a2
status: experimental
description: |
    Draft detection for T1069 (Permission Groups Discovery), derived from ATT&CK detection strategy
    DET0179 / analytic AN0507.
    Adversaries may attempt to discover group and permission settings. This information can help
    adversaries determine which user accounts and groups are available, the membership of users in
    particular groups, and which users and groups have elevated permissions.
    ATT&CK analytic: Detection of adversary enumeration of domain or local group memberships via
    native tools such as net.exe, PowerShell, or WMI. This activity may precede lateral movement or
    privilege escalation.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
