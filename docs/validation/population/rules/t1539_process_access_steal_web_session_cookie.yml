title: Potential Steal Web Session Cookie Activity Via Process Access
id: 05f22dc3-6e74-5cf7-bbb1-473b661cc326
status: experimental
description: |
    Draft detection for T1539 (Steal Web Session Cookie), derived from ATT&CK detection strategy
    DET0509 / analytic AN1402.
    An adversary may steal web application or service session cookies and use them to gain access to
    web applications or Internet services as an authenticated user without needing credentials. Web
    applications and services often use session cookies as an authentication token after a user has
    authenticated to a website.
    ATT&CK analytic: Detects suspicious access to browser session cookie storage (e.g., Chrome’s
    `Cookies` SQLite DB) or memory reads of browser processes. Anomalous injection or memory dump
    utilities targeting browser processes such as `chrome.exe`, `firefox.exe`, or `msedge.exe`.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
