title: Potential Email Hiding Rules Activity Via PowerShell Script Block Logging
id: d89b08ef-0f1e-5139-8c25-79ba2776c288
status: experimental
description: |
    Draft detection for T1564.008 (Email Hiding Rules), derived from ATT&CK detection strategy
    DET0192 / analytic AN0551.
    Adversaries may use email rules to hide inbound emails in a compromised user's mailbox. Many
    email clients allow users to create inbox rules for various email functions, including moving
    emails to other folders, marking emails as read, or deleting emails.
    ATT&CK analytic: Suspicious creation or modification of inbox rules through PowerShell (New-
    InboxRule, Set-InboxRule) to automatically delete, move, or hide emails. Defender perspective:
    unusual rule activity correlated with mailbox access and filtering patterns.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
