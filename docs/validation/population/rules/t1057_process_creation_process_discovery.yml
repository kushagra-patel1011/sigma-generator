title: Potential Process Discovery Activity Via Process Creation
id: bd02fc34-f3fa-5064-9362-735bd27a848b
status: experimental
description: |
    Draft detection for T1057 (Process Discovery), derived from ATT&CK detection strategy DET0034 /
    analytic AN0095.
    Adversaries may attempt to get information about running processes on a system. Information
    obtained could be used to gain an understanding of common software/applications running on
    systems within the network.
    ATT&CK analytic: Identifies adversary behavior that launches commands or invokes APIs to
    enumerate active processes (e.g., tasklist.exe, Get-Process, or CreateToolhelp32Snapshot).
    Detects execution combined with parent process lineage, network session context, or remote
    origin.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1057
    - https://attack.mitre.org/detectionstrategies/DET0034
    - https://attack.mitre.org/detectionstrategies/DET0034#AN0095
    - https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/fundamentals/command/cf_command_ref/show_monitor_permit_list_through_show_process_memory.html#wp3599497760
    - https://www.crowdstrike.com/en-us/blog/hypervisor-jackpotting-ecrime-actors-increase-targeting-of-esxi-servers/
