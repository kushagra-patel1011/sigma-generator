title: Potential Windows Management Instrumentation Activity Via Process Creation
id: 4f0971f7-5817-5a86-ab56-785e7585dde3
status: experimental
description: |
    Draft detection for T1047 (Windows Management Instrumentation), derived from ATT&CK detection
    strategy DET0364 / analytic AN1031.
    Adversaries may abuse Windows Management Instrumentation (WMI) to execute malicious commands and
    payloads. WMI is designed for programmers and is the infrastructure for management data and
    operations on Windows systems.
    ATT&CK analytic: Detects adversarial abuse of WMI to execute local or remote commands via WMIC,
    PowerShell, or COM API through a multi-event chain: process creation, command execution, and
    corresponding network connection if remote.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1047
    - https://attack.mitre.org/detectionstrategies/DET0364
    - https://attack.mitre.org/detectionstrategies/DET0364#AN1031
    - https://www.fireeye.com/content/dam/fireeye-www/global/en/current-threats/pdfs/wp-windows-management-instrumentation.pdf
    - https://www.mandiant.com/resources/reports
    - https://www.microsoft.com/en-us/security/blog/2022/06/13/the-many-lives-of-blackcat-ransomware/
author: sigma-generator
date: 2026-09-24
tags:
