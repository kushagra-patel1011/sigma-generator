logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\wbemtool.exe'
            - '\wmic.exe'
    selection_indicator_content:
        CommandLine|contains:
            - Invoke-WmiMethod
    condition: selection_image and selection_indicator_content
