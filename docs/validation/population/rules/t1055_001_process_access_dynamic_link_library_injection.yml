title: Potential Dynamic-link Library Injection Activity Via Process Access
id: 59e4ab4f-ef83-5c5d-8009-65c06bd87886
status: experimental
description: |
    Draft detection for T1055.001 (Dynamic-link Library Injection), derived from ATT&CK detection
    strategy DET0389 / analytic AN1095.
    Adversaries may inject dynamic-link libraries (DLLs) into processes in order to evade process-
    based defenses as well as possibly elevate privileges. DLL injection is a method of executing
    arbitrary code in the address space of a separate live process.
    ATT&CK analytic: Detects DLL injection through correlation of memory allocation and writing to
    remote process memory (e.g., VirtualAllocEx, WriteProcessMemory), followed by remote thread
    creation (e.g., CreateRemoteThread) that loads a suspicious or unsigned DLL using LoadLibrary or
    reflective loading.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
