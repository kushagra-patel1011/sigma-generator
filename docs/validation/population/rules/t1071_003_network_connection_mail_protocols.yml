description: |
    Draft detection for T1071.003 (Mail Protocols), derived from ATT&CK detection strategy DET0135 /
    analytic AN0379.
    Adversaries may communicate using application layer protocols associated with electronic mail
    delivery to avoid detection/network filtering by blending in with existing traffic. Commands to
    the remote system, and often the results of those commands, will be embedded within the protocol
    traffic between the client and server.
    ATT&CK analytic: Detects unauthorized use of SMTP/IMAP/POP3 by suspicious binaries (e.g.,
