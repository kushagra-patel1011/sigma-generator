title: Potential Disable or Modify Windows Event Log Activity Via Registry Modification
id: 62634d54-cd06-5573-87d5-b3e401fd265b
status: experimental
description: |
    Draft detection for T1685.001 (Disable or Modify Windows Event Log), derived from ATT&CK
    detection strategy DET0187 / analytic AN0535.
    Adversaries may disable or modify the Windows Event Log to limit data that can be leveraged for
    detections and audits. Windows Event Log records user and system activity such as login attempts
    and process creation.
    ATT&CK analytic: Detection of attempts to disable or tamper with Windows Event Logging. This
    includes stopping or disabling the EventLog service, modifying registry keys related to EventLog
    and Autologger, using `auditpol` or `wevtutil` to disable categories or clear audit policies,
    and detecting suspicious gaps or resets in event logs.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
