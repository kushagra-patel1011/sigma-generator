title: Potential Steal or Forge Kerberos Tickets Activity Via Windows Security
id: 62264c3f-72a0-5adc-8710-a4ef63b2d8f1
status: experimental
description: |
    Draft detection for T1558 (Steal or Forge Kerberos Tickets), derived from ATT&CK detection
    strategy DET0522 / analytic AN1443.
    Adversaries may attempt to subvert Kerberos authentication by stealing or forging Kerberos
    tickets to enable Pass the Ticket. Kerberos is an authentication protocol widely used in modern
    Windows domain environments.
    ATT&CK analytic: Detects anomalous Kerberos activity such as forged or stolen tickets by
    correlating malformed fields in logon events, RC4-encrypted TGTs, or TGS requests without
    corresponding TGT requests. Also detects suspicious processes accessing LSASS memory for ticket
    extraction.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
