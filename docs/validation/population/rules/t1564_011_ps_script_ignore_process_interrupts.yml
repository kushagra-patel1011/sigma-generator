title: Potential Ignore Process Interrupts Activity Via PowerShell Script Block Logging
id: 86c06b2c-7e2e-5719-ac34-f3f55b43e13a
status: experimental
description: |
    Draft detection for T1564.011 (Ignore Process Interrupts), derived from ATT&CK detection
    strategy DET0067 / analytic AN0182.
    Adversaries may evade defensive mechanisms by executing commands that hide from process
    interrupt signals. Many operating systems use signals to deliver messages to control process
    behavior.
    ATT&CK analytic: PowerShell or script execution with parameters that suppress errors or ignore
    user interrupts, such as `-ErrorAction SilentlyContinue`. Defender perspective: detecting
    discrepancies between suppressed error arguments and continued execution behavior.
