title: Potential Web Cookies Activity Via Network Connection
id: 48d848d8-e68d-51eb-9ece-f883144b047e
status: experimental
description: |
    Draft detection for T1606.001 (Web Cookies), derived from ATT&CK detection strategy DET0171 /
    analytic AN0485.
    Adversaries may forge web cookies that can be used to gain access to web applications or
    Internet services. Web applications and services (hosted in cloud SaaS environments or on-
    premise servers) often use session cookies to authenticate and authorize user access.
    ATT&CK analytic: On Linux, defenders may observe forged cookie activity as unauthorized
    modifications to browser cookie databases (e.g., ~/.mozilla/firefox/*/cookies.sqlite,
    ~/.config/chromium/Default/Cookies) or scripted injection of session tokens. Suspicious usage
    includes curl/wget commands embedding forged cookies in headers, correlated with abnormal
    session activity in SaaS or IaaS logs.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
