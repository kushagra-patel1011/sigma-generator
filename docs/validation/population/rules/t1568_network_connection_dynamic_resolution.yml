title: Potential Dynamic Resolution Activity Via Network Connection
id: edfc1321-9a16-5b27-b79f-d82ad0008424
status: experimental
description: |
    Draft detection for T1568 (Dynamic Resolution), derived from ATT&CK detection strategy DET0039 /
    analytic AN0109.
    Adversaries may dynamically establish connections to command and control infrastructure to evade
    common detections and remediations. This may be achieved by using malware that shares a common
    algorithm with the infrastructure the adversary uses to receive the malware's communications.
    ATT&CK analytic: Correlate high-frequency or anomalous DNS query activity with processes that do
    not normally generate network requests (e.g., Office apps, system utilities). Detect pseudo-
    random or high-entropy domain lookups indicative of domain generation algorithms (DGAs).
