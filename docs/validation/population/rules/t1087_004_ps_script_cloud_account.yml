title: Potential Cloud Account Activity Via PowerShell Script Block Logging
id: 081ee08d-73f0-5899-8533-eb192f8e93d2
status: experimental
description: |
    Draft detection for T1087.004 (Cloud Account), derived from ATT&CK detection strategy DET0386 /
    analytic AN1089.
    Adversaries may attempt to get a listing of cloud accounts. Cloud accounts are those created and
    configured by an organization for use by users, remote support, services, or for administration
    of resources within a cloud service provider or SaaS application.
    ATT&CK analytic: Bulk enumeration of cloud user email identities through `Get-Recipient`, `Get-
