title: Potential Exfiltration Over Web Service Activity Via Process Creation
id: ec653907-1519-539c-a3fa-2e449f52ead4
status: experimental
description: |
    Draft detection for T1567 (Exfiltration Over Web Service), derived from ATT&CK detection
    strategy DET0548 / analytic AN1511.
    Adversaries may use an existing, legitimate external Web service to exfiltrate data rather than
    their primary command and control channel. Popular Web services acting as an exfiltration
    mechanism may give a significant amount of cover due to the likelihood that hosts within a
    network are already communicating with them prior to compromise.
    ATT&CK analytic: Processes that normally do not initiate network communications suddenly making
    outbound HTTPS connections with high outbound-to-inbound data ratios. Defender view: correlation
    between process creation logs (e.g., Word, Excel, PowerShell) and subsequent anomalous network
    traffic volumes toward common web services (Dropbox, Google Drive, OneDrive).
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
