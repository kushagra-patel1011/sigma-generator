title: Potential Standard Encoding Activity Via Process Creation
id: c26cdfc4-5253-5196-8d05-1dbab9cd2de3
status: experimental
description: |
    Draft detection for T1132.001 (Standard Encoding), derived from ATT&CK detection strategy
    DET0124 / analytic AN0345.
    Adversaries may encode data with a standard data encoding system to make the content of command
    and control traffic more difficult to detect. Command and control (C2) information can be
    encoded using a standard data encoding system that adheres to existing protocol specifications.
    ATT&CK analytic: Process invokes a standard encoder (e.g., PowerShell -enc, certutil -encode,
    base64 via .NET/Invoke-Expression) or emits long Base64/hex literals → shortly followed by
    outbound network egress with high bytes_out:bytes_in ratio or HTTP headers/payloads containing
    Base64/MIME blocks.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
