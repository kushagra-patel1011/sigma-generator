title: Potential Device Driver Discovery Activity Via Registry Modification
id: 64953f06-8080-586b-ad2f-ab168115fe11
status: experimental
description: |
    Draft detection for T1652 (Device Driver Discovery), derived from ATT&CK detection strategy
    DET0579 / analytic AN1595.
    Adversaries may attempt to enumerate local device drivers on a victim host. Information about
    device drivers may highlight various insights that shape follow-on behaviors, such as the
    function/purpose of the host, present security tools (i.e. Security Software Discovery) or other
    defenses (e.g., Virtualization/Sandbox Evasion), as well as potential exploitable
    vulnerabilities...
    ATT&CK analytic: Monitor for suspicious usage of driver enumeration utilities (driverquery.exe)
    or API calls such as EnumDeviceDrivers(). Registry queries against
    HKLM\SYSTEM\CurrentControlSet\Services and HardwareProfiles that are abnormal may also indicate
    attempts to discover installed drivers and services.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
