title: Potential COR_PROFILER Activity Via Windows Security
id: 77d1f47d-2397-54b5-9218-3c6c1f7cf9d1
status: experimental
description: |
    Draft detection for T1574.012 (COR_PROFILER), derived from ATT&CK detection strategy DET0479 /
    analytic AN1319.
    Adversaries may leverage the COR_PROFILER environment variable to hijack the execution flow of
    programs that load the .NET CLR. The COR_PROFILER is a .NET Framework feature which allows
    developers to specify an unmanaged (or external of .NET) profiling DLL to be loaded into each
    .NET process that loads the Common Language Runtime (CLR).
    ATT&CK analytic: Modification of COR_PROFILER-related environment variables or Registry keys
    (COR_ENABLE_PROFILING, COR_PROFILER, COR_PROFILER_PATH), combined with anomalous .NET process
    creation or unmanaged DLL loads. Defender observes registry modifications, suspicious process
    creation with altered environment variables, and profiler DLLs loaded unexpectedly into .NET CLR
    processes.
