title: Potential Active Setup Activity Via Registry Modification
id: c7d34304-cf60-5c56-bf4f-661b4be1ff34
status: experimental
description: |
    Draft detection for T1547.014 (Active Setup), derived from ATT&CK detection strategy DET0312 /
    analytic AN0871.
    Adversaries may achieve persistence by adding a Registry key to the Active Setup of the local
    machine. Active Setup is a Windows mechanism that is used to execute programs when a user logs
    in.
    ATT&CK analytic: Multi-event correlation of Registry creation under Active Setup with anomalous
    execution of processes at user logon. Behavioral patterns include creation/modification of HKLM
    Active Setup keys with non-standard StubPath values, followed by process execution from uncommon
    paths, unsigned binaries, or unusual parent-child lineage post-user login.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
