description: |
    Draft detection for T1102.003 (One-Way Communication), derived from ATT&CK detection strategy
    DET0581 / analytic AN1599.
    Adversaries may use an existing, legitimate external Web service as a means for sending commands
    to a compromised system without receiving return output over the Web service channel.
    Compromised systems may leverage popular websites and social media to host command and control
    (C2) instructions.
    ATT&CK analytic: Suspicious process initiating outbound connections to web services without
