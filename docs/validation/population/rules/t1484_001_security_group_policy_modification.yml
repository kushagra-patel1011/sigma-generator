title: Potential Group Policy Modification Activity Via Windows Security
id: bc63369a-c5b3-5dd2-9f55-110e5db5165c
status: experimental
description: |
    Draft detection for T1484.001 (Group Policy Modification), derived from ATT&CK detection
    strategy DET0305 / analytic AN0854.
    Adversaries may modify Group Policy Objects (GPOs) to subvert the intended discretionary access
    controls for a domain, usually with the intention of escalating privileges on the domain. Group
    policy allows for centralized management of user and computer settings in Active Directory (AD).
    ATT&CK analytic: Adversary modifies GPO containers or files under SYSVOL using LDAP, ADSI,
    PowerShell (e.g., New-GPOImmediateTask) or GUI tools. This includes directory object changes
    (e.g., gPCFileSysPath), delegation assignments (SeEnableDelegationPrivilege), and SYSVOL file
    writes (ScheduledTasks.xml, GptTmpl.inf).
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
