title: Potential Access Token Manipulation Activity Via Windows Security
id: 24f4c246-f351-5403-9a1e-193766e6cfb6
status: experimental
description: |
    Draft detection for T1134 (Access Token Manipulation), derived from ATT&CK detection strategy
    DET0283 / analytic AN0786.
    Adversaries may modify access tokens to operate under a different user or system security
    context to perform actions and bypass access controls. Windows uses access tokens to determine
    the ownership of a running process.
    ATT&CK analytic: Detection of suspicious token manipulation chains: use of token-related APIs
    (e.g., LogonUser, DuplicateTokenEx) or commands (runas) → spawning of a new process under a
    different security context (e.g., SYSTEM) → mismatched parent-child process lineage or anomalies
    in Event Tracing for Windows (ETW) token/PPID data → abnormal lateral or privilege escalation
    activity.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
