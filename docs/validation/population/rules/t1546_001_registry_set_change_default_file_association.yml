description: |
    Draft detection for T1546.001 (Change Default File Association), derived from ATT&CK detection
    strategy DET0061 / analytic AN0170.
    Adversaries may establish persistence by executing malicious content triggered by a file type
    association. When a file is opened, the default program used to open the file (also called the
    file association or handler) is checked.
    ATT&CK analytic: Detects modification of registry keys used for default file handlers, followed
    by anomalous process execution from user-initiated file opens. This includes tracking changes
    under HKCU and HKCR for file extension mappings, and correlating them with new or suspicious
    handler paths launching unusual child processes (e.g., PowerShell, cmd, wscript).
