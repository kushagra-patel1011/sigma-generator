status: experimental
description: |
    Draft detection for T1098.002 (Additional Email Delegate Permissions), derived from ATT&CK
    detection strategy DET0373 / analytic AN1052.
    Adversaries may grant additional permission levels to maintain persistent access to an
    adversary-controlled email account. For example, the Add-MailboxPermission PowerShell cmdlet,
    available in on-premises Exchange and in the cloud-based service Office 365, adds permissions to
    a mailbox.
    ATT&CK analytic: Execution of PowerShell commands that modify mailbox permissions using Exchange
    cmdlets (e.g., Add-MailboxPermission), often tied to BEC or post-compromise persistence.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
