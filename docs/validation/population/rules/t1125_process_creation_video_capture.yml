description: |
    Draft detection for T1125 (Video Capture), derived from ATT&CK detection strategy DET0197 /
    analytic AN0568.
    An adversary can leverage a computer's peripheral devices (e.g., integrated cameras or webcams)
    or applications (e.g., video call services) to capture video recordings for the purpose of
    gathering information. Images may also be captured from devices or applications, potentially in
