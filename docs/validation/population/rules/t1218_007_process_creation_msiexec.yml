status: experimental
description: |
    Draft detection for T1218.007 (Msiexec), derived from ATT&CK detection strategy DET0158 /
    analytic AN0445.
    Adversaries may abuse msiexec.exe to proxy execution of malicious payloads. Msiexec.exe is the
    command-line utility for the Windows Installer and is thus commonly associated with executing
    installation packages (.msi).
    ATT&CK analytic: Detection of msiexec.exe execution where command-line arguments reference
    remote MSI packages, UNC paths, HTTP/HTTPS URLs, or DLLs, correlated with subsequent module
    loads and/or network connections to previously unseen destinations. The behavioral chain links
    process creation of msiexec.exe with suspicious parameters, network activity to retrieve
    payloads, and module loading...
