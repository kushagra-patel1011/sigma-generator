description: |
    Draft detection for T1546.007 (Netsh Helper DLL), derived from ATT&CK detection strategy DET0575
    / analytic AN1588.
    Adversaries may establish persistence by executing malicious content triggered by Netsh Helper
    DLLs. Netsh.exe (also referred to as Netshell) is a command-line scripting utility used to
    interact with the network configuration of a system.
    ATT&CK analytic: Detection focuses on monitoring registry modifications under
    HKLM\SOFTWARE\Microsoft\Netsh that indicate the addition of helper DLLs, followed by anomalous
