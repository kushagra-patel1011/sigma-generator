status: experimental
description: |
    Draft detection for T1553.005 (Mark-of-the-Web Bypass), derived from ATT&CK detection strategy
    DET0257 / analytic AN0712.
    Adversaries may abuse specific file formats to subvert Mark-of-the-Web (MOTW) controls. In
    Windows, when files are downloaded from the Internet, they are tagged with a hidden NTFS
    Alternate Data Stream (ADS) named Zone.Identifier with a specific value known as the MOTW.
    ATT&CK analytic: Detects extraction or mounting of container/archive files (e.g., .iso, .vhd,
    .zip) that originated from the Internet but whose contained files lack Zone.Identifier MOTW
    tagging. Correlates file creation metadata with subsequent execution of unsigned or untrusted
    binaries launched outside SmartScreen or Protected View.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
