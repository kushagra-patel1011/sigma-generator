description: |
    Draft detection for T1219.001 (IDE Tunneling), derived from ATT&CK detection strategy DET0133 /
    analytic AN0375.
    Adversaries may abuse Integrated Development Environment (IDE) software with remote development
    features to establish an interactive command and control channel on target systems within a
    network. IDE tunneling combines SSH, port forwarding, file sharing, and debugging into a single
    secure connection, letting developers work on remote systems as if they were local. Unlike
    SSH...
    ATT&CK analytic: Detection of the creation of VSCode or JetBrains CLI tunneling profiles
