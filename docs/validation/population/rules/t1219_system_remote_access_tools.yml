title: Potential Remote Access Tools Activity Via Windows System
id: 597a76d7-92ef-5e75-838a-c4a1b23d7bb0
status: experimental
description: |
    Draft detection for T1219 (Remote Access Tools), derived from ATT&CK detection strategy DET0496
    / analytic AN1366.
    An adversary may use legitimate remote access tools to establish an interactive command and
    control channel within a network. Remote access tools create a session between two trusted hosts
    through a graphical interface, a command line interaction, a protocol tunnel via development or
    management software, or hardware-level access such as KVM (Keyboard, Video, Mouse) over IP...
    ATT&CK analytic: Chain of remote access tool behavior: (1) initial execution of remote-
    control/assist agent or GUI under user context; (2) persistence via service or autorun; (3)
    long-lived outbound connection/tunnel to external infrastructure; (4) interactive control
    signals such as shell or file-manager child processes spawned by the RAT parent.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
