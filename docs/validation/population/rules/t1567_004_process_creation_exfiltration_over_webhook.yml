title: Potential Exfiltration Over Webhook Activity Via Process Creation
id: 24598a62-acd3-5107-9a7f-2a4d6b47e337
status: experimental
description: |
    Draft detection for T1567.004 (Exfiltration Over Webhook), derived from ATT&CK detection
    strategy DET0153 / analytic AN0436.
    Adversaries may exfiltrate data to a webhook endpoint rather than over their primary command and
    control channel. Webhooks are simple mechanisms for allowing a server to push data over HTTP/S
    to a client without the need for the client to continuously poll the server.
    ATT&CK analytic: Unusual processes (e.g., powershell.exe, wscript.exe, mshta.exe) posting data
    to webhook endpoints (Discord, Slack, webhook.site) using HTTP POST/PUT requests. Defender
    perspective: suspicious process lineage followed by outbound HTTPS traffic to webhook domains.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
