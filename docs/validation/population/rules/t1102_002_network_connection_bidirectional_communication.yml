status: experimental
description: |
    Draft detection for T1102.002 (Bidirectional Communication), derived from ATT&CK detection
    strategy DET0035 / analytic AN0100.
    Adversaries may use an existing, legitimate external Web service as a means for sending commands
    to and receiving output from a compromised system over the Web service channel. Compromised
    systems may leverage popular websites and social media to host command and control (C2)
    instructions.
    ATT&CK analytic: Suspicious processes initiating encrypted HTTPS connections to common web
    service domains, followed by abnormal data upload behavior or automated posting behavior
    indicative of C2 bidirectional traffic.
