    - 'Environment-specific tuning of TimeWindow: Correlation window between the discovery process start and SMB fan-out (default 10m).'
    - 'Environment-specific tuning of AllowedDiscoveryAccounts: Service/admin accounts legitimately running inventory scripts.'
    - Unknown
level: low
