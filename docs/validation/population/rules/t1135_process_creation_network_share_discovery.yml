title: Potential Network Share Discovery Activity Via Process Creation
id: 248a82a4-450d-5153-94bc-6e25deea3fb5
status: experimental
description: |
    Draft detection for T1135 (Network Share Discovery), derived from ATT&CK detection strategy
    DET0182 / analytic AN0513.
    Adversaries may look for folders and drives shared on remote systems as a means of identifying
    sources of information to gather as a precursor for Collection and to identify potential systems
    of interest for Lateral Movement. Networks often contain shared network drives and folders that
    enable users to access file directories on various systems across a network.
    ATT&CK analytic: Process or script enumerates network shares via CLI (net view/net share,
    PowerShell Get-SmbShare/WMI) or OS APIs (NetShareEnum/ srvsvc.NetShareEnumAll RPC) → bursts of
    outbound SMB/RPC connections (445/139, \\host\IPC$ / srvsvc) to many hosts inside a short window
    → optional follow-on file listing or copy operations.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1135
    - https://attack.mitre.org/detectionstrategies/DET0182
    - https://attack.mitre.org/detectionstrategies/DET0182#AN0513
    - https://technet.microsoft.com/library/cc770880.aspx
    - https://en.wikipedia.org/wiki/Shared_resource
author: sigma-generator
date: 2026-09-24
tags:
