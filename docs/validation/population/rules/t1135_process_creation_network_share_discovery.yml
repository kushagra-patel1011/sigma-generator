logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\net.exe'
            - '\powershell.exe'
    selection_indicator_content:
        CommandLine|contains:
            - '\\host\IPC'
            - Get-SmbShare
    condition: selection_image and selection_indicator_content
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
falsepositives:
