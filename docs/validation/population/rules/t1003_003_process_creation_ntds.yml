title: Potential NTDS Activity Via Process Creation
id: 89e53a51-ed89-5964-9096-1bc0624313bc
status: experimental
description: |
    Draft detection for T1003.003 (NTDS), derived from ATT&CK detection strategy DET0586 / analytic
    AN1611.
    Adversaries may attempt to access or create a copy of the Active Directory domain database in
    order to steal credential information, as well as obtain other information about domain members
    such as devices, users, and access rights. By default, the NTDS file (NTDS.dit) is located in
    %SystemRoot%\NTDS\Ntds.dit of a domain controller.
    ATT&CK analytic: Detects credential dumping attempts targeting the NTDS.dit database by
    monitoring shadow copy creation, suspicious file access to %SystemRoot%\NTDS\ntds.dit, and the
    use of tooling like ntdsutil.exe or volume management APIs.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
