title: Potential Template Injection Activity Via Process Creation
id: 1c016b58-8c1d-584c-8baa-ea4e34ba777d
status: experimental
description: |
    Draft detection for T1221 (Template Injection), derived from ATT&CK detection strategy DET0566 /
    analytic AN1564.
    Adversaries may create or modify references in user document templates to conceal malicious code
    or force authentication attempts. For example, Microsoft’s Office Open XML (OOXML) specification
    defines an XML-based format for Office documents (.docx, xlsx, .pptx) to replace older binary
    formats (.doc, .xls, .ppt).
    ATT&CK analytic: Detection of Office or document viewer processes (e.g., winword.exe) initiating
    network connections to remote templates or executing scripts due to manipulated template
    references (e.g., embedded in .docx, .rtf, or .dotm files), followed by suspicious child process
    creation (e.g., PowerShell).
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
