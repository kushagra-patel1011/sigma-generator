title: Potential Application Layer Protocol Activity Via Network Connection
id: cb2a5105-4453-510a-bcdb-4ca60c5c4d4c
status: experimental
description: |
    Draft detection for T1071 (Application Layer Protocol), derived from ATT&CK detection strategy
    DET0444 / analytic AN1225.
    Adversaries may communicate using OSI application layer protocols to avoid detection/network
    filtering by blending in with existing traffic. Commands to the remote system, and often the
    results of those commands, will be embedded within the protocol traffic between the client and
    server.
    ATT&CK analytic: Detects suspicious usage of common application-layer protocols (e.g., HTTP,
    HTTPS, DNS, SMB) by abnormal processes, with high outbound byte counts or irregular ports,
    possibly indicating command and control or data exfiltration.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
