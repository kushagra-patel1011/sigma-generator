    Draft detection for T1027.001 (Binary Padding), derived from ATT&CK detection strategy DET0553 /
    analytic AN1528.
    Adversaries may use binary padding to add junk data and change the on-disk representation of
    malware. This can be done without affecting the functionality or behavior of a binary, but can
    increase the size of the binary beyond what some security tools are capable of handling due to
    file size limitations.
    ATT&CK analytic: Detects the creation or execution of padded binary files (e.g., large size but
