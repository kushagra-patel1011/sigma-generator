title: Potential Web Service Activity Via Network Connection
id: 7b216aaa-13f2-5241-adf4-3f173417da70
status: experimental
description: |
    Draft detection for T1102 (Web Service), derived from ATT&CK detection strategy DET0425 /
    analytic AN1189.
    Adversaries may use an existing, legitimate external Web service as a means for relaying data
    to/from a compromised system. Popular websites, cloud services, and social media acting as a
    mechanism for C2 may give a significant amount of cover due to the likelihood that hosts within
    a network are already communicating with them prior to a compromise.
    ATT&CK analytic: Detects unusual outbound connections to web services from uncommon processes
    using SSL/TLS, particularly those exhibiting high outbound data volume or persistence.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
