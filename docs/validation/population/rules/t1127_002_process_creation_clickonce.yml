title: Potential ClickOnce Activity Via Process Creation
id: 5655dc55-9097-55f3-b0f8-f16a0d71d55b
status: experimental
description: |
    Draft detection for T1127.002 (ClickOnce), derived from ATT&CK detection strategy DET0191 /
    analytic AN0550.
    Adversaries may use ClickOnce applications (.appref-ms and .application files) to proxy
    execution of code through a trusted Windows utility. ClickOnce is a deployment that enables a
    user to create self-updating Windows-based .NET applications (i.e, .XBAP, .EXE, or .DLL) that
    install and run from a file share or web page with minimal user interaction.
    ATT&CK analytic: Abuse of ClickOnce applications where rundll32.exe invokes dfshim.dll with
    ShOpenVerbApplication or dfsvc.exe spawns unexpected child processes or loads unsigned modules.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
