title: Potential Invisible Unicode Activity Via Network Connection
id: afae1f1a-fa1d-5bb4-961a-52b9c1045b92
status: experimental
description: |
    Draft detection for T1027.018 (Invisible Unicode), derived from ATT&CK detection strategy
    DET0920 / analytic AN2063.
    Adversaries may abuse invisible or non-printing Unicode characters to conceal malicious content
    within files, scripts, or text. By inserting characters that do not visibly render, adversaries
    may hide data, alter how content is interpreted, or make malicious code appear as benign text or
    whitespace.
    ATT&CK analytic: Detection identifies execution of scripts or files that appear visually benign
    (low printable character ratio) but result in runtime decoding, dynamic evaluation, and
    subsequent process or network activity. Correlation links script execution with abnormal Unicode
    density and follow-on behavior such as child process creation or outbound connections.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
