title: Potential Exfiltration Over Alternative Protocol Activity Via Network Connection
id: 0a448296-9c7e-5665-88da-8407b50ef626
status: experimental
description: |
    Draft detection for T1048 (Exfiltration Over Alternative Protocol), derived from ATT&CK
    detection strategy DET0131 / analytic AN0367.
    Adversaries may steal data by exfiltrating it over a different protocol than that of the
    existing command and control channel. The data may also be sent to an alternate network location
    from the main command and control server.
    ATT&CK analytic: Detects unusual outbound file transfer behavior using protocols like FTP, SMB,
    SMTP, or DNS, involving non-standard processes, off-hour activity, or uncommonly high volume.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
