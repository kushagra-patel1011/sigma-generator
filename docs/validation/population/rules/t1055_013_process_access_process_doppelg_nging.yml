status: experimental
description: |
    Draft detection for T1055.013 (Process Doppelgänging), derived from ATT&CK detection strategy
    DET0544 / analytic AN1501.
    Adversaries may inject malicious code into process via process doppelgänging in order to evade
    process-based defenses as well as possibly elevate privileges. Process doppelgänging is a method
    of executing arbitrary code in the address space of a separate live process.
    ATT&CK analytic: Detects adversary abuse of Transactional NTFS (TxF) and undocumented process
    loading mechanisms (e.g., NtCreateProcessEx) to create a hollowed process from an uncommitted,
    maliciously tainted file image in memory, later executed via NtCreateThreadEx.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
