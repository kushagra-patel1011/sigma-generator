title: Potential Network Provider DLL Activity Via Windows Security
id: b13aafa6-caf7-5922-9965-cb04434fb15d
status: experimental
description: |
    Draft detection for T1556.008 (Network Provider DLL), derived from ATT&CK detection strategy
    DET0580 / analytic AN1598.
    Adversaries may register malicious network provider dynamic link libraries (DLLs) to capture
    cleartext user credentials during the authentication process. Network provider DLLs allow
    Windows to interface with specific network protocols and can also support add-on credential
    management functions.
    ATT&CK analytic: Detects registration of new or modified network provider DLLs via registry
    changes, anomalous file creation of DLLs in system directories, and suspicious process activity
    (mpnotify.exe interacting with non-standard DLLs). Multi-event correlation ties registry
    modification events to subsequent DLL loads during user logon activity.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
