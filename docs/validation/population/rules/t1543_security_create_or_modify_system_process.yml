title: Potential Create or Modify System Process Activity Via Windows Security
id: fe694dfb-f269-521c-84cb-6f80e5b08bbd
status: experimental
description: |
    Draft detection for T1543 (Create or Modify System Process), derived from ATT&CK detection
    strategy DET0571 / analytic AN1575.
    Adversaries may create or modify system-level processes to repeatedly execute malicious payloads
    as part of persistence. When operating systems boot up, they can start processes that perform
    background system functions.
    ATT&CK analytic: Detects command-line or API-based creation/modification of Windows Services via
    `sc.exe`, `powershell.exe`, `services.exe`, or `ChangeServiceConfig`. Looks for
    creation/modification of autostart services via registry changes, file drops to
    `System32\services`, and anomalous parent-child process trees.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
