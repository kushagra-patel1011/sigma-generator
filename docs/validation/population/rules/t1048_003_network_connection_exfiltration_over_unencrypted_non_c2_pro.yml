status: experimental
description: |
    Draft detection for T1048.003 (Exfiltration Over Unencrypted Non-C2 Protocol), derived from
    ATT&CK detection strategy DET0149 / analytic AN0423.
    Adversaries may steal data by exfiltrating it over an un-encrypted network protocol other than
    that of the existing command and control channel. The data may also be sent to an alternate
    network location from the main command and control server.
    ATT&CK analytic: Detects data access or staging events followed by outbound data flows using
    unencrypted protocols (e.g., FTP, HTTP) initiated by unexpected processes or to rare
    destinations.
