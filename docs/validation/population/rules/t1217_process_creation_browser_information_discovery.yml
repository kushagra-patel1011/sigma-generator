title: Potential Browser Information Discovery Activity Via Process Creation
id: 3cedddf3-72e4-58b7-b440-9ad5cd5fbbff
status: experimental
description: |
    Draft detection for T1217 (Browser Information Discovery), derived from ATT&CK detection
    strategy DET0013 / analytic AN0037.
    Adversaries may enumerate information about browsers to learn more about compromised
    environments. Data saved by browsers (such as bookmarks, accounts, and browsing history) may
    reveal a variety of personal information about users (e.g., banking sites,
    relationships/interests, social media, etc.) as well as details about internal network resources
    such as servers...
    ATT&CK analytic: Access to browser artifact locations (e.g., Chrome, Edge, Firefox) by processes
    like PowerShell, cmd.exe, or unknown tools, followed by file reads, decoding, or export
    operations indicating enumeration of bookmarks, autofill, or history databases.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1217
    - https://attack.mitre.org/detectionstrategies/DET0013
    - https://attack.mitre.org/detectionstrategies/DET0013#AN0037
    - https://support.google.com/chrome/a/answer/7349337
    - https://www.kaspersky.com/blog/browser-data-theft/27871/
author: sigma-generator
date: 2026-09-24
tags:
    - attack.discovery
    - attack.t1217
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
    selection_indicator_content:
        CommandLine|contains:
            - '\AppData\Roaming\Google\Chrome\User Data'
            - '\AppData\Roaming\Mozilla\Firefox'
    condition: selection_image and selection_indicator_content
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Legitimate administrative or software-deployment use of cmd.exe, powershell.exe
    - 'Environment-specific tuning of TargetPathRegex: Location of browser data folders like %APPDATA%\Google\Chrome\User Data or %APPDATA%\Mozilla\Firefox'
    - 'Environment-specific tuning of ParentProcess: Used to exclude known browser maintenance or backup processes'
    - 'Environment-specific tuning of ScriptBlockPattern: Used to detect suspicious PowerShell commands targeting browser data'
    - Unknown
level: informational
