title: Potential Authentication Package Activity Via Windows Security
id: 4acd5840-b84a-5d34-a60d-0e8bdebcb386
status: experimental
description: |
    Draft detection for T1547.002 (Authentication Package), derived from ATT&CK detection strategy
    DET0207 / analytic AN0583.
    Adversaries may abuse authentication packages to execute DLLs when the system boots. Windows
    authentication package DLLs are loaded by the Local Security Authority (LSA) process at system
    start.
    ATT&CK analytic: Registry modification of the LSA Authentication Packages key followed by LSASS
    loading a non-standard or unsigned DLL. This includes unusual write access to
    `HKLM\SYSTEM\CurrentControlSet\Control\Lsa`, especially during non-installation timeframes.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
