title: Potential Clear Windows Event Logs Activity Via Process Creation
id: ea8cb31c-b9f9-50ef-9c9f-e0b4617367c2
status: experimental
description: |
    Draft detection for T1685.005 (Clear Windows Event Logs), derived from ATT&CK detection strategy
    DET0532 / analytic AN1472.
    Adversaries may clear Windows Event Logs to hide the activity of an intrusion. Windows Event
