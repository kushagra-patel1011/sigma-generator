title: Potential User Execution Activity Via File Creation
id: e86af943-a367-5a41-9d6c-f8f13df85c5c
status: experimental
description: |
    Draft detection for T1204 (User Execution), derived from ATT&CK detection strategy DET0478 /
    analytic AN1314.
    An adversary may rely upon specific actions by a user in order to gain execution. Users may be
    subjected to social engineering to get them to execute malicious code by, for example, opening a
    malicious document file or link.
    ATT&CK analytic: Cause→effect chain: (1) User-facing app (Office/PDF/archiver/browser) records
    an open/click or abnormal event, then (2) a downloaded file is created in a user-writable path
    and/or decompressed, (3) the parent user app spawns a living-off-the-land binary (e.g.,
    powershell/cmd/mshta/rundll32/msiexec/wscript/expand/zip) or installer, and (4) immediate
    outbound HTTP(S)/DNS/SMB...
