title: Potential AppDomainManager Activity Via Process Creation
id: 6ea24fd9-6250-5524-9188-b51d00db6067
status: experimental
description: |
    Draft detection for T1574.014 (AppDomainManager), derived from ATT&CK detection strategy DET0517
    / analytic AN1433.
    Adversaries may execute their own malicious payloads by hijacking how the .NET
    `AppDomainManager` loads assemblies. The .NET framework uses the `AppDomainManager` class to
    create and manage one or more isolated runtime environments (called application domains) inside
    a process to host the execution of .NET applications.
    ATT&CK analytic: Detection focuses on unauthorized manipulation of .NET AppDomainManager
    behavior. Defenders may observe suspicious creation of new AppDomains within trusted processes,
    anomalous loading of assemblies via non-standard configuration files, or registry/environment
    variable changes redirecting AppDomainManager to malicious assemblies.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
