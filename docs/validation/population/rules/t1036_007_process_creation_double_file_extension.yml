title: Potential Double File Extension Activity Via Process Creation
id: eadd5036-6dd3-5ddc-87f3-96281e28c901
status: experimental
description: |
    Draft detection for T1036.007 (Double File Extension), derived from ATT&CK detection strategy
    DET0366 / analytic AN1033.
    Adversaries may abuse a double extension in the filename as a means of masquerading the true
    file type. A file name may include a secondary file type extension that may cause only the first
    extension to be displayed (ex: File.txt.exe may render in some views as just File.txt).
    ATT&CK analytic: Detects adversary behavior where a file with a benign-looking first extension
    (e.g., .txt, .jpg) ends with a dangerous second extension (e.g., .exe, .scr), and is
    subsequently executed. The behavior chain includes file creation with misleading naming and user
    or system-initiated process execution from the disguised file.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
