description: |
    Draft detection for T1546.009 (AppCert DLLs), derived from ATT&CK detection strategy DET0362 /
    analytic AN1029.
    Adversaries may establish persistence and/or elevate privileges by executing malicious content
    triggered by AppCert DLLs loaded into processes. Dynamic-link libraries (DLLs) that are
    specified in the AppCertDLLs Registry key under
    HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Session Manager\ are loaded into every
    process that calls the ubiquitously used application...
    ATT&CK analytic: Detection of AppCert DLL abuse involves correlating registry modifications to
    the AppCertDLLs key with subsequent unexpected DLL load behavior during process creation events.
    Specifically, defenders can observe abnormal DLLs being loaded into standard Windows processes
    after changes to the 'AppCertDLLs' registry value.
