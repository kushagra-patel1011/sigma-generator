status: experimental
description: |
    Draft detection for T1491.001 (Internal Defacement), derived from ATT&CK detection strategy
    DET0082 / analytic AN0229.
    An adversary may deface systems internal to an organization in an attempt to intimidate or
    mislead users, thus discrediting the integrity of the systems. This may take the form of
    modifications to internal websites or server login messages, or directly to user systems with
    the replacement of the desktop wallpaper.
    ATT&CK analytic: Adversary modifies internal UI messages (e.g., login banners, desktop
    wallpapers) or hosted intranet web pages by creating or altering content files using scripts or
    unauthorized access. Often preceded by privilege escalation or web shell deployment.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
