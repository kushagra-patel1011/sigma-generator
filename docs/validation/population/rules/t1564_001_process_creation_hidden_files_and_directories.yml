status: experimental
description: |
    Draft detection for T1564.001 (Hidden Files and Directories), derived from ATT&CK detection
    strategy DET0032 / analytic AN0091.
    Adversaries may set files and directories to be hidden to evade detection mechanisms. To prevent
    normal users from accidentally changing special files on a system, most operating systems have
    the concept of a ‘hidden’ file.
    ATT&CK analytic: Suspicious use of attrib.exe or PowerShell commands to set hidden attributes on
    files/directories. Defender view: processes modifying file attributes to 'hidden' or creating
    files with ADS (alternate data streams).
