description: |
    Draft detection for T1056.002 (GUI Input Capture), derived from ATT&CK detection strategy
    DET0521 / analytic AN1440.
    Adversaries may mimic common operating system GUI components to prompt users for credentials
    with a seemingly legitimate prompt. When programs are executed that need additional privileges
    than are present in the current user context, it is common for the operating system to prompt
    the user for proper credentials to authorize the elevated privileges for the task (ex: Bypass...
    ATT&CK analytic: Detects suspicious use of PowerShell, .NET, or script interpreters to spawn
    processes that mimic UAC prompts, often with credential capture dialogue boxes invoked from non-
    standard parent processes.
