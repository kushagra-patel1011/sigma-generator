title: Potential Electron Applications Activity Via Process Creation
id: 4a7ee418-3e36-52b6-b8a6-3cd8dfd76021
status: experimental
description: |
    Draft detection for T1218.015 (Electron Applications), derived from ATT&CK detection strategy
    DET0025 / analytic AN0071.
    Adversaries may abuse components of the Electron framework to execute malicious code. The
    Electron framework hosts many common applications such as Signal, Slack, and Microsoft Teams.
    ATT&CK analytic: Abuse of trusted Electron apps (Teams, Slack, Chrome) to spawn child processes
    or execute payloads via malicious command-line arguments (e.g., --gpu-launcher) and modified app
    resources (.asar). Behavior chain: suspicious parent process (Electron app) → unusual command-
    line args → child process creation → optional DLL/network artifacts.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1218/015
    - https://attack.mitre.org/detectionstrategies/DET0025
