detection:
    selection_image:
        Image|endswith:
            - '\calc.exe'
            - '\chrome.exe'
            - '\crashpad_handler.exe'
            - '\teams.exe'
    selection_indicator_content:
        CommandLine|contains:
            - --disable-gpu-sandbox
            - --gpu-launcher
            - ':\Windows\system32\cmd.exe'
            - node.js
    condition: selection_image and selection_indicator_content
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
falsepositives:
