status: experimental
description: |
    Draft detection for T1220 (XSL Script Processing), derived from ATT&CK detection strategy
    DET0205 / analytic AN0581.
    Adversaries may bypass application control and obscure execution of code by embedding scripts
    inside XSL files. Extensible Stylesheet Language (XSL) files are commonly used to describe the
    processing and rendering of data within XML files.
    ATT&CK analytic: Execution of XSL scripts via msxsl.exe or wmic.exe using embedded JScript or
    VBScript for proxy execution. Detection correlates process creation, command-line patterns, and
    module load behavior of scripting components (e.g., jscript.dll).
