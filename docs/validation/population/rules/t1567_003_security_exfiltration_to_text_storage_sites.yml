description: |
    Draft detection for T1567.003 (Exfiltration to Text Storage Sites), derived from ATT&CK
    detection strategy DET0284 / analytic AN0787.
    Adversaries may exfiltrate data to text storage sites instead of their primary command and
    control channel. Text storage sites, such as pastebin[.]com, are commonly used by developers to
    share code and other information.
    ATT&CK analytic: Unexpected processes (e.g., powershell.exe, wscript.exe, office apps)
    initiating HTTP POST/PUT requests to text storage domains like pastebin.com or hastebin.com,
    particularly when preceded by file access in sensitive directories. Defender perspective:
    correlation of process lineage, large clipboard/file read operations, and outbound uploads to
    text storage services.
