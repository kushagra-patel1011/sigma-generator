title: Potential Protocol Tunneling Activity Via Network Connection
id: 1341ecc9-d218-59ab-9041-e99cc682ac0c
status: experimental
description: |
    Draft detection for T1572 (Protocol Tunneling), derived from ATT&CK detection strategy DET0538 /
    analytic AN1483.
    Adversaries may tunnel network communications to and from a victim system within a separate
    protocol to avoid detection/network filtering and/or enable access to otherwise unreachable
    systems. Tunneling involves explicitly encapsulating a protocol within another.
    ATT&CK analytic: Processes such as plink.exe, ssh.exe, or netsh.exe establishing outbound
    network connections where traffic patterns show encapsulated protocols (e.g., RDP over SSH).
    Defender observations include anomalous process-to-network relationships, large asymmetric data
    flows, and port usage mismatches.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
