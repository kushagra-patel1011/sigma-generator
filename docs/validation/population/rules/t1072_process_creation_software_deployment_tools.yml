title: Potential Software Deployment Tools Activity Via Process Creation
id: 225ff396-f351-5178-9600-c7297804fb91
status: experimental
description: |
    Draft detection for T1072 (Software Deployment Tools), derived from ATT&CK detection strategy
    DET0223 / analytic AN0623.
    Adversaries may gain access to and use centralized software suites installed within an
    enterprise to execute commands and move laterally through the network. Configuration management
    and software deployment applications may be used in an enterprise network or cloud environment
    for routine administration purposes.
    ATT&CK analytic: Detects SCCM, Intune, or remote push execution spawning scripts or binaries
    from SYSTEM context or unusual consoles (e.g., cmtrace.exe launching PowerShell or cmd.exe).
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
