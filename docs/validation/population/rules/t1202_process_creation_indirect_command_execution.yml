title: Potential Indirect Command Execution Activity Via Process Creation
id: f50dbfbd-54a7-5ea8-9203-d14614702d13
status: experimental
description: |
    Draft detection for T1202 (Indirect Command Execution), derived from ATT&CK detection strategy
    DET0200 / analytic AN0576.
    Adversaries may abuse utilities that allow for command execution to bypass security restrictions
    that limit the use of command-line interpreters. Various Windows utilities may be used to
    execute commands, possibly without invoking cmd.
    ATT&CK analytic: Cause→effect chain: (1) A user or service launches an indirection utility
    (e.g., forfiles.exe, pcalua.exe, wsl.exe, scriptrunner.exe, ssh.exe with -o
    ProxyCommand/LocalCommand). (2) That utility spawns a secondary program/command (PowerShell,
    cmd, msiexec, regsvr32, curl, arbitrary EXE) and/or opens outbound network connections.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
