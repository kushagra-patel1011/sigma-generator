title: Potential Services Registry Permissions Weakness Activity Via Windows Security
id: ecf75ac4-0718-551e-8cd8-206d906da026
status: experimental
description: |
    Draft detection for T1574.011 (Services Registry Permissions Weakness), derived from ATT&CK
    detection strategy DET0427 / analytic AN1195.
    Adversaries may execute their own malicious payloads by hijacking the Registry entries used by
    services. Flaws in the permissions for Registry keys related to services can allow adversaries
    to redirect the originally specified executable to one they control, launching their own code
    when a service starts.
    ATT&CK analytic: Unauthorized modification of service-related registry keys such as ImagePath,
    FailureCommand, ServiceDll, or Performance/Parameters keys. Defender correlates registry
    modifications, anomalous service metadata changes, and subsequent service process executions
    that deviate from baseline configurations.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
