description: |
    Draft detection for T1567.002 (Exfiltration to Cloud Storage), derived from ATT&CK detection
    strategy DET0570 / analytic AN1571.
    Adversaries may exfiltrate data to a cloud storage service rather than over their primary
    command and control channel. Cloud storage services allow for the storage, edit, and retrieval
    of data from a remote cloud storage server over the Internet.
    ATT&CK analytic: Unusual processes (e.g., powershell.exe, excel.exe) accessing large local files
    and subsequently initiating HTTPS POST requests to domains associated with cloud storage
    services (e.g., dropbox.com, drive.google.com, box.com). Defender perspective: correlation
    between file reads in sensitive directories and high outbound traffic volume to known storage
    APIs.
