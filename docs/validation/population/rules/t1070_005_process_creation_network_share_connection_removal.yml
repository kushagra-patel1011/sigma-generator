title: Potential Network Share Connection Removal Activity Via Process Creation
id: f6efb403-d443-5927-98d7-c73d5fbfa767
status: experimental
description: |
    Draft detection for T1070.005 (Network Share Connection Removal), derived from ATT&CK detection
    strategy DET0103 / analytic AN0286.
    Adversaries may remove share connections that are no longer useful in order to clean up traces
    of their operation. Windows shared drive and SMB/Windows Admin Shares connections can be removed
    when no longer needed.
    ATT&CK analytic: Detects network share disconnection attempts using command-line tools like `net
    use /delete`, PowerShell `Remove-SmbMapping`, and correlation with process lineage and SMB
    session teardown activity.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1070/005
    - https://attack.mitre.org/detectionstrategies/DET0103
    - https://attack.mitre.org/detectionstrategies/DET0103#AN0286
