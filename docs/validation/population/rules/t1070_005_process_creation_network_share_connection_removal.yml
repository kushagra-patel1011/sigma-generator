detection:
    selection_image:
        Image|endswith:
            - '\net.exe'
            - '\powershell.exe'
    selection_indicator_content:
        CommandLine|contains:
            - '\\host\share'
            - '\\system\share'
            - Remove-SmbMapping
    condition: selection_image and selection_indicator_content
