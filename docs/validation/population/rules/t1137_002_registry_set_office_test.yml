title: Potential Office Test Activity Via Registry Modification
id: 7cbd83d7-a88f-5b3c-92c6-0f59243c3994
status: experimental
description: |
    Draft detection for T1137.002 (Office Test), derived from ATT&CK detection strategy DET0315 /
    analytic AN0880.
    Adversaries may abuse the Microsoft Office "Office Test" Registry key to obtain persistence on a
    compromised system. An Office Test Registry location exists that allows a user to specify an
    arbitrary DLL that will be executed every time an Office application is started.
    ATT&CK analytic: Adversaries create the 'Office Test\Special\Perf' registry key and specify a
    malicious DLL path that is auto-loaded when an Office application starts. This DLL is injected
    into the Office process memory space and can provide persistent execution without requiring
    macro enablement.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
