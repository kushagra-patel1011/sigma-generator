description: |
    Draft detection for T1041 (Exfiltration Over C2 Channel), derived from ATT&CK detection strategy
    DET0348 / analytic AN0988.
    Adversaries may steal data by exfiltrating it over an existing command and control channel.
    Stolen data is encoded into the normal communications channel using the same protocol as command
    and control communications.
    ATT&CK analytic: Identifies suspicious outbound traffic volume mismatches from processes that
    typically do not generate network activity, particularly over C2 protocols like HTTPS, DNS, or
