title: Potential KernelCallbackTable Activity Via Process Creation
id: 180769a7-7ccb-5818-9bfb-1f597fcaf91f
status: experimental
description: |
    Draft detection for T1574.013 (KernelCallbackTable), derived from ATT&CK detection strategy
    DET0577 / analytic AN1593.
    Adversaries may abuse the KernelCallbackTable of a process to hijack its execution flow in order
    to run their own payloads. The KernelCallbackTable can be found in the Process Environment Block
    (PEB) and is initialized to an array of graphic functions available to a GUI process once
    user32.dll is loaded.
    ATT&CK analytic: Unexpected modification of the KernelCallbackTable in a process’s PEB followed
    by invocation of modified callback functions (e.g., fnCOPYDATA) through Windows messages.
    Defender observes suspicious API call chains such as NtQueryInformationProcess →
    WriteProcessMemory → abnormal GUI callback execution, often correlating to anomalous process
    behavior such as network activity or...
