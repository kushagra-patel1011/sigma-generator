title: Potential Backup Software Discovery Activity Via Process Creation
id: 74da1b08-44c3-57ee-bb62-32554d0987b7
status: experimental
description: |
    Draft detection for T1518.002 (Backup Software Discovery), derived from ATT&CK detection
    strategy DET0088 / analytic AN0240.
    Adversaries may attempt to get a listing of backup software or configurations that are installed
    on a system. Adversaries may use this information to shape follow-on behaviors, such as Data
    Destruction, Inhibit System Recovery, or Data Encrypted for Impact.
    ATT&CK analytic: Defender observes execution of commands like `tasklist`, `sc query`, `reg
    query`, or PowerShell WMI/Registry queries targeting known backup products (e.g., Veeam,
    Acronis, CrashPlan). Behavior often includes parent-child lineage involving PowerShell or
    cmd.exe with discovery syntax, and enumeration of services, directories, or registry paths tied
    to backup software.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
