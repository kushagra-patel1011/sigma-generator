title: Potential Executable Installer File Permissions Weakness Activity Via File Creation
id: a74e17bb-13e6-51b0-9259-6fa8139ab201
status: experimental
description: |
    Draft detection for T1574.005 (Executable Installer File Permissions Weakness), derived from
    ATT&CK detection strategy DET0038 / analytic AN0108.
    Adversaries may execute their own malicious payloads by hijacking the binaries used by an
    installer. These processes may automatically execute specific binaries as part of their
    functionality or to perform other actions.
    ATT&CK analytic: Executables written or modified in installer directories (e.g., %TEMP%
    subdirectories or Program Files installer paths) followed by execution under elevated context.
    Defender observes abnormal file replacement activity, process creation by installer processes
    pointing to attacker-supplied binaries, and unexpected module loads in elevated processes.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
