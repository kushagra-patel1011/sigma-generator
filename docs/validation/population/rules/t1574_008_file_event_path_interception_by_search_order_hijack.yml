title: Potential Path Interception by Search Order Hijacking Activity Via File Creation
id: 393d409a-e2c1-5475-b5fe-c74afc29c38b
status: experimental
description: |
    Draft detection for T1574.008 (Path Interception by Search Order Hijacking), derived from ATT&CK
    detection strategy DET0564 / analytic AN1560.
    Adversaries may execute their own malicious payloads by hijacking the search order used to load
    other programs. Because some programs do not call other programs using the full path,
    adversaries may place their own file in the directory where the calling program is located,
    causing the operating system to launch their malicious software at the request of the calling
    program.
    ATT&CK analytic: Processes executing binaries named after legitimate system utilities (e.g.,
    net.exe, findstr.exe, python.exe) from non-standard or application-specific directories,
    combined with file creation or modification events for such binaries. Defender correlates file
    writes in vulnerable directories, process execution paths inconsistent with baseline system
    paths, and abnormal...
