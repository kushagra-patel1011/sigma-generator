title: Potential Domain Controller Authentication Activity Via Module Load
id: e50b8d09-f39e-56bd-b73c-89c2294af7d7
status: experimental
description: |
    Draft detection for T1556.001 (Domain Controller Authentication), derived from ATT&CK detection
    strategy DET0271 / analytic AN0757.
    Adversaries may patch the authentication process on a domain controller to bypass the typical
    authentication mechanisms and enable access to accounts. Malware may be used to inject false
    credentials into the authentication process on a domain controller with the intent of creating a
    backdoor used to access any user’s account and/or credentials (ex: Skeleton Key).
    ATT&CK analytic: Detects anomalous process access to LSASS on domain controllers, suspicious
    module loads of authentication DLLs, and registry or file modifications indicative of Skeleton
    Key–style patching. Correlates LSASS access attempts with subsequent abnormal logon activity
    patterns.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
