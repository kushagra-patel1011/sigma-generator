status: experimental
description: |
    Draft detection for T1204.001 (Malicious Link), derived from ATT&CK detection strategy DET0066 /
    analytic AN0178.
    An adversary may rely upon a user clicking a malicious link in order to gain execution. Users
    may be subjected to social engineering to get them to click on a link that will lead to code
    execution.
    ATT&CK analytic: Behavioral chain: (1) a user-facing app (browser/Office/email client) launches
    a URL or handles a link, then (2) the same process lineage makes an outbound connection to an
    untrusted domain/IP, (3) a file is downloaded or unpacked to a user-writable location shortly
    after the click. Optional enrichment: subsequent child execution by LOLBINs.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
