description: |
    Draft detection for T1216 (System Script Proxy Execution), derived from ATT&CK detection
    strategy DET0466 / analytic AN1288.
    Adversaries may use trusted scripts, often signed with certificates, to proxy the execution of
    malicious files. Several Microsoft signed scripts that have been downloaded from Microsoft or
