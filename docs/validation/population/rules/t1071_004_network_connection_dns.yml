title: Potential DNS Activity Via Network Connection
id: 5625a322-cb90-542c-a71f-659369476f43
status: experimental
description: |
    Draft detection for T1071.004 (DNS), derived from ATT&CK detection strategy DET0400 / analytic
    AN1121.
    Adversaries may communicate using the Domain Name System (DNS) application layer protocol to
    avoid detection/network filtering by blending in with existing traffic. Commands to the remote
    system, and often the results of those commands, will be embedded within the protocol traffic
    between the client and server.
    ATT&CK analytic: Detects high-frequency or anomalous DNS queries initiated by non-browser, non-
    system processes (e.g., PowerShell, rundll32, python.exe) used to establish command and control
    via DNS tunneling.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
