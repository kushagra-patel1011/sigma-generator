title: Potential Process Argument Spoofing Activity Via Process Access
id: 346f2863-4bfc-57b5-b670-175bdac3436e
status: experimental
description: |
    Draft detection for T1564.010 (Process Argument Spoofing), derived from ATT&CK detection
    strategy DET0045 / analytic AN0126.
    Adversaries may attempt to hide process command-line arguments by overwriting process memory.
    Process command-line arguments are stored in the process environment block (PEB), a data
    structure used by Windows to store various information about/used by a process.
    ATT&CK analytic: Inconsistencies between process command-line arguments logged at creation time
    and subsequent process behavior. Defender perspective: monitoring for processes launched in a
    suspended state, followed by memory modifications (e.g., WriteProcessMemory targeting the PEB)
    that overwrite arguments before execution resumes.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
