title: Potential Application Window Discovery Activity Via Process Access
id: bebebea5-b4af-5adb-aeb0-53125ff4aec1
status: experimental
description: |
    Draft detection for T1010 (Application Window Discovery), derived from ATT&CK detection strategy
    DET0097 / analytic AN0271.
    Adversaries may attempt to get a listing of open application windows. Window listings could
    convey information about how the system is used.
    ATT&CK analytic: Processes using Win32 API calls (e.g., EnumWindows, GetForegroundWindow) or
    scripting tools (e.g., PowerShell, VBScript) to enumerate open windows. These often appear with
    reconnaissance or data collection TTPs.
