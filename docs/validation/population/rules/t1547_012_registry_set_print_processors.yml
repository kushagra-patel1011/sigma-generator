title: Potential Print Processors Activity Via Registry Modification
id: 6d60a162-99b6-5345-b6e3-2989d6bc9246
status: experimental
description: |
    Draft detection for T1547.012 (Print Processors), derived from ATT&CK detection strategy DET0026
    / analytic AN0074.
    Adversaries may abuse print processors to run malicious DLLs during system boot for persistence
    and/or privilege escalation. Print processors are DLLs that are loaded by the print spooler
    service, `spoolsv.exe`, during boot.
    ATT&CK analytic: Correlated registry modifications under Print Processors path, followed by DLL
    file creation within the system print processor directory, and DLL load by spoolsv.exe.
    Malicious execution often occurs during service restart or system boot, with SYSTEM-level
    privileges.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
