title: Potential Process Injection Activity Via Process Access
id: 60ba3f54-9dd1-5e36-992f-85c8579c1b7e
status: experimental
description: |
    Draft detection for T1055 (Process Injection), derived from ATT&CK detection strategy DET0508 /
    analytic AN1399.
    Adversaries may inject code into processes in order to evade process-based defenses as well as
    possibly elevate privileges. Process injection is a method of executing arbitrary code in the
    address space of a separate live process.
    ATT&CK analytic: Detects process injection by correlating memory manipulation API calls (e.g.,
    VirtualAllocEx, WriteProcessMemory), suspicious thread creation (e.g., CreateRemoteThread), and
    unusual DLL loads within another process's context.
