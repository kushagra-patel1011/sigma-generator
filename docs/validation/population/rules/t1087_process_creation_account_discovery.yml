title: Potential Account Discovery Activity Via Process Creation
id: 3d187413-60ce-515f-9b67-8bf543edfe54
status: experimental
description: |
    Draft detection for T1087 (Account Discovery), derived from ATT&CK detection strategy DET0587 /
    analytic AN1612.
    Adversaries may attempt to get a listing of valid accounts, usernames, or email addresses on a
    system or within a compromised environment. This information can help adversaries determine
    which accounts exist, which can aid in follow-on behavior such as brute-forcing, spear-phishing
    attacks, or account takeovers (e.g., Valid Accounts).
    ATT&CK analytic: Detection of processes performing local or domain account enumeration by
    invoking account directory queries or security APIs followed by structured output of account
    lists. The defender observes command execution or API invocation patterns that retrieve account
    information and produce enumeration artifacts shortly afterward.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
