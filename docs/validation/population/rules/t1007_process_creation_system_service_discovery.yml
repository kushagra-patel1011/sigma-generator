title: Potential System Service Discovery Activity Via Process Creation
id: d5cc4ca4-09c0-56e7-b8e6-4dc5c38cd43d
status: experimental
description: |
    Draft detection for T1007 (System Service Discovery), derived from ATT&CK detection strategy
    DET0483 / analytic AN1325.
    Adversaries may try to gather information about registered local system services. Adversaries
    may obtain information about services using tools as well as OS utility commands such as sc
    query, tasklist /svc, systemctl --type=service, and net start.
    ATT&CK analytic: Enumeration of services via native CLI tools (e.g., `sc query`, `tasklist
    /svc`, `net start`) or API calls via PowerShell and WMI.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
