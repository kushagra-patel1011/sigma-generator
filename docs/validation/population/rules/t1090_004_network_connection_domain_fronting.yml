title: Potential Domain Fronting Activity Via Network Connection
id: ea69d754-680c-5e1f-9b6d-19a39049d367
status: experimental
description: |
    Draft detection for T1090.004 (Domain Fronting), derived from ATT&CK detection strategy DET0196
    / analytic AN0564.
    Adversaries may take advantage of routing schemes in Content Delivery Networks (CDNs) and other
    services which host multiple domains to obfuscate the intended destination of HTTPS traffic or
    traffic tunneled through HTTPS. Domain fronting involves using different domain names in the SNI
    field of the TLS header and the Host field of the HTTP header.
    ATT&CK analytic: Suspicious outbound HTTPS connections where the TLS Server Name Indication
    (SNI) does not match the HTTP Host header, indicating potential use of domain fronting to mask
    C2 traffic via CDNs.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
