id: 74b8cb5c-fc45-51a6-a5a9-f8b40f9e975e
status: experimental
description: |
    Draft detection for T1573.001 (Symmetric Cryptography), derived from ATT&CK detection strategy
    DET0143 / analytic AN0400.
    Adversaries may employ a known symmetric encryption algorithm to conceal command and control
    traffic rather than relying on any inherent protections provided by a communication protocol.
    Symmetric encryption algorithms use the same key for plaintext encryption and ciphertext
