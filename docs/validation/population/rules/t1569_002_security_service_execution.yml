description: |
    Draft detection for T1569.002 (Service Execution), derived from ATT&CK detection strategy
    DET0421 / analytic AN1185.
    Adversaries may abuse the Windows service control manager to execute malicious commands or
    payloads. The Windows service control manager (services.exe) is an interface to manage and
    manipulate services.
    ATT&CK analytic: Detection focuses on abnormal service executions initiated via service control
    manager APIs, sc.exe, net.exe, or PsExec creating temporary services. Defenders observe process
    creation of services.exe spawning non-standard binaries, registry changes in service keys
    followed by rapid execution, and network connections originating from processes tied to
    transient services.
