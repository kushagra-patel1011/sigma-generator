title: Potential Distributed Component Object Model Activity Via Network Connection
id: ab1526a3-9874-50d5-a891-d6eba206f7ef
status: experimental
description: |
    Draft detection for T1021.003 (Distributed Component Object Model), derived from ATT&CK
    detection strategy DET0285 / analytic AN0791.
    Adversaries may use Valid Accounts to interact with remote machines by taking advantage of
    Distributed Component Object Model (DCOM). The adversary may then perform actions as the logged-
    on user.
    ATT&CK analytic: A remote DCOM invocation by a privileged account using RPC (port 135), followed
    by abnormal process instantiation or module loading on the remote system indicative of code
    execution.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
