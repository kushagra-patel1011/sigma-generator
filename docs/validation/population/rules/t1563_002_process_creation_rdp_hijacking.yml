description: |
    Draft detection for T1563.002 (RDP Hijacking), derived from ATT&CK detection strategy DET0588 /
    analytic AN1620.
    Adversaries may hijack a legitimate user’s remote desktop session to move laterally within an
    environment. Remote desktop is a common feature in operating systems.
    ATT&CK analytic: Detection of suspicious use of `tscon.exe` or equivalent methods to hijack
    legitimate RDP sessions. Defenders can observe anomalies such as session reassignments without
    corresponding authentication, processes spawned in the context of hijacked sessions, or unusual
