title: Potential DNS Calculation Activity Via Network Connection
id: b24c516c-9a6d-5323-bb44-9f60d40d0403
status: experimental
description: |
    Draft detection for T1568.003 (DNS Calculation), derived from ATT&CK detection strategy DET0262
    / analytic AN0728.
    Adversaries may perform calculations on addresses returned in DNS results to determine which
    port and IP address to use for command and control, rather than relying on a predetermined port
    number or the actual returned IP address. A IP and/or port number calculation can be used to
    bypass egress filtering on a C2 channel.
    ATT&CK analytic: Monitor DNS query results where subsequent connections use derived or unusual
    port numbers not explicitly resolved, especially when tied to suspicious processes. Correlate
    Sysmon DNS logs (Event ID 22) with process creation and socket activity.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
