description: |
    Draft detection for T1565.003 (Runtime Data Manipulation), derived from ATT&CK detection
    strategy DET0391 / analytic AN1097.
    Adversaries may modify systems in order to manipulate the data as it is accessed and displayed
    to an end user, thus threatening the integrity of the data. By manipulating runtime data,
    adversaries may attempt to affect a business process, organizational understanding, and decision
    making.
    ATT&CK analytic: Monitor for runtime data manipulations by detecting suspicious modification of
    application binaries, API hooking, or unexpected behavior from processes responsible for
    rendering or displaying data. Correlate registry edits, process creation, and unexpected binary
    hash mismatches.
