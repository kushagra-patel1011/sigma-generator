description: |
    Draft detection for T1056.003 (Web Portal Capture), derived from ATT&CK detection strategy
    DET0480 / analytic AN1321.
    Adversaries may install code on externally facing portals, such as a VPN login page, to capture
    and transmit credentials of users who attempt to log into the service. For example, a
    compromised login page may log provided user credentials before logging the user in to the
    service.
    ATT&CK analytic: Detects tampering of IIS-based login pages (e.g., default.aspx, login.aspx)
