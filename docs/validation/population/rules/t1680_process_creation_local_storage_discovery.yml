title: Potential Local Storage Discovery Activity Via Process Creation
id: 6b93048a-5c5b-5a4c-b7f7-4d129cd392b6
status: experimental
description: |
    Draft detection for T1680 (Local Storage Discovery), derived from ATT&CK detection strategy
    DET0188 / analytic AN0536.
    Adversaries may enumerate local drives, disks, and/or volumes and their attributes like total or
    free space and volume serial number. This can be done to prepare for ransomware-related
    encryption, to perform Lateral Movement, or as a precursor to Direct Volume Access.
    ATT&CK analytic: Drive enumeration using PowerShell (`Get-PSDrive`), `wmic logicaldisk`, or
    Win32 API indicative of local volume enumeration by non-admin users or executed outside of
    baseline system inventory scripts.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1680
    - https://attack.mitre.org/detectionstrategies/DET0188
    - https://attack.mitre.org/detectionstrategies/DET0188#AN0536
