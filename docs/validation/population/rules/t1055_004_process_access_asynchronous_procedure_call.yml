title: Potential Asynchronous Procedure Call Activity Via Process Access
id: b629cb5c-207c-5257-b37f-21d40b71df80
status: experimental
description: |
    Draft detection for T1055.004 (Asynchronous Procedure Call), derived from ATT&CK detection
    strategy DET0100 / analytic AN0277.
    Adversaries may inject malicious code into processes via the asynchronous procedure call (APC)
    queue in order to evade process-based defenses as well as possibly elevate privileges. APC
    injection is a method of executing arbitrary code in the address space of a separate live
    process.
    ATT&CK analytic: Detects malicious injection behavior involving memory allocation, remote thread
    queuing via APC (e.g., QueueUserAPC), and altered thread context within another live process to
    execute unauthorized code under legitimate context.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
