status: experimental
description: |
    Draft detection for T1547.010 (Port Monitors), derived from ATT&CK detection strategy DET0204 /
    analytic AN0580.
    Adversaries may use port monitors to run an adversary supplied DLL during system boot for
    persistence or privilege escalation. A port monitor can be set through the AddMonitor API call
    to set a DLL to be loaded at startup.
    ATT&CK analytic: Detects suspicious registry modifications under
    `HKLM\SYSTEM\CurrentControlSet\Control\Print\Monitors\*\Driver`, DLL loads by `spoolsv.exe` of
    non-standard or unsigned modules, and abnormal usage of the `AddMonitor` API by non-installation
    processes. This pattern often indicates an attempt to persist a malicious DLL via the print
    monitor mechanism, particularly when correlated...
