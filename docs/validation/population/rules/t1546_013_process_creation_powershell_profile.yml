title: Potential PowerShell Profile Activity Via Process Creation
id: 4678206d-7102-5185-bd0f-32615d6cd6da
status: experimental
description: |
    Draft detection for T1546.013 (PowerShell Profile), derived from ATT&CK detection strategy
    DET0451 / analytic AN1245.
    Adversaries may gain persistence and elevate privileges by executing malicious content triggered
    by PowerShell profiles. A PowerShell profile (profile.ps1) is a script that runs when PowerShell
    starts and can be used as a logon script to customize user environments.
    ATT&CK analytic: Defenders can identify PowerShell profile-based persistence by correlating file
    creation or modification in known profile locations with subsequent PowerShell process launches
    that do not use the `-NoProfile` flag. Profile scripts loading unusual modules or launching
    external programs, particularly under elevated contexts, are suspicious and may represent
    adversary persistence...
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
