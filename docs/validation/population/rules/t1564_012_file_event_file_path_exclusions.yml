title: Potential File or Path Exclusions Activity Via File Creation
id: 324df78a-7d51-5e78-b3c2-29176f12a32b
status: experimental
description: |
    Draft detection for T1564.012 (File/Path Exclusions), derived from ATT&CK detection strategy
    DET0051 / analytic AN0139.
    Adversaries may attempt to hide their file-based artifacts by writing them to specific folders
    or file names excluded from antivirus (AV) scanning and other defensive capabilities. AV and
    other file-based scanners often include exclusions to optimize performance as well as ease
    installation and legitimate use of applications.
    ATT&CK analytic: Creation or modification of files in directories known to be excluded from AV
    scanning (e.g., C:\Windows\Temp, Exchange server directories, or default AV exclusions).
    Defender perspective: correlate file creation with execution behavior or anomalous parent
    processes writing to excluded paths.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
