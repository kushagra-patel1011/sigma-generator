title: Potential LSASS Memory Attack Chain Via Process Access, Process Creation And Registry Modification
id: 9821941c-37d2-5505-8575-7dae64c277c0
status: experimental
description: |
    Draft correlation for T1003.001 (LSASS Memory). ATT&CK analytic AN1030 (strategy DET0363)
    describes this technique as 3 observable behaviours; this rule fires when all of them occur on
    the same host within 5m.
    Steps: 1) Process Access; 2) Process Creation; 3) Registry Modification.
    ATT&CK analytic: A non-privileged or abnormal process attempts to open a handle with full access
    (0x1F0FFF) to lsass.exe and subsequently invokes memory dump, file creation, or registry
    modification indicative of credential scraping. This behavior chain reflects staged credential
    theft activity.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1003/001
    - https://attack.mitre.org/detectionstrategies/DET0363
    - https://attack.mitre.org/detectionstrategies/DET0363#AN1030
    - https://medium.com/threatpunter/detecting-attempts-to-steal-passwords-from-memory-558f16dce4ea
    - https://www.deepinstinct.com/blog/lsass-memory-dumps-are-stealthier-than-ever-before-part-2
    - http://docplayer.net/20839173-Analysis-of-malicious-security-support-provider-dlls.html
author: sigma-generator
date: 2026-09-24
tags:
    - attack.credential-access
    - attack.t1003
    - attack.t1003.001
correlation:
    type: temporal
    rules:
        - step1_process_access
        - step2_process_creation
        - step3_registry_set
    group-by:
        - Computer
    timespan: 5m
falsepositives:
    - Legitimate administrative or software-deployment use of mimikatz.exe, procdump.exe, rundll32.exe
    - 'Environment-specific tuning of AccessMask: Set to 0x1F0FFF to detect full memory access attempts; can be scoped down to reduce noise.'
    - 'Environment-specific tuning of TimeWindow: Defines time between LSASS access and dump file creation or registry modification (e.g., 5 minutes).'
    - 'Environment-specific tuning of ParentProcessName: Allowlist known legitimate tools (e.g., AV/EDR) accessing lsass.exe.'
    - Unknown
level: critical
---
title: 'LSASS Memory - Step 1: Process Access'
id: b54dfb5b-2e63-554a-b95e-75dc1e41a213
name: step1_process_access
logsource:
    category: process_access
    product: windows
detection:
    selection_target:
        TargetImage|endswith:
            - '\lsass.exe'
    selection_indicator_source:
        SourceImage|endswith:
            - '\mimikatz.exe'
            - '\procdump.exe'
            - '\rundll32.exe'
            - '\werfault.exe'
    selection_indicator_access:
        GrantedAccess:
            - '0x1f0fff'
    condition: selection_target and 1 of selection_indicator_*
---
title: 'LSASS Memory - Step 2: Process Creation'
id: 903978d7-841e-593f-9336-057c3cb185df
name: step2_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_indicator_content:
        CommandLine|contains:
            - comsvcs.dll
            - Invoke-Mimikatz
    condition: selection_indicator_content
---
title: 'LSASS Memory - Step 3: Registry Modification'
id: 0e8970be-c7c1-5814-838e-7ca77ccbd370
name: step3_registry_set
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains:
            - '\SYSTEM\CurrentControlSet\Control\Lsa\Security Packages'
    condition: selection_registry
