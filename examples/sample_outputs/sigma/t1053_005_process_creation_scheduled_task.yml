status: experimental
description: |
    Draft detection for T1053.005 (Scheduled Task), derived from ATT&CK detection strategy DET0441 /
    analytic AN1221.
    Adversaries may abuse the Windows Task Scheduler to perform task scheduling for initial or
    recurring execution of malicious code. There are multiple ways to access the Task Scheduler in
    Windows.
    ATT&CK analytic: Detects the creation, modification, or deletion of scheduled tasks through Task
    Scheduler, WMI, PowerShell, or API-based methods followed by execution from svchost.exe or
    taskeng.exe. Includes detection of hidden or anomalous scheduled tasks, especially those created
    under SYSTEM or suspicious user contexts.
