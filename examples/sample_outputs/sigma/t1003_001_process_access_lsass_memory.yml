title: Potential LSASS Memory Activity Via Process Access
id: a6474e75-2aea-56e7-b098-95a0959555d6
status: experimental
description: |
    Draft detection for T1003.001 (LSASS Memory), derived from ATT&CK detection strategy DET0363 /
    analytic AN1030.
    Adversaries may attempt to access credential material stored in the process memory of the Local
    Security Authority Subsystem Service (LSASS). After a user logs on, the system generates and
    stores a variety of credential materials in LSASS process memory.
    ATT&CK analytic: A non-privileged or abnormal process attempts to open a handle with full access
    (0x1F0FFF) to lsass.exe and subsequently invokes memory dump, file creation, or registry
    modification indicative of credential scraping. This behavior chain reflects staged credential
    theft activity.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
