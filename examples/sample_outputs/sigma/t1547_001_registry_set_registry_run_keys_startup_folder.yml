title: Potential Registry Run Keys or Startup Folder Activity Via Registry Modification
id: fc27d14b-98f4-5a91-b577-9744ab98b7fb
status: experimental
description: |
    Draft detection for T1547.001 (Registry Run Keys / Startup Folder), derived from ATT&CK
    detection strategy DET0365 / analytic AN1032.
    Adversaries may achieve persistence by adding a program to a startup folder or referencing it
    with a Registry run key. Adding an entry to the "run keys" in the Registry or startup folder
    will cause the program referenced to be executed when a user logs in.
    ATT&CK analytic: Correlation of Registry key creation/modification events under known
    Run/Startup keys with new or unusual binary paths or script-based payloads. Multi-event
    detection includes registry modification followed by process execution from non-standard
    directories or abnormal parent-child process relationships.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
