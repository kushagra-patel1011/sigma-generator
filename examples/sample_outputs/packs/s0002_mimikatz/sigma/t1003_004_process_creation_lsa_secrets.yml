status: experimental
description: |
    Draft detection for T1003.004 (LSA Secrets), derived from ATT&CK detection strategy DET0437 /
    analytic AN1212.
    Adversaries with SYSTEM access to a host may attempt to access Local Security Authority (LSA)
    secrets, which can contain a variety of different credential materials, such as credentials for
    service accounts. LSA secrets are stored in the registry at
    HKEY_LOCAL_MACHINE\SECURITY\Policy\Secrets.
    Observed use by Mimikatz (S0002): Mimikatz performs credential dumping to obtain account and
    password information useful in gaining access to additional systems and enterprise network
    resources.
    ATT&CK analytic: Detects adversary activity aimed at accessing LSA Secrets, including registry
    key export of HKEY_LOCAL_MACHINE\SECURITY\Policy\Secrets or memory scraping via tools such as
    Mimikatz or PowerSploit's Invoke-Mimikatz.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
