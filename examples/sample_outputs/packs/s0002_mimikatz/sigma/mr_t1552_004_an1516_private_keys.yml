---
title: 'Private Keys - Step 1: File Creation'
id: 83dabd2b-b8c0-586f-82f6-ec670cbde7f5
name: step1_file_event
logsource:
    category: file_event
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - ':\Users\*\.ssh\'
    condition: selection_path
---
title: 'Private Keys - Step 2: Process Creation'
id: 6f614c4c-a429-56ba-92b7-1df1fb5da43d
name: step2_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\certutil.exe'
            - '\mimikatz.exe'
            - '\ssh.exe'
    condition: selection_image
