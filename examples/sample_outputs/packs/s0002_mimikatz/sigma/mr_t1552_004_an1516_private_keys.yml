title: Potential Private Keys Attack Chain Via File Creation And Process Creation
id: 7f12e33b-05aa-58cc-8855-b7e34bc8f2ab
status: experimental
description: |
    Draft correlation for T1552.004 (Private Keys). ATT&CK analytic AN1516 (strategy DET0549)
    describes this technique as 2 observable behaviours; this rule fires when all of them occur on
    the same host within 10m.
    Steps: 1) File Creation; 2) Process Creation.
    Observed use by Mimikatz (S0002): Mimikatz's CRYPTO::Extract module can extract keys by
    interacting with Windows cryptographic application programming interface (API) functions.
    ATT&CK analytic: A process (non-system or user-initiated) accesses private key files in user
    profile paths or system certificate stores followed by potential network connections or
    compression activity.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
