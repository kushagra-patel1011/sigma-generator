title: Potential Security Support Provider Activity Via Windows Security
id: 318b0c12-39a6-5a65-a809-d45df5bbccf1
status: experimental
description: |
    Draft detection for T1547.005 (Security Support Provider), derived from ATT&CK detection
    strategy DET0542 / analytic AN1495.
    Adversaries may abuse security support providers (SSPs) to execute DLLs when the system boots.
    Windows SSP DLLs are loaded into the Local Security Authority (LSA) process at system start.
    Observed use by Mimikatz (S0002): The Mimikatz credential dumper contains an implementation of
    an SSP.
    ATT&CK analytic: Monitor registry modifications to
    `HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Security Packages` or `...\OSConfig\Security
    Packages`, especially insertions of new DLL entries. Correlate this with subsequent DLL module
    loads into `lsass.exe`.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
