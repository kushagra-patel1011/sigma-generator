title: Potential Windows Credential Manager Activity Via Process Creation
id: 6e5d191f-afc0-53c0-a448-31075a81c987
status: experimental
description: |
    Draft detection for T1555.004 (Windows Credential Manager), derived from ATT&CK detection
    strategy DET0134 / analytic AN0378.
    Adversaries may acquire credentials from the Windows Credential Manager. The Credential Manager
    stores credentials for signing into websites, applications, and/or devices that request
    authentication through NTLM or Kerberos in Credential Lockers (previously known as Windows
    Vaults).
    Observed use by Mimikatz (S0002): Mimikatz contains functionality to acquire credentials from
    the Windows Credential Manager.
    ATT&CK analytic: Detects unauthorized access to Windows Credential Manager through anomalous
    process execution (vaultcmd.exe, rundll32.exe keymgr.dll), suspicious API calls
    (CredEnumerateA), or direct file access to Credential Locker files. Correlates process creation
    with subsequent file reads of .vcrd/.vpol files under user Credential Locker directories.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
