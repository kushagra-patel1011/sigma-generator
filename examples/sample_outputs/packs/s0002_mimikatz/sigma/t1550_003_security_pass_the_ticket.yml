description: |
    Draft detection for T1550.003 (Pass the Ticket), derived from ATT&CK detection strategy DET0352
    / analytic AN1000.
    Adversaries may “pass the ticket” using stolen Kerberos tickets to move laterally within an
    environment, bypassing normal system access controls. Pass the ticket (PtT) is a method of
    authenticating to a system using Kerberos tickets without having access to an account's
    password.
    Observed use by Mimikatz (S0002): Mimikatz’s LSADUMP::DCSync and KERBEROS::PTT modules implement
    the three steps required to extract the krbtgt account hash and create/use Kerberos tickets.
    ATT&CK analytic: Detects unauthorized Kerberos ticket injection by correlating service ticket
    (TGS - 4769) requests with absent corresponding account logons (4624) and prior Ticket Granting
    Ticket (TGT - 4768) activity. Highlights anomalous service ticket generation chains involving
    unexpected users, hosts, or times, and suspicious injection of tickets via mimikatz-like tooling
    into LSASS...
