description: |
    Draft detection for T1550.002 (Pass the Hash), derived from ATT&CK detection strategy DET0409 /
    analytic AN1144.
    Adversaries may “pass the hash” using stolen password hashes to move laterally within an
    environment, bypassing normal system access controls. Pass the hash (PtH) is a method of
    authenticating as a user without having access to the user's cleartext password.
    Observed use by Mimikatz (S0002): Mimikatz's SEKURLSA::Pth module can impersonate a user, with
    only a password hash, to execute arbitrary commands.
    ATT&CK analytic: Detects anomalous NTLM LogonType 3 authentications that occur without
    accompanying domain logon events, especially from lateral systems or involving built-in
    administrative tools. Monitors for mismatches between source user context and system being
    accessed.
