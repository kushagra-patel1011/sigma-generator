title: Potential Credentials from Password Stores Activity Via Process Access
id: 8fd7f806-6200-5ba7-8b4c-185dbe19c3cb
status: experimental
description: |
    Draft detection for T1555 (Credentials from Password Stores), derived from ATT&CK detection
    strategy DET0430 / analytic AN1198.
    Adversaries may search for common password storage locations to obtain user credentials.
    Passwords are stored in several places on a system, depending on the operating system or
    application holding the credentials.
    Observed use by Mimikatz (S0002): Mimikatz performs credential dumping to obtain account and
    password information useful in gaining access to additional systems and enterprise network
    resources.
    ATT&CK analytic: Monitors suspicious access to password stores such as LSASS, DPAPI, Windows
    Credential Manager, or browser credential databases. Detects anomalous process-to-process access
    (e.g., Mimikatz accessing LSASS) and correlation of credential store file reads with execution
    of non-standard processes.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
