status: experimental
description: |
    Draft detection for T1555.003 (Credentials from Web Browsers), derived from ATT&CK detection
    strategy DET0037 / analytic AN0105.
    Adversaries may acquire credentials from web browsers by reading files specific to the target
    browser. Web browsers commonly save credentials such as website usernames and passwords so that
    they do not need to be entered manually in the future.
    Observed use by Mimikatz (S0002): Mimikatz performs credential dumping to obtain account and
    password information useful in gaining access to additional systems and enterprise network
    resources.
    ATT&CK analytic: Detects unauthorized access to web browser credential stores (e.g., Chrome
    Login Data, Edge Credential Locker) by processes other than the browser itself. Correlates file
    reads of credential databases with subsequent API calls to `CryptUnprotectData` or memory
    inspection attempts.
