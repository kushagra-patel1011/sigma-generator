title: Potential Security Account Manager Attack Chain Via 4 Correlated Log Sources
id: 17629af3-434b-5823-a0d9-58f8c4982a9e
status: experimental
description: |
    Draft correlation for T1003.002 (Security Account Manager). ATT&CK analytic AN0235 (strategy
    DET0085) describes this technique as 4 observable behaviours; this rule fires when all of them
    occur on the same host within 3m.
    Steps: 1) Process Creation; 2) Registry Modification; 3) File Creation; 4) File Change.
    Observed use by Mimikatz (S0002): Mimikatz performs credential dumping to obtain account and
    password information useful in gaining access to additional systems and enterprise network
    resources.
    ATT&CK analytic: An adversary running with SYSTEM-level privileges executes commands or accesses
    registry keys to dump the SAM hive or directly reads sensitive local files from the config
    directory. This behavior often involves sequential access to HKLM\SAM, HKLM\SYSTEM, and creation
    of .save or .dmp files, enabling offline hash extraction.
    Generated draft - step selections were mined from ATT&CK and must be validated against real
    telemetry before this rule is deployed.
references:
    - https://attack.mitre.org/techniques/T1003/002
    - https://attack.mitre.org/detectionstrategies/DET0085
    - https://attack.mitre.org/detectionstrategies/DET0085#AN0235
    - https://attack.mitre.org/software/S0002
    - https://github.com/Neohapsis/creddump7
author: sigma-generator
date: 2026-09-24
tags:
    - attack.credential-access
    - attack.t1003
    - attack.t1003.002
    - attack.s0002
correlation:
    type: temporal
    rules:
        - step1_process_creation
        - step2_registry_set
        - step3_file_event
        - step4_file_change
    group-by:
        - Computer
    timespan: 3m
falsepositives:
    - Legitimate administrative or software-deployment use of mimikatz.exe, net.exe, powershell.exe
    - 'Environment-specific tuning of CommandLinePattern: Detectable variations include `reg save`, `reg.exe save`, or PowerShell equivalents for dumping SAM/SYSTEM...'
    - 'Environment-specific tuning of TargetFilePath: Defenders can tune based on dump file path patterns (e.g., `%TEMP%\sam.save`, `C:\Users\Public\*.dmp`).'
    - 'Environment-specific tuning of RegistryPath: Tune for HKLM\SAM, HKLM\SYSTEM or access via direct \Device\Harddisk paths.'
    - Unknown
level: high
---
title: 'Security Account Manager - Step 1: Process Creation'
id: 6a1e7efc-f8e6-5cd0-aabe-873bc5f63efa
name: step1_process_creation
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
    selection_indicator_content:
        CommandLine|contains:
            - secretsdump.py
    condition: selection_image and selection_indicator_content
---
title: 'Security Account Manager - Step 2: Registry Modification'
id: 75959a2c-18a0-5fea-8baa-eac4ca21b3b4
name: step2_registry_set
logsource:
    category: registry_set
    product: windows
detection:
    selection_registry:
        TargetObject|contains:
            - '\SAM'
            - '\SYSTEM'
    condition: selection_registry
---
title: 'Security Account Manager - Step 3: File Creation'
id: 37912956-3c5b-5b59-b7b2-5abaf2e0f9a3
name: step3_file_event
logsource:
    category: file_event
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - ':\Users\Public\*.dmp'
            - '\Temp\sam.save'
    condition: selection_path
---
title: 'Security Account Manager - Step 4: File Change'
id: dd9c734d-ca4b-551d-8318-dd3465b17ff8
name: step4_file_change
logsource:
    category: file_change
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\mimikatz.exe'
            - '\net.exe'
            - '\pwdumpx.exe'
            - '\reg.exe'
    condition: selection_image
