title: Potential Silver Ticket Activity Via Windows Security
id: e8500546-8013-5be1-9715-2bc6586f6fcd
status: experimental
description: |
    Draft detection for T1558.002 (Silver Ticket), derived from ATT&CK detection strategy DET0241 /
    analytic AN0675.
    Adversaries who have the password hash of a target service account (e.g. SharePoint, MSSQL) may
    forge Kerberos ticket granting service (TGS) tickets, also known as silver tickets. Kerberos TGS
    tickets are also known as service tickets.
    Observed use by Mimikatz (S0002): Mimikatz's kerberos module can create silver tickets.
    ATT&CK analytic: Detects forged Kerberos Silver Tickets by identifying anomalous Kerberos
    service ticket activity such as malformed fields in logon events, TGS requests without
    interaction with the KDC, and access attempts using service accounts outside expected
    hosts/resources. Also monitors suspicious processes accessing LSASS memory for credential
    dumping.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
