    Draft detection for T1134.005 (SID-History Injection), derived from ATT&CK detection strategy
    DET0136 / analytic AN0383.
    Adversaries may use SID-History Injection to escalate privileges and bypass access controls. The
    Windows security identifier (SID) is a unique value that identifies a user or group account.
    Observed use by Mimikatz (S0002): Mimikatz's MISC::AddSid module can append any SID or
    user/group account to a user's SID-History.
    ATT&CK analytic: Detection of unauthorized modification of Active Directory SID-History
    attributes to escalate privileges. This chain involves: (1) privileged operations or API calls
    to DsAddSidHistory or related AD modification functions, (2) observed attribute changes in SID-
    History (Event ID 5136), (3) new logon sessions where the token includes unexpected or
    privileged SID-History values...
