title: Potential Security Account Manager Activity Via Process Creation
id: d74e5808-ee3e-5ee1-baa8-c59add490b88
status: experimental
description: |
    Draft detection for T1003.002 (Security Account Manager), derived from ATT&CK detection strategy
    DET0085 / analytic AN0235.
    Adversaries may attempt to extract credential material from the Security Account Manager (SAM)
    database either through in-memory techniques or through the Windows Registry where the SAM
    database is stored. The SAM is a database file that contains local accounts for the host,
    typically those found with the net user command.
    Observed use by Mimikatz (S0002): Mimikatz performs credential dumping to obtain account and
    password information useful in gaining access to additional systems and enterprise network
    resources.
    ATT&CK analytic: An adversary running with SYSTEM-level privileges executes commands or accesses
    registry keys to dump the SAM hive or directly reads sensitive local files from the config
    directory. This behavior often involves sequential access to HKLM\SAM, HKLM\SYSTEM, and creation
    of .save or .dmp files, enabling offline hash extraction.
    Generated draft - the selection values below were mined from ATT&CK and must be validated
    against real telemetry before this rule is deployed.
references:
