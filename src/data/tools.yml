# Tool lexicon for artefact extraction.
#
# The extractor only treats a word in ATT&CK prose as a tool name when it is
# listed here. A fixed vocabulary is deliberate: guessing tool names from
# English text ("Processes executing suspicious binaries") produces nonsense
# selections, while a curated list stays precise and reviewable.
#
# Sources: LOLBAS (https://lolbas-project.github.io), GTFOBins
# (https://gtfobins.github.io), LOOBins (https://www.loobins.io) and tooling that
# ATT&CK itself names repeatedly.
#
# windows / unix: matched as whole words, case-insensitively, at least 4 letters.
# contextual:     names that are short or ordinary English words. They count only
#                 when followed by one of the listed arguments, or when written with
#                 an .exe suffix (Windows).

