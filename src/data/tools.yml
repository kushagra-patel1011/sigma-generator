# Tools that exist on both families (curl ships with Windows 10 and later).
both:
  - curl
  - ssh
  - scp
  - sftp
  - rclone
  - nslookup

contextual:
  windows:
    reg: [add, query, delete, save, export, import, load, copy]
    sc: [create, config, start, stop, delete, qc, query, description, failure]
    net: [user, group, localgroup, use, share, view, start, stop, accounts, session]
    cmd: ["/c", "/k", "/q"]
    query: [user, session, process]
    arp: ["-a"]
    ftp: ["-s:"]
  unix:
    nc: ["-e", "-l", "-lvp", "-nv", "-z"]
    dd: ["if="]
    tar: ["-c", "-x", "-czf", "-xzf", czf, xzf]
    zip: ["-r", "-e", "-P"]
    rm: ["-rf", "-f"]
    security: [find-generic-password, find-internet-password, dump-keychain, add-trusted-cert, delete-certificate, unlock-keychain]
    defaults: [write, read, delete, import]
    profiles: [install, remove, list, show]
    history: ["-c", "-w"]
    unset: [HISTFILE]
    mount: ["-t", "-o"]

# Files Windows itself ships. ATT&CK prose names their paths because attacks *use*
# them ("rundll32.exe C:\Windows\System32\comsvcs.dll, MiniDump"), so a path ending
# in one of these is never treated as a file an attacker created. A dropped DLL
# with its own name (mimilib.dll copied into System32) is still a creation target.
# Sources: LOLBAS libraries and the credential providers ATT&CK names.
windows_system_files:
  - advapi32.dll
  - advpack.dll
  - amsi.dll
  - comsvcs.dll
  - cryptdll.dll
  - dbgcore.dll
  - dbghelp.dll
